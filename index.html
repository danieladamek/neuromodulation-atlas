<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Neuromodulation Explorer — a commissioned review of exogenous drives from coupling to outcome, in volumes, with a claims-only graph lab. Not peer reviewed; current as of 2026-09-15." />
    <meta name="color-scheme" content="light dark" />
    <title>Neuromodulation Explorer</title>
    <script>
      // Apply the persisted / system theme before first paint to avoid a flash.
      try {
        var t = localStorage.getItem('bx-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
