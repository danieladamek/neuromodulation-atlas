name: Deploy to GitHub Pages

# H1: the public site updates only on Daniel's explicit action — pushing a release tag (v*) or dispatching this
# workflow by hand. Pushes to main build a preview instead (ci.yml). Verify the live site after every run.
# The github-pages environment must allow the v* tag pattern as well as main, or a tag run is refused at deploy.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      # Validate + parse + link the content pack; fails loudly on any schema, citation, claim or id-ledger error.
      - run: npm run build:content
      - name: Generated outputs are committed
        run: git diff --exit-code --stat -- src/data public
      # Project site lives under /<repo>/ — vite.config.ts and the router both read BASE_PATH. No PREVIEW here.
      - run: BASE_PATH="/${{ github.event.repository.name }}/" npm run build
      - run: cp dist/index.html dist/404.html   # SPA fallback for deep links on GitHub Pages
      - name: Summary
        run: echo "Deploying pack \`$(node -p "require('./public/provenance.json').pack_hash.slice(0,12)")\` · commit \`${GITHUB_SHA::12}\` · ref \`${GITHUB_REF_NAME}\`" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
