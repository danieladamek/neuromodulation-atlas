  citation: Beisteiner R, Matt E, Fan C, Baldysiak H, Schonfeld M, Philippi Novak T, et al. Transcranial
    pulse stimulation with ultrasound in Alzheimer's disease - a new navigated focal brain therapy. Adv
    Sci. 2020;7(3):1902583.
  year: 2020
  doi: 10.1002/advs.201902583
  summary: 'The introductory paper for transcranial pulse stimulation, a method that delivers single ultrashort
    ultrasound shockwave pulses rather than a continuous or tone-burst beam. It bundles simulations, skull
    attenuation measurements, animal data, healthy-subject testing and an open-label series of 35 Alzheimer''s
    patients. Clinical pulses were roughly 3 microseconds long at 0.2-0.3 mJ/mm2 energy flux density,
    repeated at 5 Hz for about 6000 pulses per session under neuronavigation; measured temporal-peak intensity
    dropped by roughly 80-90% through human skull. Neuropsychological improvement persisted to three months
    and correlated with increased memory-network connectivity on fMRI, with tolerability high and no serious
    adverse events. The authors listed candidate mechanisms - transient membrane pore formation, neurotransmitter
    and neurotrophin changes (BDNF, GDNF, VEGF), microglial activation with amyloid clearance, nitric
    oxide signalling - and conceded the effects were uncontrolled preliminary data.

    '
  why_it_mattered: 'It defined a distinct acoustic family whose drive is a single-shot pressure transient
    with essentially no duty cycle, so its dose cannot be written in the Isppa/duty-cycle terms used for
    focused-ultrasound neuromodulation (aubry2025itrusst, martin2024itrusst); the atlas needs a separate
    dose vocabulary (energy flux density in mJ/mm2, pulse count) for this row.

    '
  role_here: prior-result
  role_note: 'v0-10 family = transcranial pulse stimulation. Fills: physical drive (single ~3 us shockwave
    pulse), dose quantities reported (0.2-0.3 mJ/mm2, 5 Hz, ~6000 pulses), coupling mechanism (candidate
    list, none established) and invasiveness. Its open-label design is the reason the ''evidence base''
    cell needed matt2025tpsrct.'
