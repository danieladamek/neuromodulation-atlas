  citation: 'Aston-Jones G, Cohen JD. An integrative theory of locus coeruleus-norepinephrine function:
    adaptive gain and optimal performance. Annual Review of Neuroscience. 2005;28:403-450.'
  year: 2005
  doi: 10.1146/annurev.neuro.28.061604.135709
  summary: 'Synthesising primate electrophysiology with computational modelling, Aston-Jones and Cohen
    argue that the locus coeruleus does more than set arousal: it sets neural gain, and it does so in
    two modes. Phasic LC responses, time-locked to task-relevant decisions, facilitate the behavioural
    response and support task engagement (exploitation); elevated tonic LC firing accompanies disengagement
    and favours exploration of alternatives. They propose that anterior cingulate and orbitofrontal projections
    supply LC with utility signals on several timescales, making LC mode a controlled variable rather
    than a passive index of wakefulness.

    '
  why_it_mattered: 'Adaptive gain is the standard functional account of the noradrenergic system and the
    reason nearly every vagus-nerve and arousal-based intervention is described as "recruiting LC-NE".
    It also supplies the phasic/tonic distinction that later dosing arguments (pulsed vs continuous taVNS)
    turn on.

    '
  role_here: support
  role_note: 'v0-8: carries the claim that a diffuse neuromodulator system implements gain control with
    distinct phasic and tonic regimes, which is what device-side VNS protocols claim to engage; the phasic/tonic
    split is the axis on which pervaz2025pupil resolves conflicting human results.'
