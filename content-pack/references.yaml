  citation: Capilla A, Pazo-Alvarez P, Darriba A, Campo P, Gross J. Steady-state visual evoked potentials
    can be explained by temporal superposition of transient event-related responses. PLoS One. 2011;6(1):e14543.
  year: 2011
  doi: 10.1371/journal.pone.0014543
  summary: 'The authors recorded human responses to checkerboard reversals at several rates and to jittered
    sequences, then synthesised predicted steady-state responses by shifting and summing the rate-matched
    transient evoked responses. Synthetic and recorded steady-state responses closely matched, and no
    signature of oscillatory entrainment at the stimulation frequency was found, so the steady-state response
    can be explained as linear superposition of transient responses rather than as an entrained endogenous
    rhythm.

