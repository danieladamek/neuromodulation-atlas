  citation: Boyden ES, Zhang F, Bamberg E, Nagel G, Deisseroth K. Millisecond-timescale, genetically targeted
    optical control of neural activity. Nat Neurosci. 2005;8(9):1263-1268.
  year: 2005
  doi: 10.1038/nn1525
  summary: 'Delivered channelrhodopsin-2, a light-gated cation channel from algae, to mammalian neurons
    by lentivirus and showed that brief light pulses drove reliable millisecond-timescale control of spiking
    and of excitatory and inhibitory synaptic transmission. A single gene plus light was sufficient, with
    no exogenous cofactor, making the approach immediately portable.

    '
  why_it_mattered: 'It created optogenetics, and with it the standard against which every other targeted
    neuromodulation modality is now measured: specificity comes from the genetically expressed actuator,
    while the physical stimulus only has to reach the tissue. For a review of coupling, it is the contrast
    case that shows what a purpose-built transducer buys you — sub-millisecond kinetics and cell-type
    selectivity — and, by requiring gene delivery and implanted light, what it costs.

    '
  role_here: contrast
  role_note: 'v0-5: the engineered-photoreceptor route to optical coupling, contrasted with endogenous
    photobiology (cytochrome c oxidase). v0-10: the specificity/invasiveness trade-off that organises
    the modality map. v0-2: cleanest example of molecular actuator determining circuit-level effect.'
