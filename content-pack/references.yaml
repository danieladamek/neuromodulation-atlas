  year: 2019
  doi: 10.1016/j.brs.2019.07.015
  summary: 'Applied focused ultrasound to rat ventral posterolateral thalamus while recording somatosensory
    evoked potentials from tibial-nerve stimulation, and separately induced heating with an optical fibre.
    Suppression of the evoked potentials scaled with spatial position and intensity but was independent
    of duty cycle, peak pressure and modulation frequency, and tracked measured temperature change, with
    no histological damage. The authors conclude that the dominant biophysical mechanism for reversible
    neuroinhibition at these exposures is thermal rather than mechanical.

    '
  why_it_mattered: 'It is the strongest positive case that a ''non-thermal'' low-intensity ultrasound
    effect is in fact thermal, made by showing that the parameters a mechanical model says should matter
    (duty cycle, peak pressure, modulation frequency) do not, while temperature does. That inverts the
    standard parameter narrative and forces every ultrasound study to report thermal simulation or measurement,
    not just intensity.

    '
