  citation: Menz MD, Ye P, Firouzi K, Nikoozadeh A, Butts Pauly K, Khuri-Yakub P, Baccus SA. Radiation
    force as a physical mechanism for ultrasonic neurostimulation of the ex vivo retina. J Neurosci. 2019;39(32):6251-6264.
  year: 2019
  doi: 10.1523/JNEUROSCI.2394-18.2019
  summary: 'Imaged isolated salamander retina during ultrasonic stimulation and observed micron-scale
    tissue displacements consistent with acoustic radiation force, the nonlinear transfer of momentum
    by a propagating wave. Sweeping the carrier frequency from 0.5 to 43 MHz, ganglion-cell responses
    grew stronger at higher frequencies, which is the opposite of what cavitation-based mechanisms predict
    and therefore excludes cavitation in this preparation. A quantitative radiation-force model accounted
    for the retinal responses and could plausibly account for earlier in vivo mouse results. Responses
    also depended strongly on transducer-to-array distance, showing that standing waves shape the effective
    stimulus.

    '
  why_it_mattered: 'This is the cleanest experimental separation of radiation force from cavitation as
    the physical carrier of ultrasonic neurostimulation, achieved by using frequency dependence as a discriminating
    test rather than by argument. It reframed the mechanism question from ''which channel'' to ''which
    physical force'', and it made standing waves a first-class confound for any ultrasound dosimetry claim.

    '
  role_here: contrast
  role_note: 'v0-5: acoustic radiation force and tissue shear as the coupling term, with frequency dependence
    as the discriminator against cavitation; carries the claim that the acoustic mechanism is preparation-dependent.
    v0-12: standing waves as an under-reported dosimetry confound.'
