  citation: Plaksin M, Shoham S, Kimmel E. Intramembrane cavitation as a predictive bio-piezoelectric
    mechanism for ultrasonic brain stimulation. Phys Rev X. 2014;4(1):011004.
  year: 2014
  doi: 10.1103/PhysRevX.4.011004
  summary: 'Proposes the neuronal intramembrane cavitation excitation (NICE) model: the lipid bilayer
    is treated as a bilayer sonophore whose two leaflets separate and re-approach under an acoustic field,
    so that ultrasound is rectified into a periodic membrane capacitance change that drives displacement
    currents and, through Hodgkin-Huxley-type conductances, spiking. The model builds directly on the
    bilayer-sonophore mechanics of Krasovitski et al. 2011 (PNAS, 10.1073/pnas.1015771108), which showed
    that a bilayer can absorb acoustic energy and expand the intramembrane space without any pre-existing
    gas body, with area strain scaling with pressure amplitude and inversely with the square root of frequency.
    NICE reproduced published thresholds qualitatively and quantitatively across pulsing regimes and predicted
    that duty cycle and intensity should bias excitation versus suppression. It is the first concrete
    biophysical account of low-intensity ultrasonic neurostimulation that makes falsifiable parameter
    predictions.

    '
  why_it_mattered: 'NICE gave the ultrasound field its first mechanistic theory with parameter-level predictions,
    and those predictions became the organising hypothesis for the whole excitation-versus-suppression
    debate: duty cycle and intensity as directionality knobs. Almost every later parameter study, including
    the inTUS meta-analysis, is scored against it. It also framed ultrasound coupling as a membrane-capacitive
    phenomenon rather than a channel-specific one, which is the alternative to the mechanosensitive-channel
    account.

    '
  role_here: prior-result
  role_note: 'v0-5: the capacitive/intramembrane-cavitation coupling hypothesis for ultrasound; supplies
    the claim ''ultrasound can couple to neurons via bilayer mechanics alone, without a dedicated receptor''.
    v0-14: one pole of the mechanism competition (membrane biophysics vs mechanosensitive channels vs
    thermal vs auditory).'
