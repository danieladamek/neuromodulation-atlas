  doi: 10.1016/S0006-3223(99)00230-9
  summary: 'First placebo-controlled, double-blind test of a single subanaesthetic dose of an NMDA receptor
    antagonist in depression. Seven patients with major depression each completed two randomised test
    days, intravenous ketamine 0.5 mg/kg versus saline. Within 72 h of ketamine, 25-item Hamilton scores
