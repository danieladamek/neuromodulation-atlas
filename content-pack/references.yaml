    stimulated? – A consensus and critical position paper. Clin Neurophysiol. 2022;140:59-97.'
  year: 2022
  doi: 10.1016/j.clinph.2022.04.022
  summary: 'This consensus paper covers what TMS activates. Its time-varying induced field acts mainly
    on superficial gyral cortex because it penetrates poorly with depth. The most likely primary targets
    are myelinated axon terminals of pyramidal cells and interneurons at the gyral crown. Activity then
    spreads through local intracortical circuits and along white-matter projections, and this spread depends
    on brain state. TMS also produces substantial somatosensory and auditory co-stimulation that must
    be controlled for. The paper combines measured and modelled evidence and flags which is which.

    '
  role_here: consensus
  role_note: 'v0-4: authoritative ''which element'' statement for TMS (axon terminals, gyral crown); v0-12:
    peripheral/auditory co-stimulation confound.'
