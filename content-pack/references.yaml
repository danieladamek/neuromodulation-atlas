  citation: Terzuolo CA, Bullock TH. Measurement of imposed voltage gradient adequate to modulate neuronal
    firing. Proc Natl Acad Sci USA. 1956;42(9):687-694.
  year: 1956
  doi: 10.1073/pnas.42.9.687
  summary: 'Terzuolo and Bullock set out to measure how sensitive nerve cells are to imposed electric
    fields, expressed as a voltage gradient, which earlier work on polarising currents had not quantified.
    Working on invertebrate neurons (crustacean preparations; confirm species in full text), they found
    that changing the firing frequency of an already-active neuron needs a much smaller gradient than
    exciting a silent one. This distinction between modulating ongoing activity and initiating activity
    from rest comes from this paper.

