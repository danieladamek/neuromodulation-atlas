  citation: 'Bienenstock EL, Cooper LN, Munro PW. Theory for the development of neuron selectivity: orientation
    specificity and binocular interaction in visual cortex. J Neurosci. 1982;2(1):32-48.'
  year: 1982
  doi: 10.1523/JNEUROSCI.02-01-00032.1982
  summary: 'The paper sets out a mathematical learning rule for cortical synapses. Under the rule, the
    sign and size of a synaptic change depend on the current postsynaptic activity compared with a threshold
    set by the neuron''s time-averaged activity. Input patterns, not converging fibres, compete with one
    another. Simulations produced orientation tuning and ocular-dominance patterns that matched data from
    cats and monkeys reared normally and in altered visual environments.

    '
  why_it_mattered: 'The BCM rule introduced a modification threshold that slides with the neuron''s activity
    history. This is the formal basis for metaplasticity and for "homeostatic" explanations of why a stimulation
    protocol''s effect can flip sign depending on what came before it.

    '
  role_here: support
  role_note: 'v0-6: the sliding modification threshold as the theory behind metaplastic and priming interactions
    in NIBS (siebner2004preconditioning, ziemann2008gating).'
