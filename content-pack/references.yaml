  tier: classic
  citation: Zrenner C, Desideri D, Belardinelli P, Ziemann U. Real-time EEG-defined excitability states
    determine efficacy of TMS-induced plasticity in human motor cortex. Brain Stimulation. 2018;11(2):374-389.
  year: 2018
  doi: 10.1016/j.brs.2017.11.016
  summary: 'Using millisecond-latency real-time EEG analysis to trigger TMS, the authors delivered otherwise
    identical repetitive triple-pulse bursts at either the negative or the positive peak of the sensorimotor
    mu-rhythm. Negative-peak phases corresponded to high corticospinal excitability and positive peaks
    to low excitability, and repeated stimulation locked to the high-excitability phase produced LTP-like
    potentiation of motor evoked potentials while the same protocol locked to the low-excitability phase
    produced no change. The direction of plasticity was therefore set by the endogenous state at the moment
    of stimulation rather than by the stimulation parameters.

    '
  why_it_mattered: 'This is the clearest human demonstration that brain state is a dose-determining variable,
    and it reframes inter-individual variability of rTMS as partly a timing artefact. It launched brain-state-dependent
    and phase-locked stimulation as a design principle rather than a curiosity.

    '
  role_here: support
  role_note: 'v0-6/v0-8/v0-12: carries the state-dependence claim that the same exogenous drive yields
    opposite cellular outcomes depending on ongoing phase; pairs with silvanto2008state and corp2020variability
    (collected). Note the companion EEG-level null (Desideri et al. 2018, PLOS ONE 10.1371/journal.pone.0208747)
    showing no corresponding change in TMS-EEG measures.'
