  citation: Lipsman N, Meng Y, Bethune AJ, et al. Blood-brain barrier opening in Alzheimer's disease using
    MR-guided focused ultrasound. Nat Commun. 2018;9:2336.
  year: 2018
  doi: 10.1038/s41467-018-04529-6
  summary: 'Phase I safety trial in five patients with early-to-moderate Alzheimer''s disease: MR-guided
    focused ultrasound with intravenous microbubbles opened the blood-brain barrier within the target
    volume safely, reversibly and repeatedly, with no serious clinical or radiographic adverse events
    and no clinically significant cognitive decline at three months. Amyloid burden was tracked with [18F]-florbetaben
    PET and exploratory analysis showed no group-level change after sonication.

    '
  why_it_mattered: 'First-in-human demonstration that the Hynynen-O''Reilly technique transfers to the
    human skull and brain with acceptable safety, which is what moved ultrasound-mediated BBB opening
    from animal physics to a clinical delivery platform. The null amyloid result is equally important:
    it separates the engineering claim (the barrier opens) from the therapeutic claim (something changes),
    and the review should keep those apart.

    '
  role_here: prior-result
  role_note: 'v0-5 and v0-11: human proof that acoustic coupling to the neurovascular unit is controllable;
    carries the claim that barrier opening is achievable while therapeutic benefit remains unproven. v0-13:
    translation exemplar.'
