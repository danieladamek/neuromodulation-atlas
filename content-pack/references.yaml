- n: 88
  tier: seminal
  citation: 'Wong-Riley MTT, Liang HL, Eells JT, Chance B, Henry MM, Buchmann E, Kane M, Whelan HT. Photobiomodulation
    directly benefits primary neurons functionally inactivated by toxins: role of cytochrome c oxidase.
    J Biol Chem. 2005;280(6):4761-4771.'
  year: 2005
  doi: 10.1074/jbc.M409650200
  summary: 'Tested the hypothesis that cytochrome c oxidase is the near-infrared photoacceptor by competing
    670 nm LED light against potassium cyanide, an irreversible inhibitor of the enzyme, in primary neuron
    cultures. Light partially restored enzyme activity blocked by 10-100 micromolar KCN and cut cell death
    from 83.6% to 43.5% at 300 micromolar, but protection failed at millimolar KCN; light completely reversed
    the effect of tetrodotoxin, which only indirectly downregulates the enzyme. Across 670, 728, 770,
    830 and 880 nm, efficacy tracked the absorption spectrum of oxidised cytochrome c oxidase (830 and
    670 nm effective, 728 nm not).

    '
  why_it_mattered: 'This is the mechanistic foundation of photobiomodulation in neural tissue: it identifies
    a specific molecular photoacceptor, and it does so with the two strongest available arguments — competition
    with a specific inhibitor and a wavelength-response that matches an absorption spectrum. Every subsequent
    claim that red or near-infrared light acts on mitochondrial respiration rests on it, and the action-spectrum
    logic is what distinguishes photobiomodulation from generic heating.

    '
  role_here: support
  role_note: 'v0-5: cytochrome c oxidase as the photoacceptor, and action-spectrum matching as the method
    for identifying an optical coupling target. v0-7: mitochondria as a convergence node.'
