  citation: 'Belelli D, Lambert JJ. Neurosteroids: endogenous regulators of the GABA-A receptor. Nat Rev
    Neurosci. 2005;6(7):565-575.'
  year: 2005
  doi: 10.1038/nrn1703
  summary: 'Review establishing that certain pregnane steroids potently and selectively enhance GABA-A
    receptor function by a direct, non-genomic action, and that this pharmacology accounts for their anxiolytic,
    analgesic, anticonvulsant, sedative, hypnotic and anaesthetic effects. Crucially, these steroids act
    both as circulating endocrine messengers and as locally synthesised neurosteroids that modulate neuronal
    activity where they are made, so the same molecule can constitute a systemic drive or a local one.

    '
  why_it_mattered: 'It defined an endogenous positive allosteric modulator system, i.e. a physiological
    gain control on inhibition that a drug can occupy. That is the template for treating pharmacology
    as neuromodulation rather than as agonism: the drug does not carry the signal, it changes the transfer
    function of a receptor that endogenous ligands already use. Brexanolone and zuranolone are the direct
    clinical descendants.

    '
  role_here: prior-result
  role_note: 'v0-5, v0-11 and v0-9: carries the allosteric-modulation claim (drive as gain change, not
    as input) and the endocrine-to-local continuum that connects the pharmacology chapter to the body-systems
    chapter.'
