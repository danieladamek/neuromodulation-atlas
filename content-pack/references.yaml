  citation: Sapareto SA, Dewey WC. Thermal dose determination in cancer therapy. Int J Radiat Oncol Biol
    Phys. 1984;10(6):787-800.
  year: 1984
  doi: 10.1016/0360-3016(84)90379-1
  summary: 'Derives a clinically usable thermal dose by converting an arbitrary time-temperature history
    into an equivalent exposure time at a reference temperature, with 43 degrees C chosen as that reference
    — the quantity now written CEM43. The paper gives the underlying time-temperature (Arrhenius-type,
    with a break temperature) relationship, supplies a program for computing both equivalent-minutes and
    degree-minutes, allows the reference and break temperatures to be changed, and discusses step-down
    heating, thermotolerance and physiological state. The authors note the relationship does not assume
    equal heat sensitivity across tissues and present the formulation as a simple practical standard rather
    than the only possible one.

    '
  why_it_mattered: 'CEM43 is the reason thermal interventions have a transferable dose unit at all: it
    collapses an arbitrary heating history into one number that can be accumulated in real time during
    treatment and compared across studies. Every thermal safety limit and every MRgFUS ablation protocol
    is expressed in it, and it is the closest analogue in the thermal domain to what E-field models provide
    for electromagnetic stimulation.

    '
  role_here: method
  role_note: 'v0-3 and v0-5: the definitional source for thermal dose (CEM43) used for both ablative coupling
    and thermal-safety limits on non-ablative ultrasound, light and implant heating. Anchors the cross-modality
    dose comparison in v0-10.'
