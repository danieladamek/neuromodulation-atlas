  citation: Bikson M, Inoue M, Akiyama H, Deans JK, Fox JE, Miyakawa H, Jefferys JGR. Effects of uniform
    extracellular DC electric fields on excitability in rat hippocampal slices in vitro. J Physiol. 2004;557(Pt
    1):175-190.
  year: 2004
  doi: 10.1113/jphysiol.2003.055772
  summary: 'In rat hippocampal slices, the authors applied uniform DC fields and recorded with several
    electrophysiological and imaging methods. Fields below 40 mV/mm (40 V/m) parallel to the somato-dendritic
    axis polarised CA1 pyramidal somata linearly, at a mean of about 0.12 mV per mV/mm. Polarisation varied
    along the cell and was largest at the dendritic tips, with time constants of about 15–70 ms. Stronger
    fields triggered spontaneous firing and epileptiform activity, and changes in excitability outlasted
    the field by more than a second. Fields perpendicular to the main axis did not polarise the soma but
    still changed afferent (synaptic) responses. The authors concluded that fields modulate excitability
    continuously through compartment-specific polarisation, with no clear threshold.

    '
  why_it_mattered: 'This paper gives the uniform-field "coupling constant" (about 0.1–0.2 mV somatic polarisation
    per V/m) that almost every tES mechanism argument relies on. It also established orientation dependence
    and non-uniform, compartment-specific polarisation, the opposite-sign polarisation at the two ends
    of a neuron.

    '
  role_here: support
  role_note: 'v0-4: measured somatic polarisation per unit field (rodent in vitro), orientation dependence,
    dendritic vs somatic polarisation.'
