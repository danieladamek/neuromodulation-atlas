  summary: 'A critical appraisal of how electrical stimulation actually recruits motor units. The authors
    argue that recruitment is non-selective, spatially fixed and temporally synchronous rather than following
    the orderly size principle of voluntary contraction - and in particular that the textbook claim of
    strict reverse (large-to-small) recruitment is not supported. Because the same units fire synchronously
