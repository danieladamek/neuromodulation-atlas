  citation: 'Martelli D, McKinley MJ, McAllen RM. The cholinergic anti-inflammatory pathway: a critical
    review. Autonomic Neuroscience. 2014;182:65-69.'
  year: 2014
  doi: 10.1016/j.autneu.2013.12.007
  summary: 'A point-by-point audit of the evidence for the cholinergic anti-inflammatory pathway. The
    authors accept that stimulating the cut peripheral end of either vagus suppresses local and systemic
    inflammation, that the spleen is where systemic TNF is produced and suppressed, that the effect requires
    noradrenergic nerve terminals in the spleen and ChAT+ T lymphocytes, and that alpha7 nicotinic receptors
    are essential. They reject the proposed disynaptic vagus-to-splenic-nerve connection, noting vagal
    stimulation does not drive splenic nerve action potentials, and conclude the pathway is pharmacologically
    and electrically activatable but is not the efferent arm of a physiological reflex to endotoxaemia.

    '
