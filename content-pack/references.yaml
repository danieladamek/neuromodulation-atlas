  summary: 'Gut sensing had been assumed to be hormonal and slow because no synapse was known between
    the epithelium and the vagus. Working in mice, the authors showed that enteroendocrine cells form
    glutamatergic synapses with vagal afferents and transduce luminal stimuli in milliseconds; they call
