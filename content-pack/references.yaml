  citation: Rattay F. Analysis of models for external stimulation of axons. IEEE Trans Biomed Eng. 1986;BME-33(10):974-977.
  year: 1986
  doi: 10.1109/TBME.1986.325670
  summary: 'Rattay modelled an axon as a chain of discrete compartments (nodes of Ranvier for myelinated
    fibres, arbitrary segments for unmyelinated ones), combining time-dependent membrane equations with
    spatial difference equations for the extracellular potential. He showed that both fibre types obey
    the same formal structure and that the driving term for excitation is the second spatial difference/derivative
    of the extracellular potential along the fibre. This term, the "activating function", predicts where
    depolarisation and hyperpolarisation occur for a monopolar electrode and generalises to other electrode
    layouts. The result is theoretical; it is not a measurement.

    '
  why_it_mattered: 'The activating function became the standard first-order explanation of where extracellular
    stimulation excites a fibre (fibre ends, bends and points where the field gradient changes). It underpins
    later "which element is activated" modelling for DBS, SCS and TMS, and the contrast with uniform-field
    polarization, where terminals and bends dominate.

    '
  role_here: support
  role_note: 'v0-4: formal statement of the activating function (computational claim); basis for axon-vs-soma
    and fibre-geometry arguments.'
