  citation: Meister M. Physical limits to magnetogenetics. eLife. 2016;5:e17210.
  year: 2016
  doi: 10.7554/eLife.17210
  summary: 'A first-principles analysis of how magnetic fields can act on biological molecules and cells,
    applied to two published claims: that ferritin-containing protein complexes act as compass needles,
    and that magnetic fields can gate ferritin-tethered ion channels. Meister shows the required forces,
    torques and heating exceed what paramagnetic ferritin can supply by roughly five to ten orders of
    magnitude, so if the reported phenomena are real they must have some other cause; paramagnetism fundamentally
    limits ferritin as an engineering handle for magnetically sensitive cells.

    '
  why_it_mattered: 'It is the model of a physics-based falsification in neuromodulation: rather than failing
    to replicate, it shows the proposed coupling cannot work at the stated magnitudes, which is a stronger
    and more transferable result. For a review organised around biophysical coupling it is the load-bearing
    example of why every claimed mechanism needs an order-of-magnitude check, and it remains the standing
    objection to ferritin magnetogenetics.

    '
  role_here: contrast
  role_note: 'v0-5 and v0-14: the order-of-magnitude feasibility test applied to a claimed coupling mechanism;
    carries the claim that magnetogenetics as proposed is physically implausible while magnetothermal
    nanoparticle heating (Chen et al. 2015, 10.1126/science.1261821) is not. v0-12: how to adjudicate
    mechanism disputes.'
