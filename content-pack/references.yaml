  citation: Borovikova LV, Ivanova S, Zhang M, Yang H, Botchkina GI, Watkins LR, et al. Vagus nerve stimulation
    attenuates the systemic inflammatory response to endotoxin. Nature. 2000;405(6785):458-462.
  year: 2000
  doi: 10.1038/35013070
  summary: 'The authors showed that acetylcholine strongly suppresses release of TNF, IL-1beta, IL-6 and
    IL-18 (but not IL-10) from LPS-stimulated human macrophages, and that direct electrical stimulation
    of the peripheral vagus nerve in rats during lethal endotoxaemia inhibited hepatic TNF synthesis,
    blunted peak serum TNF and prevented shock. Efferent vagal signalling was thus identified as a parasympathetic
    anti-inflammatory pathway, distinct from the previously described afferent vagal route to HPA-axis
    anti-inflammatory responses.

    '
  why_it_mattered: 'This is the founding experiment of bioelectronic medicine: it showed a nerve-stimulation
    dose could change a molecular immune endpoint and a survival outcome, making the immune system a legitimate
    target organ for neuromodulation. Everything in V0''s body-systems chapter that runs drive to cytokine
    descends from it.

    '
  role_here: prior-result
