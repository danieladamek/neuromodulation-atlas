  citation: 'Fries P. A mechanism for cognitive dynamics: neuronal communication through neuronal coherence.
    Trends in Cognitive Sciences. 2005;9(10):474-480.'
  year: 2005
  doi: 10.1016/j.tics.2005.08.011
  summary: 'Fries proposes that effective communication between neuronal groups is carried by coherence
    rather than by firing rate alone. Active groups oscillate, so their excitability fluctuates rhythmically,
    which opens and closes short windows in which input can be received and output can be emitted. Two
    groups therefore influence each other effectively only when their windows align, i.e. when they are
    coherent at a consistent phase relation. Because coherence can be re-established quickly and selectively,
    a changing pattern of coherence amounts to a changing effective connectivity that can be reconfigured
    on cognitive timescales. The 2015 Neuron update ("Rhythms for Cognition") adds the gamma/alpha-beta
    division of labour and theta-rhythmic sampling.

    '
  why_it_mattered: 'This is the reference account that licenses treating an oscillation as a control variable
    rather than an epiphenomenon, and it is the theoretical basis for every entrainment-style intervention
    (tACS, rhythmic TMS, sensory flicker, phase-locked stimulation): if phase gates communication, imposing
    phase should change routing. V0 needs it as the circuit-level bridge between coupling physics and
    behavioural outcome.

    '
  role_here: support
  role_note: 'v0-8: carries the claim that oscillatory phase gates inter-areal communication, which is
    the mechanism entrainment-based modalities are assumed to exploit; pairs with frohlich2010endogenous
    and krause2022brain (already collected) on whether exogenous fields can actually impose that phase.'
  cited_in:
