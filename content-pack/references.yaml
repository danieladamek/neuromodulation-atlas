  citation: Horn A, Reich M, Vorwerk J, Li N, Wenzel G, Fang Q, et al. Connectivity predicts deep brain
    stimulation outcome in Parkinson disease. Annals of Neurology. 2017;82(1):67-78.
  year: 2017
  doi: 10.1002/ana.24974
  summary: 'In 51 patients with STN DBS for Parkinson''s disease, the authors combined electrode localisation
    with normative human connectome data (diffusion tractography and resting-state fMRI) to find which
    connections of the stimulation volume tracked motor improvement. Structural and functional connectivity
    were independent predictors, with supplementary-motor-area connectivity and anticorrelation with M1
    prominent, and the same profile predicted outcome in an independent cohort from another centre. Prediction
    worked using normative connectomes, i.e. without patient-specific imaging.

    '
  why_it_mattered: 'This established DBS connectomics: the therapeutic unit is the set of fibres and networks
    a stimulation volume touches, not the nucleus it sits in, and normative connectomes are enough to
    model it. It made cross-modality comparison possible (same connectome framework for DBS, TMS, lesions)
    and underpins the convergence result in siddiqi2021circuits.

    '
  role_here: support
  role_note: 'v0-8: carries the claim that DBS outcome is a function of connectivity of the stimulated
    volume; with peterchev2012dose and johnson2020dose (collected) it links dose-in-tissue to network-level
    effect.'
