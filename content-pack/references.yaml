  doi: 10.1002/cpt.2545
  summary: 'Review of what actually determines CNS target-site exposure: passive diffusional transport
    plus active influx and efflux at the barrier, then intra-CNS distribution between plasma, brain extracellular
    fluid and CSF compartments. The authors argue for a combinatory mapping approach that ties quantitative
    in vivo and ex vivo animal measurements to physiologically based mathematical models (LeiCNS-PK3.0)
    for animal-to-human translation, note that disease-related changes in barrier function usually do
    not translate into large gains in penetration, and conclude that carrier-based strategies remain the
    more promising route for large molecules.

