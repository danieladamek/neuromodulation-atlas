  citation: McCreery DB, Agnew WF, Yuen TGH, Bullara LA. Charge density and charge per phase as cofactors
    in neural injury induced by electrical stimulation. IEEE Trans Biomed Eng. 1990;37(10):996-1001.
  year: 1990
  doi: 10.1109/10.102812
  summary: 'Platinum surface electrodes of different areas (0.002–0.5 cm²) on cat cerebral cortex were
    pulsed continuously for 7 h with charge-balanced 400 µs/phase pulse pairs at 50 Hz. Neural injury
    depended on charge density and charge per phase acting together, across roughly 10–800 µC/cm² and
    0.05–5 µC/phase. Neither variable alone predicted damage.

    '
  why_it_mattered: 'This is the empirical dataset behind the two-parameter (charge density × charge per
    phase) safety space that Shannon''s equation later fitted, and it underlies implant safety limits.

    '
