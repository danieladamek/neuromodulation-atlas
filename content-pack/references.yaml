  tier: seminal
  citation: Fox MD, Buckner RL, White MP, Greicius MD, Pascual-Leone A. Efficacy of transcranial magnetic
    stimulation targets for depression is related to intrinsic functional connectivity with the subgenual
    cingulate. Biological Psychiatry. 2012;72(7):595-603.
  year: 2012
  doi: 10.1016/j.biopsych.2012.04.028
  summary: 'Using resting-state fMRI from 98 healthy subjects, the authors computed the connectivity fingerprint
    of the various left DLPFC coil positions that had been used in published rTMS depression trials, and
    asked whether those fingerprints tracked the trials'' reported efficacy. Sites with better reported
    antidepressant efficacy were the ones more strongly anticorrelated with the subgenual cingulate. They
    inverted this into a targeting rule, deriving optimal DLPFC coordinates in BA46, and showed the same
    connectivity pattern was reproducible in an independent sample of 13 depressed patients. The design
    is correlational and retrospective: efficacy was taken from the literature, not measured in these
    subjects.

    '
  why_it_mattered: 'This paper converted "where to put the coil" from a scalp-measurement problem into
    a network problem and created the connectivity-based targeting paradigm now used in accelerated iTBS
    protocols. It is also the origin of the sgACC-anticorrelation biomarker whose replication record is
    contested, so it anchors both a support claim and a dissent claim in V0.

    '
  role_here: support
  role_note: 'v0-8: carries the claim that the effective target of a cortical intervention is a network
    node defined by connectivity, not a scalp location; the positive pole of the sgACC-targeting competing-hypothesis
    pair with elbau2023connectivity.'
