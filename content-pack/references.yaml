  citation: 'Franks NP. General anaesthesia: from molecular targets to neuronal pathways of sleep and
    arousal. Nat Rev Neurosci. 2008;9(5):370-386.'
  year: 2008
  doi: 10.1038/nrn2372
  summary: 'Review arguing that although general anaesthetics are chemically very diverse, a small number
    of molecular targets account for their action, and that the route from those targets to reversible
    loss of consciousness runs through the endogenous sleep and arousal circuitry. Comparison with natural
    sleep is used as the organising tool, and the thalamus and the networks regulating its activity are
    identified as central to anaesthetic-induced loss of consciousness.

    '
  why_it_mattered: 'It is the canonical statement that a drug''s molecular target and its behavioural
    effect are separated by a circuit, and that the circuit is an existing physiological control system
    the drug hijacks rather than a novel pathway. That multiscale argument — molecule, to receptor, to
    thalamocortical network, to global state — is the pharmacological template for V0''s chain, and anaesthesia
    remains the most complete example of a fully reversible, titratable, whole-brain state perturbation.

    '
  role_here: review
  role_note: 'v0-11, v0-2 and v0-8: carries the claim that pharmacological state control works by engaging
    endogenous arousal circuitry, making anaesthesia the reference case for reversible circuit perturbation
    and the comparator for state-dependence claims (silvanto2008state, collected).'
