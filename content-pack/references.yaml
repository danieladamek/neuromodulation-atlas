  citation: 'Herrmann CS. Human EEG responses to 1-100 Hz flicker: resonance phenomena in visual cortex
    and their potential correlation to cognitive phenomena. Exp Brain Res. 2001;137(3):346-353.'
  year: 2001
  doi: 10.1007/s002210100682
  summary: 'Ten human subjects viewed flickering light stepped in 1 Hz increments across 1-100 Hz while
    EEG steady-state responses were recorded. Response amplitude was not flat across frequency: clear
    resonance peaks appeared near 10, 20, 40 and 80 Hz, paralleling preferred frequencies reported in
    animal visual cortex. The author argued these preferred frequencies could be the substrate of gamma
    oscillations seen in feature-binding experiments.

    '
  why_it_mattered: 'It is the frequency-response curve on which all later sensory-entrainment dosing rests:
    it establishes that the driven cortical response depends on the drive frequency in a resonant, non-monotonic
    way, so ''frequency'' is a genuine dose parameter for the sensory row rather than an arbitrary setting,
    and it supplies the human rationale for the 40 Hz choice that later amyloid work adopted.

    '
  role_here: prior-result
  role_note: 'v0-10 family = sensory (audio-visual) entrainment. Fills: physical drive (patterned light/sound),
    coupling mechanism (sensory transduction into cortical rhythmic response) and dose quantities reported
    (frequency as the dose axis, with measured resonance peaks). Also v0-8 as the human anchor for resonance/entrainment
    alongside frohlich2010endogenous and fries2005coherence.'
