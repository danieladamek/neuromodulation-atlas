  year: 2006
  doi: 10.1001/archpsyc.63.8.856
  summary: 'Double-blind, placebo-controlled crossover trial in 18 patients with treatment-resistant major
    depression, each receiving intravenous ketamine 0.5 mg/kg and placebo on separate days after washout.
    Improvement on the 21-item Hamilton scale was detectable within 110 minutes and persisted for about
    a week; response was 71% and remission 29% at day 1.

    '
  why_it_mattered: 'This is the replication that made rapid-acting antidepressant pharmacology a field:
    a single exposure, an effect within two hours, and a benefit outlasting drug clearance by days. The
    dissociation between the drug''s pharmacokinetic half-life and the duration of the behavioural effect
    is the cleanest pharmacological statement of the V0 idea that the outcome is carried by an induced
    plastic change rather than by continuing receptor occupancy.

    '
  role_here: prior-result
  role_note: 'v0-11, v0-6 and v0-3: carries the exposure-versus-effect-duration dissociation that separates
    a drug''s PK from its neuromodulatory dose. It is also the comparator every drug-plus-device and ketamine-versus-ECT
    trial (anand2023elektd, ekstrand2022ketect) is calibrated against.'
