    2024;49(1):150-162.'
  year: 2024
  doi: 10.1038/s41386-023-01677-2
  summary: 'A current mechanism review that poses the family''s central unresolved question directly:
    whether ECT''s antidepressant action comes from the electrical stimulation itself, from the induced
    generalised seizure, or from their interaction. The authors note ECT''s speed and efficacy relative
    to pharmacotherapy alongside its cognitive cost, review how recent parameter changes have improved
    cognitive outcomes without sacrificing efficacy, and argue that resolving the seizure-versus-field
    question is the route to safer next-generation seizure-based therapies.

    '
