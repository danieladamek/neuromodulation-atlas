  citation: Tittelmeier J, Kaub L, Milz S, Kugelmann D, Hof PR, Schmitz C, Nussbaum-Krammer C. Insufficient
    low-level near infrared light penetration challenges the efficacy of transcranial photobiomodulation.
    Brain Stimul. 2025;18(4):1220-1223.
  year: 2025
  doi: 10.1016/j.brs.2025.07.001
  summary: 'Correspondence measuring transmission of NIR light from commercial transcranial devices through
    the human skull. More than 99% of the light was absorbed or scattered; maximum transmittance was 0.31%
    (905 nm laser) to 0.71% (810 nm LED helmet). In cell experiments, mitochondrial stimulation appeared
