  citation: Little S, Pogosyan A, Neal S, Zavala B, Zrinzo L, Hariz M, et al. Adaptive deep brain stimulation
    in advanced Parkinson disease. Annals of Neurology. 2013;74(3):449-457.
  year: 2013
  doi: 10.1002/ana.23951
  summary: 'In eight patients with advanced Parkinson''s disease, subthalamic beta-band local field potentials
    recorded from the stimulating electrode were used online to gate stimulation, so that current was
    delivered only when the pathological beta burst exceeded threshold. Blinded motor scores improved
    50% with adaptive stimulation, about 27% better than conventional continuous stimulation, while total
    stimulation time fell by 56%; random intermittent stimulation did not match it, showing the benefit
    came from the timing, not from intermittency per se.

    '
  why_it_mattered: 'This is the proof of principle for closed-loop neuromodulation in humans: a pathological
    neural signal was used as both biomarker and controller, and better outcomes were achieved with less
    delivered charge. It established beta power as the reference adaptive-DBS control variable and started
    the control-theoretic line of work that culminates in trials like oehrn2024adaptive.

    '
  role_here: prior-result
  role_note: 'v0-8/v0-13: carries the claim that a circuit biomarker can control dose in real time and
    that timing relative to brain state is part of dose; ties to peterchev2012dose (collected) on what
    dose means when delivery is state-gated.'
