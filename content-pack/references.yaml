  citation: 'Marder E. Neuromodulation of neuronal circuits: back to the future. Neuron. 2012;76(1):1-11.'
  year: 2012
  doi: 10.1016/j.neuron.2012.09.010
  summary: 'Review arguing that all nervous systems are subject to neuromodulation. Neuromodulatory substances
    arrive as local hormones, as cotransmitters released by projection neurons, and via the circulation.
    They change neurons'' intrinsic firing properties and effective synaptic strengths, reconfiguring
    circuits and substantially changing behavioural output. The anatomical connectome is therefore only
    a scaffold, and the neuromodulatory state determines which functional circuit operates.

    '
  why_it_mattered: 'This is the canonical statement of the cellular/circuit meaning of "neuromodulation"
    (neuromodulators acting on intrinsic and synaptic properties, largely from invertebrate small-circuit
    work). That meaning predates and collides with the clinical-device sense used by INS.

    '
  role_here: contrast
  role_note: 'v0-1: primary anchor for the cellular sense of ''neuromodulator/neuromodulation'' that collides
    with the clinical/device sense (north2022glossary, ins2024definition). Also v0-2: circuit function
    is set by modulatory state, not wiring alone.'
