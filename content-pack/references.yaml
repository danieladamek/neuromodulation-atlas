  year: 2022
  doi: 10.1038/s41380-022-01661-0
  summary: 'Umbrella review of 17 systematic reviews, meta-analyses and large cohort or genetic studies
    searched to December 2020. Serotonin metabolite concentrations showed no association with depression;
    serotonin transporter binding evidence was weak and inconsistent; 5-HT1A binding meta-analyses showed
    reduced binding in some regions but inconsistently; and the largest gene association studies (n=115,257
    and n=43,165) found no serotonin-transporter-genotype by stress interaction. The authors conclude
    the main research areas give no support to the idea that depression is caused by lowered serotonin,
    and raise the possibility that antidepressants lower serotonin.

    '
