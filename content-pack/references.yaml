  summary: 'The authors changed overall activity in cultured rat neocortical neurons. When activity was
    blocked, quantal (mEPSC) amplitudes grew across all synapses. When GABA-A receptors were blocked,
    firing first rose and then returned toward baseline as quantal amplitudes shrank. They called this
