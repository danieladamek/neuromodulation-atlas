  citation: Grill WM, Snyder AN, Miocinovic S. Deep brain stimulation creates an informational lesion
    of the stimulated nucleus. NeuroReport. 2004;15(7):1137-1140.
  year: 2004
  doi: 10.1097/00001756-200405190-00011
  summary: 'Grill and colleagues modelled intrinsically active neurons under extracellular stimulation
    at a range of frequencies and showed that high-frequency stimulation forces output spiking to become
    regular and essentially variance-free, i.e. the cell keeps firing but stops transmitting information.
    This "informational lesion" reconciles two facts that neither simple inhibition nor simple excitation
    explains: that clinical benefit requires high frequency, and that the clinical picture resembles a
    lesion even though axonal output is being driven. The account treats the therapeutic effect as the
    removal of pathological patterning rather than a change in mean rate.

    '
  why_it_mattered: 'It is the canonical statement of the pattern-vs-rate framing of DBS mechanism and
    the reference point for every later mechanism proposal (antidromic cortical activation, network desynchronisation,
    fibre-pathway activation). V0''s competing-hypothesis map for device mechanism starts here.

    '
  role_here: prior-result
  role_note: 'v0-8/v0-14: carries the informational-lesion hypothesis as one pole of the DBS mechanism
    map; the competing poles are excitation/antidromic cortical recruitment and network-level desynchronisation,
    and the dissent is that high-frequency stimulation drives, not silences, efferent axons (see mirzakhalili2020biophysics
    and capogrosso2013computational, collected).'
