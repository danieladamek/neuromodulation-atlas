  doi: 10.1001/archpsyc.58.2.199
  summary: 'The report that established magnetic seizure therapy as a technique: high-intensity, high-frequency
    repetitive TMS delivered under general anaesthesia to anaesthetised rhesus macaques induced generalised
    seizures deliberately and reproducibly, showing that a magnetically induced current confined largely
    to superficial cortex can recruit a full convulsion. No abstract was retrievable in this session,
