  year: 2017
  doi: 10.1016/j.expneurol.2016.12.005
  summary: 'Direct recordings in rat locus coeruleus (and mesencephalic trigeminal nucleus, as a control
    for non-specific recruitment) across a parameter grid of current amplitude, pulse frequency, train
    duration, inter-train interval and pulse width. Half-second VNS trains drove rapid phasic LC firing
    from 0.1 mA; higher current and longer pulse widths increased LC firing rate, while pulse frequency
    changed the timing of the phasic burst without changing the total amount of LC activity; trigeminal
    pulse-locked activity appeared only above 1.2 mA.

