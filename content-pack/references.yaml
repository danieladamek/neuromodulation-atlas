  citation: Karu TI, Pyatibrat LV, Afanasyeva NI. Cellular effects of low power laser therapy can be mediated
    by nitric oxide. Lasers Surg Med. 2005;36(4):307-314.
  year: 2005
  doi: 10.1002/lsm.20148
  summary: 'Irradiated HeLa cells with visible to near-infrared light (600-860 nm) or an 820 nm diode
    laser and measured cell attachment with and without nitric oxide donors added before or after exposure.
    The action spectrum showed maxima consistent with cytochrome c oxidase as photoacceptor, and adding
    NO donors before irradiation shifted the spectrum, indicating that NO regulates the light-activated
    pathway controlling adhesion in a manner dependent on donor concentration and fluence.

    '
  why_it_mattered: 'Karu''s work is where the photoacceptor account of low-power light therapy came from,
    and this paper supplies the second half of the mechanism: photodissociation of nitric oxide from the
    enzyme, which explains how an absorption event becomes a signalling event affecting cell behaviour.
    The NO-release step is what connects photobiomodulation to vascular and redox signalling rather than
    to ATP output alone.

    '
  role_here: support
  role_note: 'v0-5: nitric oxide release as the step between photon absorption at cytochrome c oxidase
    and downstream cellular change; carries the claim that optical coupling in non-opsin tissue is photochemical
    and redox/NO-mediated. v0-7: NO and mitochondrial signalling.'
