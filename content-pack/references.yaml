  role_note: 'v0-10 family = ECT. Fills: coupling mechanism, rival mechanism and ''what is missing'' cells
    simultaneously - the seizure-versus-field dichotomy is the row''s live competing-hypothesis pair,
    and it is exactly the contrast that deng2011mstfocality and deng2024mstvsect were designed to probe.
    Primary v0-14 entry for the convulsive families.'
