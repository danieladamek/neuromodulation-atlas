    reporting practices. Brain Stimul. 2012;5(4):435-453.'
  year: 2012
  doi: 10.1016/j.brs.2011.10.001
  summary: 'The paper starts from the premise that the biological effects of electromagnetic brain stimulation
    are mediated by the field injected (tES) or induced (TMS) in the body. It defines dose as the device-side
    parameter set that determines that field: electrode or coil configuration, waveform, pulse parameters,
    and the timing of pulses, trains and sessions. It separates dose (what the operator controls) from
    the resulting field and physiological effect. It recommends reporting that follows the principle of
    reproducibility.

    '
  why_it_mattered: 'This became the reference definition of dose for NIBS: a device-side, reproducible
    specification, distinct from tissue exposure. Later E-field dosimetry and reporting checklists build
    on it.

    '
  role_here: method
