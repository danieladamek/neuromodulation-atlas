  citation: Nichols DE. Psychedelics. Pharmacol Rev. 2016;68(2):264-355.
  year: 2016
  doi: 10.1124/pr.115.011478
  summary: 'The reference review of serotonergic psychedelic pharmacology. It traces the field from the
    discovery of LSD and brain serotonin to the present consensus that classic psychedelics act as agonists
    or partial agonists at 5-HT2A receptors, with particular weight on receptors expressed on the apical
    dendrites of layer V neocortical pyramidal cells. It surveys the rodent models used to link 5-HT2A
    activation to behaviour, the imaging work identifying affected brain areas, the early phase 2 psilocybin-assisted
    psychotherapy trials in cancer-related distress and in alcohol and nicotine dependence, and the fMRI
    and MEG findings of reduced oscillatory power in default-mode network regions after psilocybin or
    LSD.

    '
  why_it_mattered: 'It supplies the full drive-to-outcome chain for a drug class in one place: receptor
    identity and location, cell type, circuit-level oscillatory consequence, and clinical outcome. That
    is the structure V0 is trying to impose on every modality, and this review is where the receptor-to-
    network link for psychedelics became standard.

    '
  role_here: review
  role_note: 'v0-11, v0-5 and v0-8: carries the claim that receptor identity plus cellular localisation
    (layer V apical dendrites) is what converts a ligand-binding event into a network-level change. The
    anchor citation for the pharmacological branch of the coupling chapter.'
