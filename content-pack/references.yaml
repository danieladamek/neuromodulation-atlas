  citation: Peterchev AV, Deng ZD, Sikes-Keilp C, Feuer EC, Rosa MA, Lisanby SH. Optimal frequency for
    seizure induction with electroconvulsive therapy and magnetic seizure therapy in nonhuman primates.
    Biol Psychiatry Glob Open Sci. 2025;5(3):100471.
  year: 2025
  doi: 10.1016/j.bpsgos.2025.100471
  summary: 'In four rhesus macaques the authors mapped seizure threshold against pulse train frequency
    for both ECT (5-240 pulses per second, 230-565 mA) and MST (5-100 pulses per second, 66-86% of maximum
    stimulator output). Mid-range frequencies needed the fewest pulses and therefore the least charge
    and energy, with a minimum near 16 pulses per second and near-equal thresholds at 10 and 25 pulses
    per second; lower frequencies produced more powerful seizures but needed more total pulses. The frequency-threshold
    relationship was comparable for the electrical and magnetic modes.

    '
  role_here: support
  role_note: 'v0-10 families = magnetic seizure therapy AND ECT. Fills: dose quantities reported (train
    frequency, pulse count, current amplitude or %MSO, charge and energy at threshold) and the ''what
    is missing'' cell, since it shows clinical ECT/MST frequencies are far above the charge-minimising
    optimum. Also v0-3 as a worked example that dose cannot be reduced to a single charge number.'
