  year: 2025
  doi: 10.1146/annurev-biochem-030222-121430
  summary: 'Current review of anaesthetic action at two sites: inside ion channels and within the plasma
    membrane itself. It describes how palmitate-anchored proteins and ordered lipid domains create anaesthetic-sensitive
    binding sites, and how anaesthetics inside channels either occupy allosteric sites in the conduction
    pathway or compete with regulatory lipids. The classical Meyer-Overton lipid-solubility correlation
    is reinterpreted in this light, and open problems — endogenous anaesthetics, stereoselectivity, the
    chain-length cutoff — are set out.

    '
  role_here: review
  role_note: 'v0-5 and v0-11: carries the claim that a drug''s coupling step can be a membrane-biophysical
    one rather than a lock-and-key receptor event, which is the pharmacological parallel to the membrane-level
    coupling arguments for electric fields and ultrasound (plaksin2014nice, bikson2004effects) and a useful
    bridge for the modality map.'
