  citation: McMahon D, Hynynen K. Acute inflammatory response following increased blood-brain barrier
    permeability induced by focused ultrasound is dependent on microbubble dose. Theranostics. 2017;7(16):3989-4000.
  year: 2017
  doi: 10.7150/thno.21630
  summary: 'Compared three sonication protocols at different microbubble doses in rats and assayed NF-kappa-B
    pathway gene expression at 6 hours and 4 days. Microbubble dose determined the inflammatory response:
    at clinical imaging doses there was no significant NF-kappa-B pathway change, whereas high doses activated
