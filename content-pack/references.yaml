  citation: Elias WJ, Lipsman N, Ondo WG, et al. A randomized trial of focused ultrasound thalamotomy
    for essential tremor. N Engl J Med. 2016;375(8):730-739.
  year: 2016
  doi: 10.1056/NEJMoa1600159
  summary: 'Randomised sham-controlled trial of MRI-guided focused ultrasound thalamotomy in patients
    with moderate-to-severe medication-refractory essential tremor. Hand-tremor scores fell from 18.1
    to 9.6 at three months after thalamotomy versus 16.0 to 15.8 after sham, with benefit maintained at
    12 months and disability and quality-of-life measures also favouring treatment; adverse events included
    gait disturbance in 36% and paraesthesias or numbness in 38%, persisting in a minority at 12 months.

    '
  why_it_mattered: 'This is the clinical anchor for thermally ablative acoustic coupling: it showed that
    transcranial focused ultrasound can place a therapeutic lesion accurately enough to beat a sham procedure
    in a randomised trial, which is what brought MRgFUS into routine neurosurgical practice. It also fixes
    the contrast the review needs — the same physical modality is reversible neuromodulation at low intensity
    and irreversible ablation at high thermal dose, with the dose, not the modality, deciding which.

    '
  role_here: prior-result
  role_note: 'v0-5 and v0-3: the ablative end of the acoustic dose continuum, and the clinical demonstration
    that thermal dose is deliverable through the intact skull. v0-13: highest-grade evidence anchor for
    FUS. v0-10: modality comparison against DBS and lesioning.'
