  citation: 'Chan D, Suk HJ, Jackson BL, et al. Gamma frequency sensory stimulation in mild probable Alzheimer''s
    dementia patients: results of feasibility and pilot studies. PLoS One. 2022;17(12):e0278412.'
  year: 2022
  doi: 10.1371/journal.pone.0278412
  summary: 'Phase 1 feasibility work (n = 43 across groups) showed that combined 40 Hz light and sound
    is tolerated and reliably entrains EEG in older adults and mild Alzheimer''s patients; a small randomised
    phase 2A study (n = 15) delivering one hour daily for three months reported less ventricular dilation
