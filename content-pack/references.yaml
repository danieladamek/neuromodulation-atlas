  year: 2010
  doi: 10.1097/YCT.0b013e3181e48165
  summary: 'A parameter-by-parameter analysis of the ECT stimulus and its biophysical meaning: pulse amplitude,
    shape and width, and train frequency, directionality, polarity and duration each have distinct neurobiological
    consequences, so summary metrics such as total charge or energy are inadequate. The authors show how
    manipulating individual parameters - shortening pulse width while raising pulse count - has already
    cut adverse effects without losing efficacy, and argue that dosage should be defined by the full parameter
    set and that devices should expose and display every parameter.

