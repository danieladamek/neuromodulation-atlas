  citation: 'Ranck JB Jr. Which elements are excited in electrical stimulation of mammalian central nervous
    system: a review. Brain Res. 1975;98(3):417-440.'
  year: 1975
  doi: 10.1016/0006-8993(75)90364-9
  summary: 'Ranck reviewed the evidence on which neural elements respond to focal electrical stimulation
    of the mammalian CNS. He compiled current–distance relations for myelinated fibres and cell bodies
    near monopolar electrodes and noted that such data were lacking for other electrode types. He described
    how strong cathodal currents can block propagation, so that only a shell of elements around the electrode
    is effectively excited. Chronaxies of central myelinated axons are about 50–100 µs, while some grey-matter
    stimulation gives 200–700 µs, which leaves open what is being excited. Myelinated fibres usually need
    less cathodal than anodal current, and fibre orientation relative to current flow matters.

    '
  why_it_mattered: 'This is the reference framework for the axon-versus-soma question. It established
    that axons, not somata, usually have the lowest thresholds, and that polarity, orientation and anodal/cathodal
    block shape the activated population. Much later DBS and TMS modelling started from this framework.

    '
  role_here: background
  role_note: 'v0-4: historical basis for ''axons are excited before cell bodies''; chronaxie values; cathodal
    block (surround inhibition).'
