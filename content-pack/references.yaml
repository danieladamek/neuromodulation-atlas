  citation: Hynynen K, McDannold N, Vykhodtseva N, Jolesz FA. Noninvasive MR imaging-guided focal opening
    of the blood-brain barrier in rabbits. Radiology. 2001;220(3):640-646.
  year: 2001
  doi: 10.1148/radiol.2202001804
  summary: 'Sonicated 18 rabbit brains at four to six locations each with temporal peak acoustic powers
    from 0.2 to 11.5 W, injecting an ultrasound contrast agent (microbubbles) before each sonication,
    and monitored with gradient-echo and contrast-enhanced MR imaging plus whole-brain histology. Blood-brain
    barrier opening was confirmed at targeted locations, and the lowest powers opened the barrier without
    damaging neurons; contrast enhancement correlated with the MR signal changes, so MR imaging can monitor
    the procedure.

    '
  why_it_mattered: 'This established that focused ultrasound plus circulating microbubbles can open the
    blood-brain barrier focally, reversibly and non-destructively, and that the opening is imageable —
    which created the entire field of ultrasound-mediated CNS drug delivery. It also fixed the essential
    physical insight that the active agent is microbubble oscillation in the vasculature rather than the
    tissue absorbing the wave, which is why the technique works at intensities far below ablative ones.

    '
  role_here: prior-result
  role_note: 'v0-5: microbubble cavitation at the vessel wall as a distinct acoustic coupling regime whose
    target is the endothelium rather than the neuron. v0-11: opens the drug+device combination route.'
