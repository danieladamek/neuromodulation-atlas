  citation: Tracey KJ. The inflammatory reflex. Nature. 2002;420(6917):853-859.
  year: 2002
  doi: 10.1038/nature01321
  summary: 'Tracey formalises the finding that cholinergic neurons inhibit acute inflammation into a reflex:
    the nervous system senses inflammatory status and regulates it in real time, as it does heart rate,
    with an afferent limb, central integration and an efferent cholinergic limb. Because the loop is hard-wired,
    it is addressable selectively and reversibly by electrical or pharmacological means, which he proposes
    as a therapeutic strategy for inflammatory disease.

    '
  why_it_mattered: 'The paper supplied the concept and the vocabulary (inflammatory reflex, cholinergic
    anti-inflammatory pathway) that organise the whole neuroimmune branch of neuromodulation, and it is
    the framing V0 needs to treat immune outcome as a reflex-controlled variable rather than a side effect.

    '
  role_here: background
