  citation: 'O''Reilly MA, Hynynen K. Blood-brain barrier: real-time feedback-controlled focused ultrasound
    disruption by using an acoustic emissions-based controller. Radiology. 2012;263(1):96-106.'
  year: 2012
  doi: 10.1148/radiol.11111417
  summary: 'Used a wideband hydrophone to capture microbubble acoustic emissions during transcranial sonication
    (551.5 kHz, 10 ms bursts, 2 Hz PRF) at 86 locations in 27 rats, ramping pressure until ultraharmonic
    emissions appeared and then holding pressure at a set fraction of that threshold. Mean peak pressure
    for successful opening was 0.28 +/- 0.05 MPa, MR enhancement scaled linearly with the chosen fraction,
    and at 50% scaling the barrier opened with no detectable damage while higher scaling caused gross
    damage.

    '
  why_it_mattered: 'It replaced fixed-exposure dosing with closed-loop control keyed to the bubble''s
    own acoustic signature, which is how the modality became safe enough to translate. Conceptually it
    is the clearest case in neuromodulation of dose defined by a measured physical response rather than
    by applied energy, and every clinical BBB-opening system since uses a descendant of this controller.

    '
  role_here: method
  role_note: 'v0-5 and v0-3: cavitation-emission feedback as the operational definition of acoustic dose;
    carries the claim that stable versus inertial cavitation is detectable in real time and is the safety
    boundary. v0-13: an early closed-loop exemplar.'
