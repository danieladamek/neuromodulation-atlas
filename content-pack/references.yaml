  citation: Fröhlich F, McCormick DA. Endogenous electric fields may guide neocortical network activity.
    Neuron. 2010;67(1):129-143.
  year: 2010
  doi: 10.1016/j.neuron.2010.06.005
  summary: 'In ferret cortex, endogenous fields during physiological activity reached about 2–4 mV/mm.
    In ferret cortical slices, weak applied fields of in-vivo-like amplitude sped up and regularised the
    slow oscillation and entrained it. In closed-loop experiments, a field proportional to ongoing activity
    strengthened oscillatory structure under positive feedback and weakened it under negative feedback.
    Network modelling (computational) attributed the large network effect to small, simultaneous depolarisation
    of many neurons.

    '
  why_it_mattered: 'This paper recast weak fields as a feedback signal that networks can amplify. It is
    the main mechanistic basis for tACS entrainment claims and for the idea that network state and resonance,
    not single-cell threshold, set efficacy.

    '
  role_here: support
  role_note: 'v0-4/v0-8: network amplification of weak fields; field amplitudes are slice measurements,
    amplification mechanism is partly computational.'
