  citation: Guo H, Hamilton M, Offutt SJ, Gloeckner CD, Li T, Kim Y, Legon W, Alford JK, Lim HH. Ultrasound
    produces extensive brain activation via a cochlear pathway. Neuron. 2018;98(5):1020-1030.e4.
  year: 2018
  doi: 10.1016/j.neuron.2018.04.036
  summary: 'Mapped guinea-pig brain responses to transcranial ultrasound with extracellular electrophysiology
    and found widespread cortical and subcortical activation — which was then abolished by transecting
    the auditory nerves or removing cochlear fluid. The activation therefore ascends through the auditory
    system and spreads to non-auditory regions by cross-modal projections, rather than arising at the
    acoustic focus. The authors conclude that the evidence for direct neuronal activation by ultrasound
    in the intact brain is confounded and that future studies must control for the cochlear pathway.

    '
  why_it_mattered: 'Together with sato2018auditory it is the paper that forced the ultrasound field to
    rebuild its control conditions, because it showed a plausible peripheral route that reproduces the
    headline phenomenon. Its lesion logic (cut the nerve, drain the cochlea) is now the standard existence
    test for direct versus indirect effects, and it is the reason ''sham'' in ultrasound work has to mean
    acoustically matched rather than transducer-off.

    '
  role_here: contrast
  role_note: 'v0-12: the auditory confound as a competing explanation for ultrasound neuromodulation,
    and the lesion-control design that tests it. v0-5: bounds which observations can be attributed to
    local acoustic coupling at all. v0-14: leading alternative hypothesis.'
