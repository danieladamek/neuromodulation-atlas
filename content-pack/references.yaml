  tier: current
  citation: Elbau IG, Lynch CJ, Downar J, Vila-Rodriguez F, Power JD, Solomonov N, et al. Functional connectivity
    mapping for rTMS target selection in depression. American Journal of Psychiatry. 2023;180(3):230-240.
  year: 2023
  doi: 10.1176/appi.ajp.20220306
  summary: 'In 295 patients treated with rTMS for depression, the authors tested whether connectivity
    between the actual stimulation site and the subgenual ACC predicted clinical outcome, using precision
    resting-state data for reliability estimates and electric-field modelling to localise the stimulated
    tissue. The association was weak (r about -0.16) and only detectable when targets were defined by
    E-field modelling rather than by nominal coil position; a large part of it tracked respiration-driven
    artefact in the global signal. They conclude sgACC connectivity explains roughly 3% of outcome variance,
    which is too little to support current individualised targeting protocols on its own.

    '
  role_here: contrast
