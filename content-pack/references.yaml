  citation: 'Caffaratti H, Slater B, Shaheen N, et al. Neuromodulation with ultrasound: hypotheses on
    the directionality of effects and a community resource. eLife. 2024;13:RP100827.'
  year: 2024
  doi: 10.7554/eLife.100827
  summary: 'Systematic review of human transcranial ultrasound studies (32 studies, 37 experiments) plus
    an initial meta-analysis of whether reported outcomes were enhancement or suppression, scored against
    the NICE model''s prediction that higher duty cycle and intensity favour enhancement. Duty cycle was
    a significant predictor (p = 0.046) and sonication duration was too (p = 0.04, shorter favouring excitation),
    while ISPPA intensity alone was not (p = 0.256); the authors established the open Iowa-Newcastle (inTUS)
    repository of parameters and outcomes for prospective hypothesis testing. They state explicitly that
    the results are tentative and may stabilise or change as samples grow, cite selection bias and incomplete
    parameter reporting, note that multivariate or data-driven analyses are not yet possible, and present
    the findings as sign-posts rather than conclusions.

    '
  role_here: review
  role_note: 'v0-5 and v0-14: the directionality-of-effect question and its current (self-declared labile)
    answer — duty cycle and sonication duration carry some predictive signal, intensity alone does not.
    v0-12: incomplete parameter reporting as a field-level defect, and the inTUS schema as a reporting
    standard. v0-15: inTUS is a ready-made parameter/outcome schema to align the graph against.'
