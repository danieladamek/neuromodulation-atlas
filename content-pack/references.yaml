  citation: Bobo RH, Laske DW, Akbasak A, Morrison PF, Dedrick RL, Oldfield EH. Convection-enhanced delivery
    of macromolecules in the brain. Proc Natl Acad Sci U S A. 1994;91(6):2076-2080.
  year: 1994
  doi: 10.1073/pnas.91.6.2076
  summary: 'Direct intraparenchymal infusion of drugs into brain is limited by diffusion: large molecules
    barely move from the injection site. This work established that a sustained pressure gradient during
    interstitial infusion into white matter generates bulk flow through the extracellular space, carrying
    solute centimetres rather than millimetres. Volume of distribution scaled linearly with volume infused
    for both a large tracer (111In-transferrin, ~6:1 distribution to infusion volume) and a small one
    (14C-sucrose, ~13:1), and at 24 h the large molecule was more uniformly distributed and had entered
    grey matter. Local concentrations orders of magnitude above achievable systemic levels were reached.

    '
  why_it_mattered: 'It converted "put the drug in the brain" from a diffusion problem into a controllable
    transport problem with its own dose variables — infusion rate, volume, catheter placement, tissue
    hydraulic conductivity — which is exactly the structure V0 claims for a device dose. CED remains the
    reference route for gene-therapy vectors, enzymes and chemotherapeutics, and it is the natural pharmacological
    counterpart to focused-ultrasound BBB opening (hynynen2001bbb).

    '
  role_here: prior-result
  role_note: 'v0-11 and v0-3: carries the claim that route of administration is a dose variable with its
    own physics, and that invasive routes trade systemic exposure for a controllable spatial distribution.
    Pairs with the FUS/BBB keys (hynynen2001bbb, oreilly2012feedback) as the two ways of getting a large
    molecule into parenchyma.'
