  summary: 'In 10 epilepsy patients with intracranial electrodes, the authors recorded potentials during
    scalp stimulation and compared them with individual finite-element head models. With 2 mA at the scalp,
    measured cortical fields reached about 0.8 V/m, lower than commonly assumed. Model predictions correlated
    well with measurements (r = 0.86 for cortical and 0.88 for depth electrodes). Calibrating tissue conductivities
