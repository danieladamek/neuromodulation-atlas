  year: 2008
  doi: 10.1016/j.brs.2008.03.001
  summary: 'Ninety depressed patients were randomised across a two-by-two design crossing electrode placement
    (right unilateral versus bilateral) with pulse width (conventional 1.5 ms versus ultrabrief 0.3 ms).
    Ultrabrief right unilateral ECT had the mildest cognitive side effects on virtually every primary
    measure while achieving 73% remission, against 35% for ultrabrief bilateral treatment. Efficacy and
    cognitive burden therefore depend jointly on placement and pulse width rather than on delivered charge
    alone.

    '
  why_it_mattered: 'It is the trial that decoupled the two axes the ECT row needs - where the current
    enters and how long each pulse lasts - and showed that shortening the pulse toward the chronaxie of
    cortical neurons buys a large reduction in cognitive cost at no efficacy cost in the unilateral configuration.
    Modern ECT practice, and the ultrabrief right unilateral comparator used in deng2024mstvsect and anand2023elektd,
    derives from it.

    '
  role_here: prior-result
