    train) and coupling mechanism (induced eddy current in superficial cortex -> deliberate generalised
    seizure). Origin citation for the family row; the ''what is missing'' cell inherits from it because
    the primate work never isolated which train parameters set the threshold (see peterchev2025mstfrequency).'
