plain_abstract: 'There are many ways to change how the nervous system behaves from outside the body: magnetic
  pulses through the skull, electrodes implanted in the brain or on a nerve, focused ultrasound, light,
  and drugs given by injection, by mouth, up the nose or into the spinal fluid. They have almost nothing
  physical in common, but each one can be described the same way: something is delivered, it couples to
  tissue by some mechanism, cells respond, molecules change, circuits and whole body systems shift, and
  eventually something measurable happens to the person. This volume follows that chain for every method
  usable in people, and is strict about what is actually known at each link, in which species, at what
  dose, and on what evidence. It catalogues twenty-three disputes the field has not settled, and it ends
  by proposing how all of this could be represented as a graph database. Written by Daniel Adamek with AI assistance;
  not peer reviewed; current as of 15 September 2026.'
