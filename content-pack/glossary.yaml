- id: deep-brain-stimulation
  term: Deep brain stimulation (DBS)
  kind: methods
  variants:
  - DBS
  - deep brain stimulation
  short: Chronic pulsed stimulation through an implanted intracranial electrode; how its high-frequency
    benefit arises is disputed.
  definition: 'Clinical benefit requires high frequency and the clinical picture resembles a lesion even
    though axonal output is being driven. One account is an informational lesion: modelled high-frequency
    drive makes output spiking regular and almost variance-free, so the cell keeps firing but stops transmitting
    information. The rival holds that high-frequency stimulation excites efferent axons and recruits cortex
    antidromically, with network desynchronisation as a variant. Outcome data do not separate them, because
    both predict benefit at high frequency.

    '
  see:
  - informational-lesion
  - antidromic-activation
  - subthalamic-nucleus
  - hypothesis-group
  sources:
