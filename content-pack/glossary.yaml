  term: Organotypic slice culture
  kind: methods
  variants:
  - organotypic slice
  - organotypic cultures
  - slice culture
  short: Explanted tissue kept in culture with its local circuitry intact, allowing a clinical protocol
    to be applied where synapses can be measured.
  definition: 'Delivering the clinical 600-pulse intermittent theta-burst protocol to mouse organotypic
    slice cultures produced long-term potentiation of excitatory synapses with dendritic spine remodelling
    persisting 24 hours while network activity stayed stable. It is the volume''s example of closing part
    of the preparation gap from the tissue side rather than the human side.

