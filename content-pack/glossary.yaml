- id: somato-dendritic-axis
  term: Somato-dendritic axis
  kind: science
  variants:
  - somatodendritic axis
  short: The long axis running from a neuron's soma through its dendritic tree; the field component along
    it sets somatic polarisation.
  definition: 'Field coupling to a pyramidal neuron is anisotropic. Fields applied parallel to the somato-dendritic
    axis polarise the soma linearly; fields applied perpendicular to it do not polarise the soma at all.
    Because a coupling edge is therefore a function of geometry, the volume requires the field component
    along this axis to travel with any coupling claim.

    '
  see:
  - coupling-constant
  - uniform-field
  - compartment-specific-polarisation
