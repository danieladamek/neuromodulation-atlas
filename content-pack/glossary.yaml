  term: Intrathecal delivery
  kind: methods
  variants:
  - intrathecal
  - intrathecal infusion
  - implanted drug pump
  short: Infusion into the cerebrospinal fluid space through an implanted pump and catheter, placing exposure
    at the spinal cord.
  definition: 'In a randomised double-blind crossover study of 20 patients with spasticity from multiple
    sclerosis or spinal cord injury who had failed oral baclofen, continuous intrathecal infusion substantially
    lowered muscle tone in every patient and reduced spasms in 18 of 19, maintained over a mean 19.2 months.
    The selectivity is compartment-level rather than focal, and delivery is continuous rather than pulsed.

    '
