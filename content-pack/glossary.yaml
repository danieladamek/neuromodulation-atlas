- id: allosteric-modulation
  term: Allosteric modulation
  kind: science
  variants:
  - allosteric
  - allosteric mechanism
  - allosteric site
  short: Action at a site other than the agonist's, changing the receptor's response rather than activating
    it directly.
  definition: 'An allosteric drive is a change in a transfer function rather than an input. Pregnane steroids
    enhance GABA-A receptor function by a direct, non-genomic allosteric action, and act both as circulating
    messengers and as locally synthesised neurosteroids, so one molecule can be a systemic or a local
    drive. Anaesthetic action within the plasma membrane, where ordered lipid domains create sensitive
    sites, is the pharmacological parallel of the membrane-level accounts of acoustic coupling.

    '
