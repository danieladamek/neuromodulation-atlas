- id: temporal-interference
  term: Temporal interference (TI)
  kind: methods
  variants:
  - TI
  - temporal interference stimulation
  - TI-tACS
  - interferential stimulation
  short: Two kilohertz carriers at slightly different frequencies whose overlap produces a low-frequency
    envelope, proposed as a way to reach deep targets non-invasively.
  definition: 'Each carrier is too fast to drive neurons, but where they overlap the amplitude envelope
    beats at their difference frequency; in anaesthetised mice neurons followed the envelope, hippocampus
    was driven without driving overlying cortex, and motor responses were steered by changing the current
    ratio. Both the mechanism and the human scaling are disputed: passive membrane filtering cannot demodulate
    the envelope while ion-channel rectification can, modelled suprathreshold thresholds of 75–230 V/m
    sit far above the 0.1–1 V/m a tolerable scalp current delivers, and in macaques temporal interference
    was about 80% less potent than conventional alternating current.

    '
