- id: compartment-specific-polarisation
  term: Compartment-specific polarisation
  kind: science
  variants:
  - compartment-specific polarization
  - somatic polarisation
  - somatic polarization
  short: 'The opposite-sign polarisation of a neuron''s ends in one field: the field that depolarises
    the soma hyperpolarises the distal dendrite.'
  definition: 'A neuron in a uniform field is polarised differently along its length, and the two ends
    take opposite sign. Polarisation is largest at dendritic tips, with time constants of about 15–70
    ms, and excitability changes outlasted the field by more than a second in slice. Two mechanisms therefore
    sit under the one word "polarization" and do not scale together: somatic polarisation proportional
    to the field along the somato-dendritic axis, and terminal or bend polarisation that cable analysis
    predicts dominates in a uniform field.

    '
  see:
  - terminal-polarisation
