  kind: science
  variants:
  - translocator protein
  - TSPO imaging
  - '[11C]PBR28'
  short: A mitochondrial protein used as a PET marker of neuroinflammation; it rises in activated mouse
    microglia but not in primates or human disease.
  definition: 'The species gap was traced to an AP1 site in the promoter, so a human TSPO-PET signal is
    better read as the density of inflammatory cells than as their activation state. This matters directly:
    the volume''s only primate test of stimulation-driven glial activation — macaques given weeks of theta-burst
    stimulation — was null and used this marker. A convergence edge assembled from a mouse immunostain
    and a human PET scan is assembled from two quantities that are not the same quantity.

    '
