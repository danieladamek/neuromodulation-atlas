- id: perturbation-method
  term: Perturbation method
  kind: methods
  variants:
  - manipulation method
  - necessity test
  short: How a putative requirement was tested — lesion, genetic deletion, receptor antagonism — which
    the necessity claim must carry.
  definition: 'A statement that a device effect requires a neuromodulator system is only as strong as
    the manipulation behind it, and different manipulations give opposite answers for the same effect:
    source-nucleus lesion abolished vagal map plasticity while three receptor antagonists did not. For
    drugs the same problem appears as where a receptor was deleted, since the responding cell may not
    express it. The necessity edge therefore carries the perturbation method, not just a sign.

    '
