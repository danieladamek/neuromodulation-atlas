- id: volts-per-metre
  term: V/m
  kind: notation
  variants:
  - volts per metre
  - volts per meter
  - V m-1
  short: Volts per metre, the SI unit of electric field strength; 1 V/m equals 1 mV/mm.
  definition: 'Electric-field magnitudes in this volume are quoted in V/m or the numerically identical
    mV/mm. The anchors to remember are that 2 mA at the scalp produced about 0.8 V/m measured intracranially
    in human cortex, that rat intracellular recordings put the minimum field affecting spiking near 1
    V/m, and that modelled suprathreshold temporal interference needs 75–230 V/m.

    '
