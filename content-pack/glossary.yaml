- id: cortisol
  term: Cortisol
  kind: science
  variants:
  - cortisol response
  - salivary alpha-amylase
  short: The adrenal stress hormone used as an endocrine readout; prefrontal stimulation reduced its acute
    response to a laboratory stressor.
  definition: 'A meta-analysis of 16 randomised trials of prefrontal magnetic or electrical stimulation
    in healthy adults found a reduced acute cortisol response to a laboratory stressor (SMD = −0.72),
    larger for magnetic stimulation and for delivery before or after rather than during the stressor,
    so timing relative to the challenge is part of the dose. Cortisol and salivary alpha-amylase are also
    among the engagement measures that continuous auricular stimulation left unchanged.

    '
