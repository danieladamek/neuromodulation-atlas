- id: brain-extracellular-fluid
  term: Brain extracellular fluid
  kind: science
  variants:
  - brain ECF
  - extracellular fluid concentration
  - unbound brain concentration
  short: The fluid bathing neurons; the concentration there, not in plasma, is the exposure that matters
    at the receptor.
  definition: 'Plasma concentration is not the dose; the concentration in brain extracellular fluid at
    the receptor is. It is set by diffusion, influx and efflux at the barrier and by distribution among
    central compartments, and it is usually estimated with physiologically based models tied to animal
    data rather than measured. The volume lists measured target-site concentration among the missing quantities
    for the pharmacological drive class.

    '
