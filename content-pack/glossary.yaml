  term: AQP4
  kind: science
  variants:
  - aquaporin-4
  - AQP4 polarization
  - AQP4 polarisation
  short: The astrocytic water channel whose endfoot polarisation is central to glymphatic clearance.
  definition: 'In a mouse model, 40 Hz audiovisual stimulation increased CSF influx and interstitial fluid
    efflux with changes in astrocytic AQP4 polarisation and meningeal lymphatic vessels, and blocking
    glymphatic clearance abolished amyloid removal. It supplies a clearance mechanism for the 40 Hz chain
    that can in principle survive the entrainment null, if the route is vasomotor rather than oscillatory.

    '
