- id: ascending-neuromodulator-systems
  term: Ascending neuromodulator systems
  kind: science
  variants:
  - ascending systems
  - neuromodulatory systems
  short: Brainstem and basal-forebrain populations releasing acetylcholine, noradrenaline, dopamine or
    serotonin broadly; both targets of a drive and gates on its effect.
  definition: 'These systems enter the volume twice: as targets, since device stimulation can drive them,
    and as gates, since plasticity is conditional on them. Modern circuit work qualifies the broadcast
    picture — locus coeruleus subpopulations encode specific processes and have target-specific innervation
    and heterogeneous receptor distributions — so a necessity edge onto such a system cannot treat it
    as a uniform broadcast, and must carry the perturbation method used.

    '
