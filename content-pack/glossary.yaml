- id: watts-per-square-centimetre
  term: W/cm²
  kind: notation
  variants:
  - watts per square centimetre
  - W/cm2
  - watts per square centimeter
  short: Watts per square centimetre, the unit of acoustic intensity; oocyte channel modulation was reported
    at 0.3–4.9 W/cm².
  definition: 'Acoustic intensity units place experiments on a common scale. In Xenopus oocytes expressing
    candidate mechanosensitive channels, focused ultrasound at 10 MHz and 0.3–4.9 W/cm² modulated currents
    reversibly by up to about 23%. Intensity is also the axis along which the same modality shifts from
    reversible modulation to ablation.

    '
  see:
  - isppa
  - mechanosensitive-channel
  - hifu
  sources:
  - 10.1038/srep24170
- id: megapascal
  term: MPa
  kind: notation
  variants:
  - megapascal
  - megapascals
  - peak negative pressure
  - peak pressure
  short: Megapascals, the unit of acoustic pressure; barrier opening in rats occurred at a mean peak pressure
    of 0.28 ± 0.05 MPa.
  definition: 'Pressure amplitude is the natural dose variable for microbubble work, because bubble behaviour
    is a threshold function of pressure. In 27 rats, pressure was ramped until ultraharmonic emissions
    appeared and then held at a fraction of that threshold, with successful blood–brain barrier opening
    at a mean peak pressure of 0.28 ± 0.05 MPa. In HEK cells, ultrasound-evoked chloride current was reported
    at 0.8 MHz and 0.20 MPa.

    '
  see:
