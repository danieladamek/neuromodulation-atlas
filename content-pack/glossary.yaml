  - spine remodelling
  - spine count
  - spine density
  short: The postsynaptic protrusion holding most excitatory synapses; spine number and remodelling are
    the structural readouts of rapid plasticity.
  definition: 'Spine counts are the molecular level''s structural currency: a single ketamine dose increased
    the number and function of spines in rat prefrontal cortex, and the clinical intermittent theta-burst
    protocol produced potentiation with spine remodelling lasting 24 hours in mouse organotypic slice.
    All such measurements in this volume are rodent.

