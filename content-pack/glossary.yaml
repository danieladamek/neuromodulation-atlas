  term: Target definition
  kind: methods
  variants:
  - how the target was defined
  - nominal coil position
  short: Whether a target is the literature coordinate, the coil position, or the tissue a field model
    says was stimulated; part of the claim, not a detail.
  definition: 'The same connectivity measure yields a usable targeting rule when the target is a literature-derived
    coordinate and about 3% of outcome variance when it is the tissue an electric-field model says was
    stimulated. Anatomical, functional and connectivity-derived targets are therefore different nodes
    rather than labels for one node, and circuits inferred from lesions and from stimulation have been
    treated as one object.

    '
