- id: receptor-occupancy
  term: Receptor occupancy
  kind: methods
  variants:
  - occupancy
  - occupancy window
  - D2 occupancy
  - receptor occupancy threshold
  short: The fraction of a receptor population bound by a ligand, measured in humans by PET; pharmacology's
    closest thing to a mechanism-level dose metric.
  definition: 'In 22 first-episode patients randomised to haloperidol 1.0 or 2.5 mg/day, raclopride PET
    showed D2 occupancy between 38% and 87%, with clinical response, extrapyramidal symptoms and hyperprolactinaemia
    becoming likelier above about 65%, 72% and 78% respectively; a later review gives 65–80% D2 and 70–80%
    serotonin transporter occupancy as therapeutic windows. The threshold model breaks when intrinsic
    efficacy varies: partial agonists such as aripiprazole keep extrapyramidal risk low despite high occupancy.
    Occupancy also presumes that the administered compound is the acting ligand.

    '
