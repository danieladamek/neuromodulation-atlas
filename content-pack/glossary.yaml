  - afferent HPA route
  short: The hypothalamic–pituitary–adrenal endocrine cascade; the afferent vagal route to immune control,
    distinct from the efferent cholinergic one.
  definition: 'The founding neuroimmune paper explicitly distinguished its efferent parasympathetic anti-inflammatory
    pathway from the already-described afferent vagal route acting through this axis — the reason direction
    belongs on the edge rather than in the node name. Its output, cortisol, is also the endpoint through
    which prefrontal stimulation has been shown to change an endocrine stress response.

    '
