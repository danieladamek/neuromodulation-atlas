  - 10.1016/j.brs.2025.10.007
- id: thermal-dose
  term: Thermal dose
  kind: methods
  variants:
  - thermal dose limits
  - thermal criteria
  short: Exposure expressed as an equivalent heating history rather than as applied energy; the basis
    of both ultrasound safety criteria and ablation planning.
  definition: 'Thermal dose has an older and more transferable definition than any other quantity in the
    volume, because tissue damage from heating is a function of temperature and time jointly. Dose, not
    modality, decides whether acoustic coupling is reversible modulation or a lesion: at high thermal
    dose the same transducer class ablates. The safety consensus offers three alternative thermal criteria
    — temperature rise, absolute temperature, and thermal-dose limits by tissue type.

    '
  see:
  - cem43
  - hifu
  - thermal-account
  sources:
  - 10.1016/0360-3016(84)90379-1
  - 10.1016/j.brs.2025.10.007
- id: thermal-account
  term: Thermal account of ultrasound
  kind: science
  variants:
  - thermal coupling
  - thermal mechanism
  short: The position that low-intensity ultrasound acts by small measured temperature changes rather
    than by mechanical parameters.
  definition: 'In rat ventral posterolateral thalamus, suppression of somatosensory evoked potentials
    scaled with position and intensity but was independent of duty cycle, peak pressure and modulation
    frequency, tracking measured temperature instead, with no histological damage; heating delivered separately
    by an optical fibre reproduced the suppression. The parameters a mechanical model says should matter
    did not. The thermal account therefore rests on a parameter dissociation in rat, against a parameter
    association in humans that its own authors call labile, and neither reports the other''s key quantity.

    '
  see:
