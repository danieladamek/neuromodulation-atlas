- id: hypothesis-group
  term: Hypothesis group
  kind: methods
  variants:
  - dispute
  - live dispute
  - rival positions
  - contested claim
  short: A dispute treated as a first-class object, with its rival claims attached, each carrying its
    own species, preparation and evidence kind.
  definition: 'The volume catalogues twenty-three live disputes in a fixed shape: the question, the positions,
    what the evidence turns on, and what would settle it. In almost none is one side simply wrong — the
    rivals are two claims measured differently, so deleting either loses the information that the disagreement
    is about method. An edge''s status must therefore be able to say contested while both parents stay
    in the graph, and several disputes resolve into dose rather than mechanism once parameters are recorded.

    '
