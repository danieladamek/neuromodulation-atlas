- id: endogenous-field
  term: Endogenous field
  kind: science
  variants:
  - endogenous fields
  - endogenous electric field
  short: The electric field a brain generates during its own activity; about 2–4 mV/mm in ferret cortex,
    used as the yardstick for applied fields.
  definition: 'Measured endogenous fields set a natural scale for what an applied field must reach. In
    ferret cortex during physiological activity they reached about 2–4 mV/mm, and in ferret cortical slices
    applied fields of that amplitude sped up, regularised and entrained the slow oscillation. The attribution
    of that large network effect to small simultaneous depolarisation of many neurons came from network
    modelling rather than the recordings.

    '
  see:
  - network-resonance
  - entrainment
