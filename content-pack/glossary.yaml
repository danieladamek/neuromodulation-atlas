  term: Compartment
  kind: science
  variants:
  - compartment reached
  - CNS compartment
  - compartment-level selectivity
  short: The anatomical or cellular space a drive reaches — CSF, parenchyma, plasma, or a subcellular
    location.
  definition: 'Compartment appears at three scales in this volume. At body scale it is which fluid space
    a route reaches, as with intrathecal infusion selecting the spinal cord. At tissue scale it is the
    distinction between plasma, brain extracellular fluid and CSF. At cell scale it is receptor compartment
    — inside the cell or at the surface — which can decide whether a mechanism is engaged at all.

    '
