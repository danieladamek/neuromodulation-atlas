    threshold left event-related pupil dilation, resting pupil size, cortisol, salivary alpha-amylase,
    cardiac vagal activity and respiration unchanged against earlobe sham, while the task itself produced
    the expected pupil effects. A Bayesian meta-analysis of 18 studies (N = 771) resolved this by protocol:
    strong evidence for an effect with pulsed delivery and strong evidence for the null with continuous
