- id: nucleus-basalis
  term: Nucleus basalis
  kind: science
  variants:
  - basal forebrain cholinergic neurons
  - nucleus basalis lesion
  short: The basal-forebrain cholinergic source whose lesion abolishes device-driven cortical map plasticity
    in rats.
  definition: 'Pairing forelimb training with vagus-nerve stimulation expanded the proximal forelimb motor
    representation in rats with intact nucleus basalis but not after selective lesion of its cholinergic
    neurons, with motor performance equivalent across groups. The necessity claim is challenged at the
    receptor level, since clinically dosed oxybutynin, prazosin and duloxetine did not block the same
    map plasticity: source-nucleus lesion and receptor antagonism are not interchangeable evidence for
    one edge.

    '
