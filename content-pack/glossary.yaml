- id: ketamine
  term: Ketamine
  kind: drug
  variants:
  - racemic ketamine
  - intravenous ketamine
  short: An NMDA receptor antagonist whose single subanaesthetic dose produces antidepressant effects
    within hours that outlast its clearance.
  definition: 'In seven patients with major depression, 0.5 mg/kg intravenously cut 25-item Hamilton scores
    by about 14 points within 72 hours; in 18 patients with treatment-resistant depression the same dose
    improved scores within 110 minutes with benefit persisting about a week, 71% response and 29% remission
    at day 1. An effect outlasting clearance by days cannot be carried by continuing occupancy, which
    is what makes the drug the field''s mechanism test case. In mice it shows an inverted-U dose-response,
    effective at 10 mg/kg and ineffective higher.

    '
