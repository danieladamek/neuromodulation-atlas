- id: route-of-administration
  term: Route of administration
  kind: methods
  variants:
  - route
  - delivery route
  - administration route
  short: How a drug is delivered; a first-class dose variable that fixes onset, exposure profile over
    time and compartment reached.
  definition: 'Route fixes for a drug what a montage or transducer placement fixes for a device. The cleanest
    demonstration changes only the route: in 20 patients with spinal spasticity who had failed oral baclofen,
    intrathecal infusion of the same agonist lowered tone in every patient, because oral dosing puts occupancy
    where the side effects are and intrathecal dosing puts it where the circuit is. The same molecule
    by two routes is two drives.

    '
