    Met allele carriers responded differently from Val66Val homozygotes across several magnetic and electrical
    protocols, and replication of such genotype effects has been inconsistent. Mice with impaired activity-dependent
    BDNF release, like humans carrying the variant, gained less from motor training. This corpus contains
