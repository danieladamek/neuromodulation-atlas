- id: intrinsic-efficacy
  term: Intrinsic efficacy
  kind: science
  variants:
  - efficacy term
  - agonist efficacy
  short: How strongly a bound ligand activates its receptor; the term that must sit beside occupancy for
    occupancy to predict effect.
  definition: 'Occupancy alone does not fix the effect, because intrinsic efficacy and agonist-selective
    active states intervene between binding and response. The clinical demonstration is the partial agonist:
    extrapyramidal risk rose steeply above roughly 75–85% D2 occupancy for antagonists, while partial
    agonists kept that risk low at high occupancy. Any occupancy value in the graph names the ligand''s
    intrinsic efficacy class.

    '
