  short: Transient increase of barrier permeability by microbubble oscillation under low-pressure ultrasound,
    imageable and reversible.
  definition: 'Sonicating with an intravenous contrast agent opens the barrier at targeted locations at
    temporal peak acoustic powers far below ablative levels, tracked by contrast-enhanced MR imaging.
    A phase I trial in five patients with early-to-moderate Alzheimer''s disease opened it safely, reversibly
    and repeatedly with no serious adverse events at three months, while exploratory amyloid PET showed
    no group-level change — the engineering claim and the therapeutic claim separating cleanly. Whether
    the opening is itself an inflammatory injury is disputed and turns on microbubble dose.

