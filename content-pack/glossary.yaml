- id: amplitude-envelope
  term: Amplitude envelope
  kind: notation
  variants:
  - envelope
  - pulse envelope
  - envelope modulation
  short: The slow outline traced by a fast carrier's amplitude; the proposed effective stimulus in temporal
    interference and the culprit in ultrasound's auditory confound.
  definition: 'Envelope shape matters twice in this volume. In temporal interference the low-frequency
    envelope is the claimed effective stimulus, although the waveform''s spectral content is entirely
    high-frequency, so extracting it requires rectification rather than passive filtering. In ultrasound,
    sharp-edged rectangular pulses activated the auditory pathway while smoothing the envelope removed
    the auditory response and left the motor response intact, and ramped longer pulses reduced scalp sensations
    for a given dose.

    '
  see:
  - temporal-interference
  - rectification
  - auditory-confound
  sources:
  - 10.1016/j.cels.2020.10.004
  - 10.1016/j.brs.2019.03.005
  - 10.1016/j.brs.2025.06.009
- id: rectification
  term: Rectification
  kind: science
  variants:
  - ion-channel rectification
  - demodulation
  short: Asymmetric conversion of an oscillating input into a net directional effect; the mechanism by
    which a membrane could follow a kilohertz envelope.
  definition: 'A passive membrane low-pass filters, so it cannot extract a low-frequency envelope from
    a purely high-frequency waveform; nonlinear, rectifying ion-channel behaviour can. The same modelling
    predicts tonic firing or conduction block in superficial tissue at intensities that would activate
    deep targets — the "sandwich" problem for the focality claim. Rectification also appears in the acoustic
    literature, where a bilayer sonophore is modelled to rectify a pressure wave into a periodic capacitance
    change.

    '
  see:
  - temporal-interference
  - intramembrane-cavitation
  - conduction-block
  sources:
  - 10.1016/j.cels.2020.10.004
  - 10.1103/PhysRevX.4.011004
- id: theta-burst-stimulation
  term: Theta-burst stimulation (TBS)
  kind: methods
  variants:
  - TBS
  - theta burst stimulation
  - theta-burst
  short: Bursts of high-frequency TMS pulses repeated at a theta rhythm; 20–190 s changes motor cortical
    excitability, with direction set by the pattern.
  definition: 'Theta-burst compressed the exposure needed for a lasting excitability change, where earlier
    repetitive protocols rarely outlasted about 30 minutes. Whether the after-effect is reproducible is
    disputed: in 56 healthy adults it varied widely and tracked late I-wave recruitment as indexed by
    motor evoked potential latency, which the authors read as responder status reflecting which interneuron
    networks a pulse recruits rather than plasticity capacity. Pooled individual data from 430 participants
    confirm large between-person variability.

    '
  see:
  - itbs
  - ctbs
  - i-wave
  - response-variability
  sources:
  - 10.1016/j.neuron.2004.12.033
  - 10.1093/cercor/bhs147
  - 10.1016/j.brs.2020.07.018
- id: itbs
  term: Intermittent theta-burst stimulation (iTBS)
  kind: methods
  variants:
  - iTBS
  - intermittent theta burst
  - intermittent TBS
  short: Theta-burst delivered in short trains separated by pauses; conventionally facilitatory, and the
    clinical form used in depression protocols.
  definition: 'Intermittent delivery is the facilitatory member of the theta-burst pair, and its after-effect
    was abolished by the NMDA antagonist memantine in a placebo-controlled study of six participants.
    Clinically, four weeks of intermittent theta burst combined with D-cycloserine 100 mg for the first
    two weeks produced a 6.15-point greater depression-scale reduction than placebo. In mouse organotypic
    slice the clinical iTBS600 protocol produced potentiation with spine remodelling lasting 24 hours.

    '
  see:
  - theta-burst-stimulation
  - itbs600
  - ctbs
  sources:
  - 10.1016/j.clinph.2007.01.021
  - 10.1001/jamapsychiatry.2022.3255
  - 10.1016/j.brs.2025.07.008
- id: ctbs
  term: Continuous theta-burst stimulation (cTBS)
  kind: methods
  variants:
  - cTBS
  - continuous theta burst
  - continuous TBS
  short: Theta-burst delivered as one uninterrupted train; conventionally suppressive of motor evoked
    potentials.
  definition: 'Continuous delivery is the suppressive member of the theta-burst pair, and memantine abolished
    its motor evoked potential suppression as it did the facilitation from intermittent delivery. In pooled
    individual data, response to continuous theta burst was predicted mainly by baseline motor evoked
    potential amplitude and measurement timepoint. In macaques, weeks of continuous or intermittent theta
    burst produced no change in glial PET or spectroscopy markers.

    '
  see:
  - theta-burst-stimulation
  - itbs
  - tspo
  sources:
  - 10.1016/j.clinph.2007.01.021
  - 10.1016/j.brs.2020.07.018
  - 10.1371/journal.pone.0301118
- id: itbs600
  term: iTBS600
  kind: notation
  variants:
  - 600-pulse iTBS
  short: The 600-pulse intermittent theta-burst protocol used clinically; applied to mouse organotypic
    slices it produced synaptic potentiation with spine remodelling.
  definition: 'Naming a protocol by its total pulse count is how the field identifies a specific clinical
    dose. Delivering iTBS600 to mouse organotypic slice cultures closed part of the preparation gap from
    the other end: it produced long-term potentiation of excitatory synapses with dendritic spine remodelling
    persisting for 24 hours, while overall network activity stayed stable.

    '
  see:
  - itbs
  - organotypic-slice-culture
  - long-term-potentiation
  sources:
