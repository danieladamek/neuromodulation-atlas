  kind: methods
  variants:
  - tRNS
  - random noise stimulation
  short: Scalp current with a noise waveform; in this volume it appears only inside a pooled tES safety
    envelope.
  definition: 'Random noise stimulation delivers current whose amplitude varies stochastically across
    a frequency band. This volume''s corpus contains no mechanistic or dose-specific source for it; it
    appears only within pooled safety data covering direct, alternating and noise stimulation together,
    which support use up to 4 mA and 60 min/day with no serious adverse events over more than 300,000
    sessions.

    '
