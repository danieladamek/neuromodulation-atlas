- id: astrocyte
  term: Astrocyte
  kind: science
  variants:
  - astrocytes
  - astrocytic
  - astrocytic calcium
  short: A glial cell type that responds to direct current on a larger scale than local neurons and is
    a candidate ultrasound transducer.
  definition: 'In transgenic mice, direct current stimulation produced widespread astrocytic calcium surges
    across cortex with little change in local neuronal activity, and the subsequent enhancement of sensory-evoked
    responses required α1-adrenergic signalling and IP3R2-dependent astrocytic calcium — an alternative
    to a purely neuronal polarisation account. Astrocytes are also proposed as the acoustic transducer,
    through TRPA1 opening and Best1-mediated glutamate release onto neuronal NMDA receptors.

    '
