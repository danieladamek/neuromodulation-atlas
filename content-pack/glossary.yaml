  - physiologically based model
  - target-site exposure model
  short: A compartmental model of drug distribution built from physiology, used to estimate brain target-site
    exposure when it cannot be measured.
  definition: 'Because target-site concentration is rarely measurable in people, it is modelled: compartments
    for plasma, brain extracellular fluid and CSF with transport terms fitted to animal data. It plays
    the role for drugs that finite-element field modelling plays for transcranial stimulation, and it
    carries the same requirement to record whether a value was measured or modelled.

