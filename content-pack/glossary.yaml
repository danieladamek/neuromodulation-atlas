- id: entrainment
  term: Entrainment
  kind: science
  variants:
  - entrain
  - entrained
  - entraining
  short: 'Used two ways: a driven evoked response following the stimulus, and engagement of an endogenous
    rhythm. The 40 Hz and tACS disputes turn on which is scored.'
  definition: 'In the strict sense, entrainment means an endogenous oscillator has been engaged, so that
    its own rhythm is phase-locked to the drive and the effect can outlast the stimulus. In looser use,
    any stimulus-locked periodic response counts, including a purely driven evoked response that reveals
    nothing about the native rhythm. The 40 Hz dispute turns on exactly this: one side reports flicker-driven
    responses and amyloid reduction, the other finds no engagement of native gamma in the same model.
    In macaques, alternating current entrained weakly locked neurons but often reduced phase locking in
    neurons already strongly locked to an endogenous rhythm.

    '
  see:
  - phase-locking
  - network-resonance
  - gamma-oscillation
  - forty-hz-stimulation
