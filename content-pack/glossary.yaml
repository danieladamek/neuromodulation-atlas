- id: adaptive-gain
  term: Adaptive gain theory
  kind: science
  variants:
  - adaptive-gain account
  - neural gain
  short: The account in which locus coeruleus activity sets neural gain, with phasic responses supporting
    task engagement and elevated tonic firing favouring exploration.
  definition: 'Synthesising primate electrophysiology with computational modelling, the account distinguishes
    two regimes rather than a single arousal axis: phasic responses time-locked to task-relevant decisions
    support engagement, while elevated tonic firing accompanies disengagement and exploration. The volume
    uses it to explain why pooled transcutaneous vagal evidence splits by waveform, pulsed against continuous,
    and why the sign of an effect can depend on regime as well as dose.

    '
  see:
