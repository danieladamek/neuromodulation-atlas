- id: expectancy
  term: Expectancy
  kind: methods
  variants:
  - pre-trial expectancy
  - participant expectancy
  short: What a participant expects a treatment to do; unreported in most drug trials here, and a route
    by which unblinding inflates effects.
  definition: 'A systematic search of psychedelic and ketamine trials from 1990 to November 2020 found
    they generally reported neither pre-trial expectancy nor blinding success, and argued that because
    the acute effects are unmistakable participants are effectively unblinded and effect sizes are likely
    overestimates. Expectancy is one of the items the volume lists as what reporting checklists cannot
    force.

    '
  see:
