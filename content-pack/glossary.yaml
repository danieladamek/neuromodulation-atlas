  - 10.1016/0006-8993(75)90364-9
- id: pulse-frequency
  term: Pulse frequency
  kind: notation
  variants:
  - pulse rate
  - stimulation frequency
  - pulse repetition frequency
  - PRF
  short: How often pulses are delivered; in vagal stimulation it set burst timing rather than total activity,
    and in DBS it is the parameter clinical benefit requires.
  definition: 'Frequency behaves differently at different levels. In rat locus coeruleus it changed when
    the phasic burst occurred but not the total amount of activity; in deep brain stimulation, clinical
    benefit requires high frequency, which is the fact any mechanism account must explain; in microbubble
    work the pulse repetition frequency (2 Hz in the feedback-controlled protocol) is a reported dose
    parameter.

    '
  see:
