- id: phasic-tonic
  term: Phasic and tonic firing
  kind: science
  variants:
  - phasic firing
  - tonic firing
  - phasic-tonic distinction
  short: Brief event-locked bursts against sustained background rate; two regimes of the same nucleus
    with different functional consequences.
  definition: 'The distinction is load-bearing in this volume: half-second vagal trains drive phasic locus
    coeruleus bursts, the adaptive-gain account assigns engagement to phasic and exploration to elevated
    tonic firing, and pooled human data show pulsed stimulation producing a pupil effect while continuous
    stimulation gives strong evidence for the null. Waveform, not intensity, is the decisive parameter
    there.

    '
