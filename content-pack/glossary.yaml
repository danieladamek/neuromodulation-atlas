  term: Subgenual cingulate
  kind: science
  variants:
  - subgenual ACC
  - sgACC
  - subgenual anterior cingulate cortex
  short: A ventromedial prefrontal region whose anticorrelation with a prefrontal stimulation site was
    proposed as a targeting rule for depression.
  definition: 'Sites with better reported antidepressant efficacy were more strongly anticorrelated with
    this region, which was inverted into optimal coordinates in Brodmann area 46. In 295 treated patients
    the association was weak, about 3% of outcome variance, which its authors judge too little to support
    individualised targeting protocols on its own.

