  term: Esketamine
  kind: drug
  variants:
  - intranasal esketamine
  short: The S-enantiomer of ketamine, given as a nasal spray; its registration trial adds a blinding
    problem to the route question.
  definition: 'TRANSFORM-2 randomised 227 patients with treatment-resistant depression to flexibly dosed
    intranasal esketamine or placebo spray, each with a newly started oral antidepressant, and found greater
    depression-scale improvement by day 28, with dissociation, nausea, vertigo, dysgeusia and dizziness
    generally resolving within about 1.5 hours. Those unmistakable acute effects are also what makes blinding
    doubtful.

