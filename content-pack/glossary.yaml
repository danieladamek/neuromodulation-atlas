- id: free-field-parameters
  term: Free-field acoustic parameters
  kind: methods
  variants:
  - free field
  - free-field output
  - free-field acoustic parameter
  short: What a transducer emits into water, measured without the skull; one of the two exposure values
    every ultrasound study must report.
  definition: 'The reporting consensus separates what the transducer emits into water from what is estimated
    to arrive in the brain, mirroring the device-dose versus tissue-field split of the electromagnetic
    literature. Free-field values are measurements; in situ values are estimates, because the skull sits
    between them and its properties vary by patient.

    '
  see:
  - in-situ-exposure
  - skull-density-ratio
  - tus
