- id: tissue-conductivity
  term: Tissue conductivity
  kind: science
  variants:
  - conductivity calibration
  - tissue conductivities
  short: The electrical conductivity assigned to each modelled tissue; calibrating it improved agreement
    with intracranial field measurements.
  definition: 'Conductivity values are the main free parameters of a field model. In ten epilepsy patients,
    calibrating tissue conductivities improved the match between modelled and measured cortical fields,
    whereas adding white-matter anisotropy or a multi-layer skull did not. Most current is lost before
    the brain: about 75% of scalp-applied current is shunted by soft tissue and skull.

    '
