  short: The pre-specified amount by which a new treatment may be worse and still be declared not meaningfully
    inferior.
  definition: 'Non-inferiority designs decide a comparison against a margin rather than against zero difference,
    so the margin and the endpoint carry the conclusion. Two open-label trials of ketamine against electroconvulsive
    therapy illustrate it: in 403 outpatients, response was 55.4% with ketamine against 41.2% and non-inferiority
    was met; in hospitalised patients, remission was 63% with therapy against 46% and it was not. Setting
    and endpoint differ, so the answer is not a property of the two modalities alone.

