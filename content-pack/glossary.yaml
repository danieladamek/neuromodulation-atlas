  term: Operational model of agonism
  kind: methods
  variants:
  - operational model
  short: A pharmacological framework relating occupancy to response in a functional system through an
    efficacy parameter.
  definition: 'The operational model, the extended ternary complex model for simulating G-protein-coupled
    receptor behaviour, and allosteric and ligand-selective active-state mechanisms are the settled conceptual
    vocabulary the volume adopts for ligand–receptor edges. Its point of contact with the rest of the
    volume is that it separates binding from response by an explicit efficacy term.

