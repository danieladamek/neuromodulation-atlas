  term: Noradrenaline
  kind: science
  variants:
  - norepinephrine
  - noradrenergic
  - α1-adrenergic
  short: The locus coeruleus transmitter; the system most device protocols claim to engage, indexed in
    humans only by weak proxies.
  definition: 'Noradrenergic engagement is the mechanism attributed to vagal stimulation, and pupil diameter
    is its standard non-invasive index. Splenic noradrenergic terminals are also required for the neuroimmune
    effect, and α1-adrenergic signalling was required for the astrocytic route to enhanced sensory responses
    after direct current in mice.

    '
