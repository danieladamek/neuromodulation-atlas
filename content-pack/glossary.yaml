  term: Affinity
  kind: science
  variants:
  - binding affinity
  - high affinity
  - low affinity
  short: How tightly a ligand binds its receptor; measured in a dish, it predicts nothing until exposure
    at the target is measured.
  definition: 'Affinity is one term of the worked pharmacological vocabulary for the coupling step, alongside
    occupancy, efficacy, the operational model and allosteric mechanisms. Its limits are illustrated by
    the chemogenetic case, where the administered ligand has low affinity for the designer receptor and
    does not enter the brain, while its metabolite does both.

