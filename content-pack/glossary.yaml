- id: intramembrane-cavitation
  term: Intramembrane cavitation
  kind: science
  variants:
  - neuronal intramembrane cavitation excitation
  - NICE model
  - bilayer sonophore
  short: The account in which acoustic pressure separates the leaflets of the lipid bilayer, rectifying
    the wave into a capacitance change that drives current.
  definition: 'The model treats the bilayer as a sonophore whose leaflets separate and re-approach under
    an acoustic field, so that the wave is rectified into a periodic capacitance change driving displacement
    currents and, through Hodgkin–Huxley-type conductances, spiking. Bilayer mechanics alone suffice,
    with no dedicated receptor. It is a computational model rather than a measurement: it reproduced previously
    published thresholds across pulsing regimes and predicted that duty cycle and intensity should bias
    excitation against suppression.

    '
  see:
