- id: neuropod-cell
  term: Neuropod cell
  kind: science
  variants:
  - enteroendocrine cell
  - epithelial sensor cell
  short: An intestinal epithelial cell that forms a glutamatergic synapse with a vagal afferent, transducing
    luminal stimuli in milliseconds.
  definition: 'Gut–brain signalling had been assumed hormonal and therefore slow, because no synapse was
    known between the intestinal epithelium and the vagus. Working in mice, these cells were shown to
    synapse onto vagal afferents and link the lumen to the brainstem across a single synapse. They are
    the volume''s second example of a non-neuronal node that a drive-to-outcome chain must be able to
    contain.

    '
