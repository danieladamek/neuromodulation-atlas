- id: blinding
  term: Blinding
  kind: methods
  variants:
  - blinded
  - double-blinding
  - blinding success
  - unblinded
  - masking
  short: Keeping participants and assessors unaware of allocation; usually judged from end-of-study guesses,
    which may overestimate how well masking held.
  definition: 'A meta-analysis of seven sham-controlled repetitive TMS trials in depression (n = 489)
    found participants'' allocation guesses did not differ between arms and judged blinding adequate.
    A review of sham protocols disputes the method: checks at the end of a study overestimate masking,
    while checks during stimulation reveal perceptual differences. The problem is larger in pharmacology,
    where acute effects are unmistakable and psychedelic and ketamine trials generally report neither
    expectancy nor blinding success. A claim from an unblinded or sham-inadequate study carries a flag
    in the graph.

    '
  see:
  - sham
