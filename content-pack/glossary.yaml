  term: Cavitation
  kind: science
  variants:
  - cavitational
  - inertial cavitation
  - stable cavitation
  short: 'Used two ways: leaflet separation within the lipid bilayer (intramembrane), and oscillation
    or collapse of gas bubbles in the vasculature (microbubble).'
  definition: 'In the intramembrane sense, cavitation happens inside the membrane itself and is proposed
    as the endogenous transducer of low-intensity ultrasound in neurons. In the microbubble sense, it
    is the oscillation of injected gas bodies in blood vessels, which is why barrier-opening techniques
    work far below ablative intensities and why their coupling target is the endothelium rather than the
    neuron. The two senses share a word and almost nothing else: they differ in target, in intensity range
    and in whether an exogenous agent is required. A frequency sweep discriminates cavitation-based mechanisms
    from radiation force, since the two predict opposite frequency dependence.

    '
