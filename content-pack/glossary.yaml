- id: motor-threshold
  term: Motor threshold
  kind: methods
  variants:
  - resting motor threshold
  - percentage of motor threshold
  - '% of motor threshold'
  short: The minimum TMS intensity that reliably elicits a motor response; the clinical norm for dosing,
    expressed as a percentage.
  definition: 'Dosing TMS as a percentage of motor threshold individualises intensity to a person''s corticospinal
    excitability, and it remains the clinical standard. A proposed alternative calibrates intensity to
    the modelled cortical electric field instead, but its proponents list simulation, target definition
    and cross-region thresholds as open problems. Motor threshold is measured at the hand representation
    and transferred to other targets by assumption.

    '
