- id: coherence
  term: Coherence
  kind: statistics
  variants:
  - neuronal coherence
  - effective connectivity through coherence
  short: Consistent phase alignment between two oscillating populations; in the communication-through-coherence
    account, the variable that gates routing.
  definition: 'Active neuronal groups oscillate, so their excitability fluctuates rhythmically, opening
    and closing short windows for receiving and emitting input; two groups influence one another effectively
    only when their windows align at a consistent phase relation. A changing pattern of coherence is then
    a changing effective connectivity, reconfigurable on cognitive timescales. This is theory, and it
    is what licenses entrainment-style intervention: if phase gates communication, imposing phase should
    change routing.

    '
