- id: tes
  term: Transcranial electrical stimulation (tES)
  kind: methods
  variants:
  - tES
  - transcranial electrical stimulation
  - transcranial electric stimulation
  short: Low-intensity current applied through scalp electrodes; the family covering tDCS, tACS, tRNS
    and related waveforms.
  definition: 'Transcranial electrical stimulation injects current at the scalp, of which most is shunted,
    leaving cortical fields around 0.8 V/m at 2 mA. Nomenclature for the family had to be settled deliberately,
    trading definitions broad enough to allow new techniques against the specificity needed to reproduce
    protocols and compare safety and efficacy. Pooled evidence from more than 300,000 low-intensity sessions
    reports no serious related adverse events and supports use up to 4 mA for up to 60 min/day.

    '
  see:
