- id: dosimetry
  term: Dosimetry
  kind: methods
  variants:
  - E-field dosimetry
  - dosimetric
  short: Estimating the exposure a drive produces in tissue — modelled fields for electromagnetic drives,
    in situ estimates for ultrasound, fluence at depth for light.
  definition: 'Dosimetry is the step between the device setting and the tissue quantity. For transcranial
    fields it is finite-element modelling from individual anatomy, validated against intracranial measurement
    in small patient samples; for ultrasound it is the in situ estimate the reporting consensus asks for;
    for light it is transmittance or photon-transport modelling. The volume''s complaint is not that dosimetry
    is impossible but that the step from a modelled field to a single reported number has no agreed rule.

    '
