- id: isppa
  term: ISPPA
  kind: notation
  variants:
  - I_SPPA
  - spatial-peak pulse-average intensity
  - spatial peak pulse average intensity
  short: Spatial-peak pulse-average acoustic intensity, in W/cm²; the headline ultrasound intensity figure,
    which alone did not predict direction of effect.
  definition: 'ISPPA is the intensity at the spatial peak of the beam, averaged over the pulse rather
    than over time, so it separates peak from time-averaged exposure. Across 32 human studies it did not
    predict whether the outcome was enhancement or suppression (p = 0.256), while duty cycle and sonication
    duration did. It is one of the intensity parameters the reporting consensus asks for.

    '
  see:
  - duty-cycle
  - watts-per-square-centimetre
  - tus
