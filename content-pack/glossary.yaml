- id: tdcs
  term: Transcranial direct current stimulation (tDCS)
  kind: methods
  variants:
  - tDCS
  - transcranial direct current stimulation
  - direct current stimulation
  short: Sustained low-intensity direct current at the scalp; its after-effect is read as polarity-specific
    excitability change, and that reading is disputed.
  definition: 'Standard practice applies 1–2 mA for tens of minutes, with anodal stimulation conventionally
    raising and cathodal lowering motor cortical excitability. The cellular account is compartment-specific
    polarisation measured in rodent slice, where direct current modulated rather than induced plasticity
    and required concurrent synaptic activity. Rival accounts attribute human after-effects to cranial
    and cervical nerve co-stimulation, or to astrocytic calcium signalling, and a quantitative review
    found no significant single-session cognitive effect in healthy adults.

    '
