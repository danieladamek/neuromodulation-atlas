- id: electroconvulsive-therapy
  term: Electroconvulsive therapy (ECT)
  kind: methods
  variants:
  - ECT
  - electroconvulsive therapy
  short: A transcranial drive under general anaesthesia that induces a generalised seizure; in this corpus
    reported only by schedule and outcome.
  definition: 'The volume''s two sources are open-label randomised non-inferiority trials against intravenous
    ketamine, so it can report three sessions weekly for three weeks and a median of six sessions to remission,
    but not electrode placement, pulse width or charge. Outcomes conflict by setting and endpoint: response
    41.2% against 55.4% with ketamine in 403 outpatients, and remission 63% against 46% in hospitalised
    patients.

    '
