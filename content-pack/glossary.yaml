  definition: 'PET supplies the volume''s only in-human molecular-level measurements: receptor occupancy
    and displacement, brain entry of an administered compound versus its metabolite, amyloid burden before
    and after barrier opening, and glial TSPO signal after weeks of stimulation in macaques. Its interpretation
    depends on tracer validity, which is where the TSPO species mismatch bites.

