- id: cortical-map-plasticity
  term: Cortical map plasticity
  kind: science
  variants:
  - map expansion
  - cortical map expansion
  - motor map plasticity
  short: Enlargement of a body-part representation in cortex after paired training and stimulation, mapped
    by intracortical microstimulation.
  definition: 'Map expansion is the rodent readout that carries the gating claim for vagal stimulation:
    it appeared when training was paired with stimulation, disappeared after cholinergic lesion of the
    source nucleus, and persisted under three clinically dosed receptor antagonists. The readout is intracortical
    microstimulation mapping, which is also the only appearance of that technique in the volume as a measurement
    tool.

    '
