- id: tus
  term: Transcranial ultrasound stimulation (TUS)
  kind: methods
  variants:
  - TUS
  - transcranial ultrasonic stimulation
  - low-intensity transcranial ultrasound
  - transcranial ultrasound stimulation
  short: Focused, pulsed pressure waves delivered through the skull at intensities below ablation, intended
    to modulate neural activity focally and deeply.
  definition: 'Low-intensity transcranial ultrasound is the volume''s least-specified coupling case: at
    least four candidate transducers compete — intramembrane cavitation, mechanosensitive channels, acoustic
    radiation force and heating — and a peripheral auditory confound competes with all of them. Reporting
    is standardised by an expert consensus asking for six domains, from transducer and drive settings
    to free-field parameters, pulse timing, in situ exposure estimates and intensity parameters. No study
    in this corpus identifies the transducer in human tissue.

    '
  see:
  - intramembrane-cavitation
  - acoustic-radiation-force
  - auditory-confound
  - in-situ-exposure
