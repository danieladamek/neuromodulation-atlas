- id: layer-v-pyramidal-neuron
  term: Layer V pyramidal neuron
  kind: science
  variants:
  - layer 5 pyramidal cell
  - layer V pyramidal cells
  - L5 pyramidal neuron
  short: The large deep-cortical output neuron most sensitive to applied fields in the modelling and slice
    literature.
  definition: 'Patch-clamp recordings from reconstructed rat motor-cortex neurons in uniform fields showed
    morphology predicts somatic subthreshold polarisation, with these cells the most sensitive and suprathreshold
    thresholds lower in deep than superficial layers. Modelling coupled to head models makes them the
    most excitable cells for magnetic stimulation, and the same cell type carries the psychedelic account,
    where apical dendrites bear the receptors weighted by the reference review.

    '
