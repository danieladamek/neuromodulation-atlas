- id: beta-burst
  term: Beta burst
  kind: science
  variants:
  - beta-band activity
  - beta band
  - pathological beta
  short: A transient rise in 13–30 Hz subthalamic activity treated as a pathological marker in Parkinson's
    disease and used to trigger stimulation.
  definition: 'In eight patients with advanced Parkinson''s disease, stimulation gated by beta bursts
    improved blinded motor scores by 50%, about 27% better than continuous stimulation, while total stimulation
    time fell by 56%; random intermittent stimulation did not match it, which locates the benefit in timing
    rather than intermittency. Timing relative to brain state is therefore part of dose.

    '
