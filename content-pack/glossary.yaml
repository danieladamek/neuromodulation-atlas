- id: pulse-width
  term: Pulse width
  kind: notation
  variants:
  - pulse widths
  - pulse duration
  - phase duration
  short: How long one stimulus phase lasts; with amplitude it sets charge per phase, and it selects which
    neural element is recruited.
  definition: 'Pulse width is a dose parameter with two distinct consequences. It sets the charge delivered
    per phase, and through the chronaxie relation it selects among neural elements. In rat locus coeruleus
    recordings across a grid of vagus-nerve stimulation settings, higher current and longer pulse widths
    increased firing rate, whereas pulse frequency changed when the phasic burst occurred without changing
    total activity.

    '
  see:
  - chronaxie
  - charge-per-phase
  - pulse-frequency
