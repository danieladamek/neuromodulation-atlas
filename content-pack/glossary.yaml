- id: adaptive-dbs
  term: Adaptive deep brain stimulation
  kind: methods
  variants:
  - closed-loop DBS
  - adaptive DBS
  - aDBS
  short: Deep brain stimulation whose delivery is gated by a recorded neural marker rather than run continuously.
  definition: 'Beta-burst-gated stimulation improved blinded motor scores by 50%, about 27% better than
    continuous stimulation, with 56% less stimulation time. A blinded randomised cross-over feasibility
    trial in four patients then ran adaptive stimulation chronically at home using stimulation-entrained
    gamma oscillations chosen per patient, improving motor symptoms and quality of life relative to optimised
    continuous stimulation. Two things about dose change: delivered charge falls as effect rises, and
    the parameters become a distribution over states rather than a setting.

    '
