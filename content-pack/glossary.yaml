- id: phase-locking
  term: Phase locking
  kind: statistics
  variants:
  - phase-locked
  - phase locking value
  short: A consistent relationship between spike or oscillation phase and a reference rhythm; the usual
    measure of entrainment without a rate change.
  definition: 'Much of the transcranial alternating-current evidence is about timing rather than amount:
    in awake macaques, scalp stimulation altered the timing but not the rate of single-neuron spiking,
    including in hippocampus and basal ganglia. Phase locking is how that is quantified, and it is also
    how the competition between an applied and an endogenous rhythm shows up, since stimulation reduced
    locking in already strongly locked neurons.

    '
  see:
