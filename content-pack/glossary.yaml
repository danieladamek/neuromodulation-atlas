- id: co-stimulation
  term: Co-stimulation
  kind: science
  variants:
  - side-channel stimulation
  - somatosensory co-stimulation
  - auditory co-stimulation
  short: Unintended stimulation of scalp, ear or peripheral nerves accompanying every non-invasive drive;
    a rival explanation rather than mere noise.
  definition: 'The TMS consensus states that every pulse causes substantial somatosensory and auditory
    co-stimulation that must be controlled for. The question is never whether the side channel exists
    but whether it alone produces the headline effect: in humans, ultrasonic motor inhibition was driven
    by auditory stimulation, and scalp sensation from ultrasound is a second, tactile channel. A confound
    is a node in the graph with edges to the claims it threatens, and rebuttals are counter-edges on that
    node.

    '
  see:
