  short: Red to near-infrared light applied to tissue to change cell function; transcranially, its delivered
    dose is disputed.
  definition: 'The reported dose quantities are wavelength, irradiance and fluence, and a proponent review
    argues the response is biphasic, with low fluence stimulating more than high. The prior question for
    the transcranial form is how much light arrives: measured through human skull, more than 99% was absorbed
    or scattered, with maximum transmittance 0.31% for a 905 nm laser and 0.71% for an 810 nm LED helmet,
    while mitochondrial stimulation in cells needed 14–775 times the transmitted level. A photon-transport
    simulation estimating about 15% of incident energy at cortex disputes this, and the two quantities
