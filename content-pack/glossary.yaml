  term: (2R,6R)-hydroxynorketamine
  kind: drug
  variants:
  - (2R,6R)-HNK
  - hydroxynorketamine
  - HNK
  short: A ketamine metabolite reported to be antidepressant without NMDA receptor inhibition, and for
    which no direct target has been found.
  definition: 'In mice the metabolite produced antidepressant-like effects independent of NMDA receptor
    inhibition but dependent on AMPA receptor activation, without ketamine''s side-effect profile. A systematic
    target deconvolution across binding, functional and large-scale screens at thousands of human proteins
    then found no direct target at all, while the compound remained behaviourally active. A third position
    keeps the metabolite but denies it needs its own target, reading NMDA antagonist pretreatment that
    abolishes the effects of four unrelated compounds as a shared downstream requirement.

    '
