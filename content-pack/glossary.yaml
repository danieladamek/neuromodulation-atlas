  short: The intraclass correlation coefficient, used for test–retest reliability; across 15 studies of
    rTMS after-effects it was 0.29–0.70.
  definition: 'ICC measures how much of the total variance in repeated measurements is between rather
    than within subjects, so it is the natural index of whether a protocol''s effect is stable in one
    person. Across 15 studies with 291 participants of motor-cortex repetitive TMS after-effects, test–retest
    reliability was r 0.10–0.55 and ICC 0.29–0.70, with no protocol significantly more reliable than another.

