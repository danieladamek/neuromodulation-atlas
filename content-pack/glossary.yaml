- id: proxy
  term: Proxy
  kind: methods
  variants:
  - surrogate measure
  - stand-in measure
  - proxy measure
  short: A measurable quantity standing in for an inaccessible one; the edge that uses it inherits its
    validity, which is often weak.
  definition: 'Pupil diameter for noradrenergic activity is the volume''s worked example: monotonic with
    locus coeruleus spike count in mice but predicting only a small fraction of moment-to-moment activity,
    and itself state-dependent. Proxies further from the target need validation of their own, and where
    a proxy stands in for a system the edge inherits its validity, which for pupil and noradrenaline is
    weak and protocol-dependent.

    '
