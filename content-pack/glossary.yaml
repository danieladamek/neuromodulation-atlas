- id: in-situ-exposure
  term: In situ exposure
  kind: methods
  variants:
  - in situ estimate
  - in situ estimates
  - in situ acoustic value
  short: The estimated acoustic exposure in the brain after transmission through the skull; estimated
    rather than measured in human work.
  definition: 'In situ exposure is the acoustic counterpart of a modelled E-field: the quantity the biology
    sees, derived by correcting free-field output for skull transmission. The consensus asks for it explicitly
    as a separate reporting domain. In this corpus it is never a measured human focal value, which is
    why the volume records free-field and in situ as two properties rather than one.

    '
  see:
