- id: tms
  term: Transcranial magnetic stimulation (TMS)
  kind: methods
  variants:
  - TMS
  - transcranial magnetic stimulation
  short: A pulsed magnetic field applied outside the head that induces an electric field in cortex, acting
    mainly on superficial gyral axons.
  definition: 'The consensus position on what TMS activates is a statement about geometry rather than
    intensity: the induced time-varying field acts mainly on superficial gyral cortex, and the most likely
    primary targets are myelinated axon terminals of pyramidal cells and interneurons at the gyral crown,
    with activity then spreading through intracortical circuits and white-matter projections in a state-dependent
    way. The same consensus notes that every pulse also produces substantial somatosensory and auditory
    co-stimulation that must be controlled.

    '
