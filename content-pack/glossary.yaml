- id: pharmaco-tms
  term: Pharmaco-TMS
  kind: methods
  variants:
  - pharmaco-TMS-EMG
  - drug challenge
  - pharmacological challenge
  short: Using a drug with known receptor action to assign a molecular identity to a stimulation-induced
    effect; a measurement instrument before a treatment.
  definition: 'The reference review treats pharmaco-TMS-EMG as a mapping of drug effects onto stimulation-evoked
    muscle responses, and drug challenge as the way to dissect the mechanisms of stimulation-induced LTP-like
    and LTD-like plasticity. On that framing a drug-plus-device study is an instrument first: memantine
    abolishing a theta-burst after-effect assigns NMDA receptor dependence, while adjunctive D-cycloserine
    multiplying a clinical effect composes drug and device at a shared molecular node. Blockade has a
    structural limit, since it shows the receptor is needed somewhere in the measured pathway, not where.

    '
