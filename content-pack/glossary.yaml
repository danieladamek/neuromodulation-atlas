- id: peripheral-route
  term: Peripheral route
  kind: science
  variants:
  - peripheral mechanism
  - transcutaneous route
  - peripheral nerve co-stimulation
  short: The account in which a transcranial effect is produced by stimulating scalp and cervical nerves
    rather than cortex directly.
  definition: 'In rats and humans, cortical alternating-current fields were argued to be too weak for
    direct activation while skin fields are much stronger; anaesthetising the skin reduced stimulation-induced
    tremor entrainment, and peripheral nerve stimulation alone reproduced the motor effects. Six direct-current
    results have been re-read the same way. The rebuttal is a lesion-style control in the same species
    as the positive evidence: macaque neurons stayed entrained after topical anaesthesia blocked somatosensory
    input. The two need not conflict, and the test for a given claim is to block or match the peripheral
    input and see what survives.

    '
