  term: Figure-8 coil
  kind: methods
  variants:
  - figure-of-eight coil
  - figure-8
  - circular coil
  short: A TMS coil of two adjacent windings whose fields sum under the centre, giving more focal stimulation
    than a circular coil.
  definition: 'Coil geometry sets the field''s shape, and the figure-8 design is the standard focal choice:
    in simulation it gave tangential spreads as small as 5 cm² against 34 cm² for circular types at comparable
    depth. Coil geometry is part of dose, since dose is every device-side parameter that determines the
    induced field.

    '
