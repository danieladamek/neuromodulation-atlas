  - 11C-raclopride
  - raclopride binding
  short: PET imaging with a reversible D2 ligand, used to measure receptor occupancy and, by competition,
    endogenous dopamine release.
  definition: 'Because raclopride binding is displaceable, it serves two purposes. As an occupancy measure
    it quantified haloperidol''s D2 binding in first-episode patients. As a competition assay it indexed
    release: left dorsolateral prefrontal repetitive TMS reduced binding in the ipsilateral dorsal caudate
    only, with no change in putamen, accumbens or contralateral caudate, implying focal dopamine release
    remote from the stimulated cortex.

    '
