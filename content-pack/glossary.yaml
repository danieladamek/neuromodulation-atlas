  kind: science
  variants:
  - cfos
  - c-fos induction
  short: The canonical immediate-early gene product, used to mark which regions a stimulus drove.
  definition: 'c-Fos marks that tissue was driven, not how its synapses changed: two protocols that raised
    it everywhere in rat cortex, 1 Hz and 10 Hz, were not distinguished from each other by the marker.
    It also serves as the readout showing that an installed acoustic actuator worked, with unilateral
    TRPA1 expression in mouse layer V motor cortex producing c-fos induction and contralateral limb movement.

