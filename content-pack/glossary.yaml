  - mitochondrial stimulation
  - metabolic endpoint
  short: Respiratory-chain activity and related metabolism; for photobiomodulation the proposed transducer,
    for other drives a downstream endpoint.
  definition: 'For light the mitochondrion is the proposed transducer, through cytochrome c oxidase, and
    the cellular threshold for mitochondrial stimulation is what the skull-transmission measurement was
    set against. Other modalities arrive at metabolism from outside: rats given bilateral anodal direct
    current at 200 µA for 20 minutes daily for five days showed metabolomic and transcriptomic changes
    in glycolysis, mitochondrial function and calcium signalling in the stimulated tissue, at a current
