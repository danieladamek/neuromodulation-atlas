  term: Clozapine-N-oxide (CNO)
  kind: drug
  variants:
  - CNO
  - clozapine N-oxide
  short: The ligand designed to be inert for chemogenetics; it does not enter the brain and acts through
    its conversion to clozapine.
  definition: 'CNO was assumed inert and brain-penetrant. Measurement showed neither: it does not enter
    the brain, binds designer receptors weakly, and is converted in vivo to clozapine, which enters and
    occupies them, with subthreshold clozapine doses preferentially producing the designer-receptor behaviour.
    It is the volume''s standing example of a control assumed inert rather than measured.

