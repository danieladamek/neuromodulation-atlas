- id: locus-coeruleus
  term: Locus coeruleus
  kind: science
  variants:
  - LC
  - locus coeruleus firing
  short: The pontine noradrenergic nucleus; the best-characterised device-engageable neuromodulator source
    and the origin of the adaptive-gain account.
  definition: 'Rat recordings across a grid of vagus-nerve stimulation settings showed half-second trains
    driving phasic firing from 0.1 mA upward, with higher current and longer pulse widths raising rate
    and pulse frequency shifting burst timing without changing total activity. The adaptive-gain account
    holds that the nucleus sets neural gain in two regimes rather than merely arousal. Its non-invasive
    human proxy, pupil diameter, is weak and state-dependent.

    '
  see:
