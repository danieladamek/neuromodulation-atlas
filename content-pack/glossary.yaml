- id: forty-hz-stimulation
  term: 40 Hz sensory stimulation
  kind: methods
  variants:
  - 40 Hz flicker
  - 40 Hz audiovisual stimulation
  - gamma sensory stimulation
  short: Driving the brain at 40 Hz by light or sound, claimed to entrain gamma and reduce amyloid; each
    link of that chain is separately contested.
  definition: 'The original chain ran from a sensory or optogenetic drive through gamma entrainment to
    microglia and amyloid; a later study added glymphatic clearance as a different effector for the same
    drive. Against both, large-scale recordings in model mice found no engagement of native gamma, flicker
    aversion, and no meaningful change in plaques or microglia. The chain has at least four joins, and
    the supporting papers do not all measure the same ones; what turns on the definition of entrainment
    is the first join.

    '
