  - crown of the gyrus
  short: The outer bend of a cortical fold, where the induced field is strongest and where TMS is thought
    to act first.
  definition: 'The consensus account of magnetic stimulation is geometric: the induced field acts mainly
    on superficial gyral cortex, with the most likely primary targets the myelinated axon terminals of
    pyramidal cells and interneurons at the crown, and modelling puts the lowest thresholds in intracortical
    axon terminals at the crown and lip.

