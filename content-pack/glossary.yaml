- id: dlpfc
  term: Dorsolateral prefrontal cortex (DLPFC)
  kind: science
  variants:
  - DLPFC
  - dorsolateral prefrontal cortex
  - left dorsolateral prefrontal cortex
  short: The standard cortical target for antidepressant stimulation; high-frequency repetitive TMS there
    is graded definitely effective.
  definition: 'The European guideline grades high-frequency repetitive stimulation of left dorsolateral
    prefrontal cortex for depression as level A, definite efficacy against sham. It is also where the
    connectivity-targeting literature operates, and where prefrontal stimulation reduced raclopride binding
    in the ipsilateral dorsal caudate, implying dopamine release remote from the stimulated cortex.

    '
