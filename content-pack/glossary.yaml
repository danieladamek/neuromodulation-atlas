- id: nf-kb
  term: NF-κB
  kind: science
  variants:
  - NF-kB
  - NF-kappaB
  - NF-κB pathway
  short: A transcription factor pathway central to inflammatory gene expression; its activation after
    barrier opening tracked microbubble dose.
  definition: 'In rats, a study comparing three sonication protocols found no significant pathway change
    at clinical imaging doses of microbubbles, whereas high doses activated it and produced oedema, neuronal
    degeneration, neutrophil infiltration and microhaemorrhage at 6 hours and 4 days. The dispute over
    whether barrier opening is an injury is therefore about dose, not about whether inflammation can occur.

    '
