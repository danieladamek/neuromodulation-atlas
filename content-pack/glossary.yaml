  term: Normative connectome
  kind: methods
  variants:
  - normative connectome data
  - group connectome
  - normative human connectome
  short: Connectivity averaged over a healthy reference cohort, used to characterise a patient's stimulation
    volume without patient-specific imaging.
  definition: 'In 51 patients with subthalamic stimulation, electrode localisation combined with normative
    connectome data showed structural and functional connectivity of the stimulation volume to be independent
    predictors of motor improvement, replicating in an independent cohort without patient-specific imaging.
    Pooling lesions, TMS sites and DBS sites, circuits derived from damage and from therapeutic stimulation
    converged on one distributed network independent of diagnosis.

    '
