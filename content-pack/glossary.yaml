  variants:
  - exposure-response analysis
  - exposure–response relationship
  short: Relating a measured exposure summary to a clinical endpoint, rather than relating dose to endpoint
    directly.
  definition: 'Good-practice guidance for exposure–response analysis of clinical drug trials treats exposure
    quantities such as AUC and Cmax, not the administered amount, as the predictor of endpoint. It is
    the pharmacological counterpart of dosing a device by delivered field rather than by dial setting,
    and the volume cites it as the closest existing practice to what it asks of device dosimetry.

    '
