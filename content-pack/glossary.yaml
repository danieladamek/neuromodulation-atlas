  term: Biomarker
  kind: methods
  variants:
  - control signal
  - state signal
  - marker
  short: A measured signal standing in for a state of interest; in closed loops it both indexes and is
    shaped by the intervention.
  definition: 'A circuit-level edge needs its biomarker named, because the same protocol can potentiate
    a corticospinal readout while leaving an EEG readout unchanged, and because a closed loop''s control
    signal may be endogenous beta or stimulation-entrained gamma that exists only while stimulating. Where
    a proxy stands in for a system, the edge inherits the proxy''s validity.

    '
