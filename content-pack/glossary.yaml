- id: finite-element-head-model
  term: Finite-element head model
  kind: methods
  variants:
  - finite element head model
  - individual head model
  - finite-element model
  - FEM head model
  - finite-element head models
  - finite-element models
  short: A numerical model of a person's head from MRI, used to estimate the field a montage or coil produces
    in their brain.
  definition: 'Because one device setting produces different fields in different heads, pipelines segment
    MRI into tissue compartments and solve for the field numerically. Individual models correlated well
    with intracranial measurements in epilepsy patients (r = 0.86 cortical, r = 0.88 depth), and calibrating
    tissue conductivities improved accuracy while adding white-matter anisotropy or a multi-layer skull
    did not. Accurate tissue geometry and a sufficiently accurate numerical method matter most, and uncorrected
    imaging artefacts alone shifted local field estimates by more than 30%.

    '
