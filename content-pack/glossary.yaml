  term: Immediate-early gene
  kind: science
  variants:
  - immediate-early genes
  - IEG
  - activity marker
  short: A gene transcribed within minutes of neural activity, used as a cheap, anatomically resolved
    marker that tissue was driven.
  definition: 'Immediate-early gene expression is the workhorse readout of the molecular level because
    it is sensitive to pattern: in rats, 1 Hz and 10 Hz repetitive TMS raised c-Fos in all cortical areas
    tested while intermittent theta burst raised it only in limbic cortices, so the response tracked the
    stimulation pattern rather than the pulse count. What these readouts cannot give is the direction
    of a synaptic change; where direction is needed the measurement has to be synaptic.

    '
