- id: network-resonance
  term: Network resonance
  kind: science
  variants:
  - frequency-specific enhancement
  - resonance condition
  short: Amplification of a weak periodic drive when its frequency matches a network's intrinsic rhythm.
  definition: 'Large-scale network simulations with supporting ferret recordings propose resonance as
    the mechanism by which fields far too weak to drive a single neuron can shape population activity:
    enhancement is frequency-specific and largest when stimulation matches the intrinsic rhythm, with
    the hyperpolarising phase delaying premature firing and the depolarising phase synchronising population
    firing. It is the main reason a dose rule for alternating-current stimulation has to be state-dependent.

    '
  see:
  - entrainment
  - tacs
  - endogenous-field
  sources:
