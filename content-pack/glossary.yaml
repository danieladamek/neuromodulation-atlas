- id: species-translation
  term: Species translation
  kind: methods
  variants:
  - cross-species translation
  - species scaling
  short: Carrying a result from one species to another; fields do not scale with heads, and markers do
    not always transfer either.
  definition: 'Finite-element models of mouse, monkey and human heads predict that magnetic field strength
    first rises then falls with head size and that electrical fields differ by up to about 100-fold, so
    animal parameters should be matched to human fields rather than copied. An experiment run at fields
    a human montage cannot produce still shows that a coupling mechanism exists; it does not show that
    the human protocol engages it. Readouts may not transfer either, as with a glial PET marker that indexes
    activation in mice but not primates.

    '
