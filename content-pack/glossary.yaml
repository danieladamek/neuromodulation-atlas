  term: Gamma oscillation
  kind: science
  variants:
  - gamma
  - native gamma
  - gamma-band activity
  - gamma rhythm
  short: Fast (roughly 30–80 Hz) rhythmic population activity; the target of 40 Hz protocols and a control
    signal in adaptive deep brain stimulation.
  definition: 'Gamma appears twice in the volume. As a target, it is what 40 Hz sensory protocols claim
    to entrain, disputed because flicker-driven responses are not the same as engagement of the native
    rhythm. As a control signal, it is stimulation-entrained gamma in subthalamic nucleus or motor cortex,
    chosen per patient as the marker for chronic adaptive stimulation — a signal partly produced by the
    intervention it governs.

    '
