- id: terminal-polarisation
  term: Terminal polarisation
  kind: science
  variants:
  - terminal polarization
  - bend polarisation
  - axon terminal polarisation
  short: Polarisation concentrated where fibre geometry breaks — terminations, bends and gradient changes
    — which cable analysis predicts dominates in a uniform field.
  definition: 'Because the driving term for extracellular excitation is the second spatial derivative
    of potential along a fibre, a straight fibre in a uniform field has no driving term and polarisation
    concentrates where the geometry breaks. This is the predicted primary target of TMS: myelinated axon
    terminals at the gyral crown and lip. A claim about somata does not license a claim about terminals,
    and the two predict different sensitivities to coil or electrode orientation.

    '
