- id: microglia
  term: Microglia
  kind: science
  variants:
  - microglial
  - microglial morphology
  short: The brain's resident immune cells; their state is the contested effector in the 40 Hz amyloid
    literature.
  definition: 'In Alzheimer''s model mice, optogenetic 40 Hz driving of fast-spiking interneurons lowered
    amyloid species and changed microglial morphology, and non-invasive flicker reduced amyloid in visual
    cortex. Against that, large-scale recordings in the same model found no engagement of native gamma,
    flicker avoidance, and no meaningful change in plaques or microglia. The only primate-level assay
    of stimulation-driven glial activation collected here is negative, and obtained with a marker that
    does not index activation in primates.

    '
