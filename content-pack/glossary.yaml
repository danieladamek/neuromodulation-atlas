  short: A translation-control kinase pathway activated rapidly by ketamine in rat prefrontal cortex,
    with rapamycin blocking both synaptogenesis and behaviour.
  definition: 'A single ketamine dose quickly activated mTOR signalling in rat prefrontal cortex, raised
    synaptic signalling proteins and increased the number and function of dendritic spines, and rapamycin
    blocked both the synaptogenesis and the antidepressant-like behaviour. The branch carries an explicit
    timescale, but its human anchor is a symptom score: this corpus contains no measurement of mTOR activation
