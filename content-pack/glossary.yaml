- id: paired-associative-stimulation
  term: Paired associative stimulation (PAS)
  kind: methods
  variants:
  - PAS
  - paired associative stimulation protocol
  - paired associative stimulation
  short: Peripheral nerve stimulation paired with a TMS pulse at a fixed interval; the first human protocol
    written on a Hebbian timing rule.
  definition: 'Pairing median-nerve stimulation with motor-cortex TMS at a fixed interval raised motor
    evoked potential amplitudes within 30 minutes, lasting at least 30–60 minutes, specific to the targeted
    representation, which the authors interpreted as associative LTP-like plasticity. It is also one of
    the three protocols in which only about 39–45% of healthy participants moved in the expected direction,
    with responses bimodal and unrelated across protocols.

    '
  see:
  - ltp-like-plasticity
  - response-variability
  - spike-timing-dependent-plasticity
