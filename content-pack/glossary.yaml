  term: mV/mm
  kind: notation
  variants:
  - millivolts per millimetre
  - millivolts per millimeter
  short: Millivolts per millimetre, the field unit used in slice and intracranial work; numerically equal
    to V/m.
  definition: 'Slice electrophysiology reports applied fields in mV/mm because that is the scale of the
    gradient across a neuron: uniform DC fields below 40 mV/mm polarised rat CA1 somata linearly, and
    endogenous ferret cortical fields during activity were about 2–4 mV/mm. Human and macaque intracranial
    recordings put peak transcranial field strengths at about 0.5 mV/mm in superficial cortex.

    '
