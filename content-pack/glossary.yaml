- id: active-placebo
  term: Active placebo
  kind: methods
  variants:
  - niacin placebo
  - active comparator placebo
  short: A control agent that produces noticeable effects of its own, used to make blinding credible when
    the test drug is unmistakable.
  definition: 'The phase 2 psilocybin trial used 100 mg niacin as an active placebo, both arms with psychological
    support, and found a 12.3-point greater depression-scale reduction with psilocybin to day 43. It is
    one answer to the unblinding problem in psychedelic trials, though not a complete one, since the target
    drug''s subjective effects remain distinctive.

    '
