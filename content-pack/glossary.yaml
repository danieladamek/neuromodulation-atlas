- id: e-field-outcome-measure
  term: E-field outcome measure
  kind: statistics
  variants:
  - E-field outcome measures
  - field outcome measure
  short: The rule for reducing a modelled field to a number; a review of 202 studies found 308 different
    ones, poorly correlated with each other.
  definition: 'Modelling a field is not the same as agreeing what to extract from it. A systematic review
    of 202 transcranial studies found 308 distinct field outcome measures, 197 volume-based and 111 surface-based,
    and running 1,000 models in 100 people showed that the measures gave different values, sampled different
    regions and did not always correlate strongly; region-of-interest and percentile-based whole-brain
    measures overlapped by only about 6% within a person. There is still no consensus on which feature
    to extract or how.

    '
