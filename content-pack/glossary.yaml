- id: pupillometry
  term: Pupillometry
  kind: methods
  variants:
  - pupil diameter
  - pupil dilation
  - event-related pupil dilation
  - resting pupil size
  short: Measuring pupil size as a non-invasive stand-in for noradrenergic engagement; a monotonic but
    weak and state-dependent proxy.
  definition: 'Simultaneous locus coeruleus spike recording and pupillometry in mice found a monotonic,
    graded relationship with enough variability that pupil size predicted only a small fraction of moment-to-moment
    activity, and responses to identical optogenetic stimulation varied strongly between sessions in a
    way that tracked decision bias. Human transcutaneous vagal studies rest on this proxy, so the edge
    inherits its validity.

    '
