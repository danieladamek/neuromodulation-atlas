  - ultrasound contrast agent
  - microbubble dose
  short: Injected gas-filled bubbles that oscillate under ultrasound; the active agent in barrier opening,
    and a dose variable in its own right.
  definition: 'Where gas bodies are present the wave drives bubble oscillation instead of being absorbed,
    so the coupling target becomes the vessel wall. Sonicating rabbit brains with a contrast agent injected
    before each exposure opened the blood–brain barrier at the targeted locations, with the lowest powers
    opening it without damaging neurons. Microbubble dose is a separate parameter from the acoustic one:
    clinical imaging doses produced no significant inflammatory pathway change in rats, whereas high doses
    produced oedema, neuronal degeneration and microhaemorrhage.

    '
