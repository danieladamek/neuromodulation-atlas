- id: spinal-cord-stimulation
  term: Spinal cord stimulation (SCS)
  kind: methods
  variants:
  - SCS
  - spinal cord stimulation
  - epidural spinal stimulation
  short: Pulsed stimulation in the epidural space over the spinal cord; standard care for chronic pain,
    with dorsal-root afferents as the first element recruited.
  definition: 'A hybrid finite-element and biophysical model of lumbosacral epidural stimulation predicted
    that large myelinated dorsal-root afferents are recruited first, with motor pools engaged trans-synaptically,
    and its predictions about intensity and electrode position were confirmed in rats. Its safety bound
    is inherited from the charge-density rule, and an expert taxonomy proposes classifying implantable
    pain therapies by target plus waveform and dose while noting that effective dose is often omitted.

    '
