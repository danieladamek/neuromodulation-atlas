- id: train
  term: Train
  kind: notation
  variants:
  - pulse train
  - trains
  - train duration
  - inter-train interval
  short: A grouped run of pulses; train duration and inter-train interval are dose parameters in their
    own right.
  definition: 'Timing structure above the single pulse is part of dose: the reference definition includes
    the timing of pulses, trains and sessions. Parametric vagal work varied amplitude, frequency, train
    duration, inter-train interval and pulse width independently and found half-second trains sufficient
    to drive phasic locus coeruleus firing from 0.1 mA upward.

    '
