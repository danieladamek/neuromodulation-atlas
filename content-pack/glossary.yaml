- id: uniform-field
  term: Uniform field
  kind: methods
  variants:
  - uniform electric field
  - uniform DC field
  - spatially uniform field
  short: A field whose magnitude and direction are effectively constant across a single neuron, as transcranial
    methods produce.
  definition: 'For transcranial methods the field across any one neuron is close to uniform, so the relevant
    measurement is how much membrane polarisation a given field produces rather than where the gradient
    is steepest. In rat hippocampal slices, uniform DC fields below 40 mV/mm applied along the somato-dendritic
    axis polarised CA1 pyramidal somata linearly at about 0.12 mV per mV/mm, with polarisation largest
    at dendritic tips and time constants of roughly 15–70 ms. In a uniform field a straight fibre has
    no activating function, so terminals and bends dominate the cable-level prediction.

    '
  see:
  - compartment-specific-polarisation
  - coupling-constant
  - activating-function
