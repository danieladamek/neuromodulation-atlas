  term: SimNIBS
  kind: methods
  variants:
  - SimNIBS pipeline
  short: An open pipeline for simulating transcranial magnetic and electric stimulation fields from individual
    MRI.
  definition: 'SimNIBS was introduced alongside a statement of three barriers to routine field modelling
    for TMS: model uncertainty, linking the calculated field to physiology, and usability. Its later finite-element
    implementation was validated against analytical solutions, and its authors concluded that accurate
    tissue geometry and numerical accuracy mattered most for reliable results.

    '
