  - DREADD
  - DREADDs
  - designer receptor
  short: Expressing an engineered receptor activated only by a designed ligand; slower than optogenetics
    by about three orders of magnitude.
  definition: 'Directed evolution of muscarinic receptors produced designer receptors activated by the
    supposedly inert compound clozapine-N-oxide and not by acetylcholine, and a Gi-coupled member expressed
    in hippocampal neurons hyperpolarised them and silenced firing. Specificity rested on the ligand being
    pharmacologically inert, which later work overturned. Effects begin 15–30 minutes after systemic ligand
    and last about 6–10 hours.

