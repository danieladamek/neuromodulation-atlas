  kind: science
  variants:
  - STN
  - subthalamic nucleus
  - dorsal STN
  short: A basal ganglia nucleus and the main deep brain stimulation target in Parkinson's disease.
  definition: 'Stimulation evokes a large, focal resonant response within the nucleus, largest in the
    dorsal region that is the clinically preferred target and present under general anaesthesia. Its beta-band
    local field potentials serve as the control variable for adaptive stimulation, and connectivity of
    the stimulation volume to supplementary motor area, with anticorrelation to M1, predicted motor improvement
    in 51 patients.

