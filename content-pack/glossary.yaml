- id: preparation
  term: Preparation
  kind: methods
  variants:
  - in vitro
  - ex vivo
  - in vivo
  - heterologous expression
  - brain slice
  short: The biological system an experiment was run in — culture, slice, anaesthetised animal, awake
    animal, person — which travels with every claim.
  definition: 'The volume''s cellular vocabulary comes from four preparations: in vivo rabbit hippocampus,
    a simulation fitted to visual development, a review-level abstraction, and rat cortical culture, none
    of them an intact awake human and none with a non-invasive drive. Each acoustic transduction account
    likewise has its strongest evidence in a different preparation. Because preparation translation bends
    results in ways no single study measures, species and preparation are required on every mechanism
    edge.

    '
