- id: neuromodulation
  term: Neuromodulation
  kind: science
  variants:
  - neuromodulatory intervention
  short: 'Used in three senses: a delivered drive, the physiological change it causes, and the endogenous
    transmitter class. This volume means the first two.'
  definition: 'The word carries three referents that the literatures do not keep apart. The first is a
    delivered drive — a current, a field, a pressure wave or an agent applied to a nervous system from
    outside. The second is the physiological change that follows from that drive, which clinical definitions
    often merge with the act itself. The third, used in cellular and circuit neuroscience, is the class
    of endogenous substances that reconfigure neurons and circuits. This volume uses "neuromodulation"
    for any exogenous drive that alters nerve activity and the chain of changes it sets off, and reserves
    the cellular sense for "neuromodulator".

    '
  see:
  - neuromodulator
  - neurostimulation
  - drive
  sources:
  - 10.1016/j.neurom.2021.10.010
  - 10.1016/j.neuron.2012.09.010
- id: neuromodulator
  term: Neuromodulator
  kind: science
  variants:
  - neuromodulators
  - neuromodulator system
  - neuromodulator systems
  - neuromodulatory substance
  short: An endogenous substance that changes neurons' intrinsic firing properties and effective synaptic
    strengths, and so reconfigures a circuit.
  definition: 'In the cellular sense of the word, a neuromodulator is a substance a nervous system releases
    on itself: as a local hormone, as a cotransmitter from a projection neuron, or through the circulation.
    It changes intrinsic excitability and effective synaptic weights rather than acting as a fast point-to-point
    transmitter, so the anatomical wiring diagram is only a scaffold and the modulatory state decides
    which functional circuit is running. Acetylcholine, dopamine, noradrenaline and serotonin are the
    systems this volume treats as both targets of a drive and gates on its effect.

    '
  see:
  - neuromodulation
  - ascending-neuromodulator-systems
  - gating
  sources:
  - 10.1016/j.neuron.2012.09.010
- id: neurostimulation
  term: Neurostimulation
  kind: science
  variants:
  - stimulation therapy
  short: The delivered electrical or magnetic act, as distinct from the modulation it aims to produce;
    the two words are used interchangeably in the source documents.
  definition: 'Consensus documents use "neurostimulation" and "neuromodulation" side by side, sometimes
    in the same sentence: the 2022 glossary of neurostimulation terminology in fact defines neuromodulation.
    This volume adopts a usage the sources imply but do not apply consistently: stimulation names the
    act of delivering an electrical or magnetic drive, and modulation names the aim or the result. The
    distinction is kept because a graph needs the act and its result as separate nodes.

    '
  see:
  - neuromodulation
  - drive
  sources:
  - 10.1016/j.neurom.2021.10.010
  - 10.1016/j.neurom.2023.10.004
- id: drive
  term: Drive
  kind: science
  variants:
  - delivered drive
  - drive class
  short: 'The first link of the volume''s chain: what is delivered to the organism, whether device current,
    field, pressure, light or molecule.'
  definition: 'A drive is what an operator delivers — the stimulator output, the transducer excitation,
    the administered drug with its route and schedule. It is defined by its device-side or prescription-side
    parameters, not by what reaches the tissue, which is the coupling step. Under this volume''s usage
    devices and drugs are peers, because both are exogenous drives that alter nerve activity.

    '
  see:
  - coupling
  - nominal-stimulus
  - dose
  - drive-to-outcome-chain
  sources:
  - 10.1016/j.brs.2011.10.001
- id: drive-to-outcome-chain
  term: Drive → outcome chain
  kind: science
  variants:
  - the chain
  - seven-step chain
  - drive to outcome chain
  short: 'The volume''s organising sequence: drive → coupling → cellular → subcellular/molecular → circuit
    → system → outcome.'
  definition: 'Every modality in this volume, device or drug, is written as one chain of seven links:
    the drive delivered, the coupling event by which it first changes tissue, the cellular response, the
    subcellular and molecular signalling that follows, the circuit effect, the body-system effect, and
    the measured outcome. No cited paper states the chain in this form; it is assembled from a brain-stimulation
    chain running from induced field through local and network effects to behaviour, and a drug-development
    chain running from exposure at the target site through binding to pharmacological activity. Each link
    is a place where a separate measurement or model is needed, not a step deducible from the one below
    it.

    '
  see:
  - levels-of-organisation
  - coupling
  - three-pillars
  sources:
  - 10.1162/jocn_a_01591
  - 10.1016/j.drudis.2011.12.020
- id: levels-of-organisation
  term: Levels of organisation
  kind: science
  variants:
  - levels of organization
  - level of organisation
  - levels scheme
  short: A commitment that an explanation must link physical scales rather than stay at one; each link
    names a scale and a kind of entity.
  definition: 'Treating the chain as levels is a methodological commitment about what counts as an explanation.
    It comes from the scheme running from molecules to systems in which an account has to join levels
    rather than remain within one. The commitment has a consequence the volume leans on repeatedly: a
    level cannot be read off the one below it, so a description of which cells a drive reaches does not
    fix its circuit effect.

    '
  see:
  - drive-to-outcome-chain
  sources:
  - 10.1126/science.3055294
- id: coupling
  term: Coupling
  kind: science
  variants:
  - coupling step
  - coupling mechanism
  - coupling event
  short: The physical or chemical event by which a delivered drive first changes excitable tissue — the
    join between drive and cellular response.
  definition: 'Coupling is the second link of the chain: membrane polarisation by an applied field, a
    pressure wave acting on a channel or bilayer, absorption of a photon by an enzyme, heat, or a ligand
    occupying a receptor. It is the level at which the modalities differ most in physics, and the level
    most often left inferred, because the transducing cell and molecule are frequently unknown. The volume
    treats transducers as nodes and rival transducers as rival edges between the same two nodes.

    '
  see:
  - transducer
  - activating-function
  - effective-stimulus
- id: nominal-stimulus
  term: Nominal stimulus
  kind: science
  variants:
  - nominal dose
  - nominal stimulus parameters
  short: 'What the experimenter set: device parameters, or administered amount and route. Distinguished
    from what actually acted on tissue.'
  definition: 'The nominal stimulus is the operator''s specification — 2 mA at the scalp, 120% of motor
    threshold, 0.5 mg/kg intravenously. Studies usually report it and infer the rest. The volume''s recurring
    warning is that the acting cause is often not the nominal one: the ligand that drives a chemogenetic
    experiment is a metabolite of the compound injected, and part of the human ultrasound literature is
    explained by an auditory pathway rather than a cortical focus.

    '
  see:
  - effective-stimulus
  - dose
  - active-species
  sources:
  - 10.1162/jocn_a_01591
  - 10.1126/science.aan2475
- id: effective-stimulus
  term: Effective stimulus
  kind: science
  variants:
  - effective dose
  - effective stimulation dose
  short: 'What actually acted on the tissue: the field at the neuron, the pressure at the transducing
    cell, the drug concentration at the receptor.'
  definition: 'The effective stimulus is the quantity the biology sees, which may differ from the nominal
    one in magnitude and, for drugs, in chemical identity. It also includes co-stimulated sensory or peripheral
    input that a confound analysis would flag. Implantable-therapy consensus notes that published studies
    often omit the effective stimulation dose, which prevents replication. In this volume nominal and
    effective values are separate properties, never one field with a flag.

    '
  see:
  - nominal-stimulus
  - exposure
  - co-stimulation
  sources:
  - 10.1016/j.neurom.2023.10.004
  - 10.1162/jocn_a_01591
- id: dose
  term: Dose
  kind: methods
  variants:
  - dosing
  - doses
  short: 'Used two ways: the device-side parameter set an operator controls, and the field or exposure
    delivered in tissue. This volume means the first.'
  definition: 'In the reference definition, dose is every device-side parameter that determines the field
    delivered — electrode or coil configuration, waveform, pulse parameters, and the timing of pulses,
    trains and sessions. On that usage "2 mA" is one entry in a parameter set rather than the dose. Others
    use "dose" for the field in tissue itself, as when TMS intensity is calibrated to a modelled cortical
    E-field; this volume follows the device-side usage and calls the in-tissue quantity exposure. The
    two usages name different nodes, not rival theories, and no drive class reduces to a single intensity.

    '
  see:
  - exposure
  - dose-parameter-set
  - effective-stimulus
  sources:
  - 10.1016/j.brs.2011.10.001
  - 10.1162/imag_a_00106
- id: exposure
  term: Exposure
  kind: methods
  variants:
  - in-tissue exposure
  - target-site exposure
  - brain exposure
  short: 'The in-tissue quantity a drive produces: field at the neuron, in situ acoustic value, or concentration
    at the receptor.'
  definition: 'Exposure is the consequence of a dose rather than part of it. For fields it is the E-field
    in tissue, modelled or measured intracranially; for ultrasound it is the in situ estimate as opposed
    to free-field output; for drugs it is summarised as plasma quantities such as AUC and maximum concentration,
    though what matters at the receptor is the brain extracellular fluid concentration. Administered amount,
    plasma exposure and target-site exposure are three separate properties.

    '
  see:
  - dose
  - in-situ-exposure
  - auc
  - brain-extracellular-fluid
  sources:
  - 10.1016/j.brs.2011.10.001
  - 10.1002/cpt.2545
- id: dose-parameter-set
  term: Dose parameter set
  kind: methods
  variants:
  - parameter set
  - parameter sets
  short: The named list of parameters, each with unit and provenance, that constitutes a dose for one
    drive class; a missing value is recorded as missing.
  definition: 'Because dose is not an intensity, the volume stores it as a parameter set per drive class:
    configuration, waveform and timing for electromagnetic drives; drive settings, pulse timing and envelope
    for acoustic drives; wavelength, irradiance and fluence for optical drives; amount, route and schedule
    for drugs. Each parameter carries its unit and its provenance, and a "not reported" null is kept distinct
    from zero.

    '
  see:
  - dose
  - reporting-checklist
  sources:
  - 10.7554/eLife.100827
  - 10.1038/s41596-025-01259-0
- id: three-pillars
  term: Three pillars
  kind: methods
  variants:
  - three pillars of survival
  - pillars framework
  short: A drug programme must show exposure at the target site, target binding, and expression of pharmacological
    activity — separately.
  definition: 'An analysis of 44 Phase II programmes found that lack of efficacy was the main cause of
    failure, yet in 43% of cases it was unclear whether the mechanism had been tested at all. The authors
    proposed three things a programme must demonstrate in turn: drug exposure at the site of action, binding
    to the intended target, and expression of pharmacological activity. In this volume''s terms the administered
    amount is the drive, exposure and binding are coupling, and pharmacological activity is the first
    cellular or molecular readout.

    '
  see:
  - target-engagement
  - exposure
  - receptor-occupancy
  sources:
  - 10.1016/j.drudis.2011.12.020
- id: target-engagement
  term: Target engagement
  kind: methods
  variants:
  - target verification
  - engagement evidence
  short: Evidence that the drive reached and changed its intended target, shown before any claim that
    it changed an outcome.
  definition: 'An efficacy trial tests the whole chain at once, so a null result cannot say which link
    failed. Target engagement means showing the local and network steps too: brain entry and receptor
    occupancy for a drug, a measured field or evoked response for a device, a validated proxy where nothing
    better exists. The transcutaneous vagal literature is the volume''s clearest case of an outcome literature
    built on unverified engagement, where pooled evidence splits by waveform rather than by intensity.

    '
  see:
  - three-pillars
  - proxy
  - biomarker
  sources:
  - 10.1162/jocn_a_01591
  - 10.1016/j.brs.2025.01.022
- id: activating-function
  term: Activating function
  kind: science
  variants:
  - second spatial derivative of extracellular potential
  - second spatial difference
  short: 'The driving term for extracellular excitation: the second spatial derivative of extracellular
    potential along a fibre.'
  definition: 'An extracellular electrode does not inject current into a neuron; it imposes a potential
    on the surrounding tissue, and the fibre responds to how that potential varies in space. In a compartmental
    cable model the term that drives excitation is the second spatial difference of the extracellular
    potential along the fibre: where it is positive the membrane depolarises, where negative it hyperpolarises.
    The consequence is geometric — a straight fibre in a spatially uniform field has no driving term,
    so polarisation concentrates at terminations, bends and points where the gradient changes. The result
    is a property of a cable model rather than a measurement.

    '
  see:
  - cable-model
  - terminal-polarisation
  - uniform-field
  sources:
  - 10.1109/TBME.1986.325670
- id: cable-model
  term: Cable model
  kind: methods
  variants:
  - compartmental model
  - compartmental axon model
  - cable equation
  short: A neuron represented as a chain of electrical compartments, each with its own membrane equation,
    coupled by axial resistance.
  definition: 'Cable models divide an axon or dendrite into discrete compartments — nodes of Ranvier for
    myelinated fibres, arbitrary segments for unmyelinated ones — and combine each compartment''s time-dependent
    membrane equation with spatial difference equations for the extracellular potential. Both fibre types
    obey the same formal structure, which is why one activating-function analysis covers them. Most coupling-level
    predictions in this volume, including temporal-interference thresholds, are outputs of such models
    rather than measurements.

    '
  see:
  - activating-function
  - node-of-ranvier
  - morphologically-realistic-model
  sources:
  - 10.1109/TBME.1986.325670
- id: morphologically-realistic-model
  term: Morphologically realistic neuron model
  kind: methods
  variants:
  - morphologically realistic model
  - realistic neuron morphology
  - reconstructed neuron model
  - morphologically realistic
  short: A cable model built on a reconstructed three-dimensional dendritic and axonal geometry, used
    to predict which element a field activates first.
  definition: 'Coupling models coupled to head models use reconstructed neuron morphologies rather than
    straight fibres. They predict that for TMS the lowest thresholds lie in intracortical axon terminals
    at the gyral crown and lip, with layer V pyramidal cells the most excitable, and that three-dimensional
    geometry matters in ways one-dimensional analyses missed. All such thresholds are computational, and
    the volume treats them as modelled provenance.

    '
  see:
  - cable-model
  - layer-v-pyramidal-neuron
  - temporal-interference
  sources:
  - 10.1016/j.brs.2019.10.002
  - 10.1088/1741-2552/acab30
- id: node-of-ranvier
  term: Node of Ranvier
  kind: science
  variants:
  - nodes of Ranvier
  short: The periodic unmyelinated gap in a myelinated axon where sodium channels cluster and where a
    cable model places its compartments.
  definition: 'Myelinated axons conduct by saltatory propagation between short gaps in the myelin sheath,
    each densely populated with voltage-gated sodium channels. In compartmental models of extracellular
    stimulation these nodes are the natural compartments, since excitation is driven by the potential
    difference between successive nodes. Their spacing scales with fibre diameter, which is part of why
    large fibres are recruited at lower thresholds.

    '
  see:
  - cable-model
  - myelinated-axon
  - recruitment-order
  sources:
  - 10.1109/TBME.1986.325670
- id: myelinated-axon
  term: Myelinated axon
  kind: science
  variants:
  - myelinated fibre
  - myelinated fibres
  - myelinated axons
  short: An axon insulated by myelin; in the stimulation literature the element with the lowest threshold
    to an applied extracellular current.
  definition: 'Compiled current–distance relations for focal stimulation of the mammalian central nervous
    system show that axons generally have lower thresholds than cell bodies near a monopolar electrode,
    that myelinated fibres usually need less cathodal than anodal current, and that orientation relative
    to current flow matters. The consensus target of TMS is likewise axonal: myelinated axon terminals
    of pyramidal cells and interneurons at the gyral crown. Recruitment order is therefore the reverse
    of physiological recruitment, with the largest fibres going first.

    '
  see:
  - current-distance-relation
  - recruitment-order
  - chronaxie
  sources:
  - 10.1016/0006-8993(75)90364-9
  - 10.1016/j.clinph.2022.04.022
- id: current-distance-relation
  term: Current–distance relation
  kind: methods
  variants:
  - current-distance relation
  - current–distance relations
  - current-distance relations
  short: The threshold current needed to excite an element as a function of its distance from the electrode.
  definition: 'Focal stimulation studies express selectivity as a threshold that grows with distance from
    the electrode, compiled separately for myelinated fibres and for somata near monopolar electrodes.
    Strong cathodal currents also block propagation, so only a shell of elements around the electrode
    is effectively excited. Equivalent data for non-monopolar electrode geometries were lacking in the
    source review, which limits how far the relations transfer to modern arrays.

    '
  see:
  - myelinated-axon
  - conduction-block
  sources:
  - 10.1016/0006-8993(75)90364-9
- id: chronaxie
  term: Chronaxie
  kind: science
  variants:
  - chronaxies
  short: The pulse width at which threshold is twice the value reached with an infinitely long pulse;
    used to infer which element is being excited.
  definition: 'Chronaxie summarises how threshold trades against pulse duration, and different neural
    elements have different values. Central myelinated axons give about 50–100 µs, whereas some grey-matter
    stimulation gives 200–700 µs, a discrepancy taken as leaving open what is actually being excited in
    grey matter. Pulse duration therefore selects among elements as well as setting the charge delivered.

    '
  see:
  - pulse-width
  - myelinated-axon
  - charge-per-phase
  sources:
  - 10.1016/0006-8993(75)90364-9
- id: recruitment-order
  term: Recruitment order
  kind: science
  variants:
  - reverse recruitment order
  - order of recruitment
  short: The sequence in which elements are activated as intensity rises; for applied fields it inverts
    the physiological order, large fibres first.
  definition: 'Fibre diameter, orientation and distance set which elements cross threshold first. A hybrid
    finite-element and biophysical model of lumbosacral epidural stimulation predicted that large myelinated
    dorsal-root afferents are recruited before motoneurons or interneurons, with motor pools then engaged
    trans-synaptically, and its predictions about intensity and electrode position were confirmed in rats.
    Because physiological recruitment goes from small to large, electrical recruitment is described as
    reversed.

    '
  see:
  - spinal-cord-stimulation
  - myelinated-axon
  sources:
  - 10.1523/JNEUROSCI.1688-13.2013
- id: cathodal-stimulation
  term: Cathodal stimulation
  kind: methods
  variants:
  - cathodal
  - cathode
  short: Current delivered with the active electrode as cathode; for myelinated fibres usually the lower-threshold
    polarity, and at the scalp the excitability-lowering one.
  definition: 'Polarity is part of the dose. For focal stimulation of myelinated fibres, less cathodal
    than anodal current is typically needed, and strong cathodal current can block propagation rather
    than excite. For transcranial direct current the human after-effect is read as polarity-specific,
    with cathodal stimulation lowering motor cortical excitability, though that reading is disputed and
    reverses after preconditioning.

    '
  see:
  - anodal-stimulation
  - tdcs
  - polarity
  sources:
  - 10.1016/0006-8993(75)90364-9
  - 10.1523/JNEUROSCI.5316-03.2004
- id: anodal-stimulation
  term: Anodal stimulation
  kind: methods
  variants:
  - anodal
  - anode
  short: Current delivered with the active electrode as anode; at the scalp the polarity conventionally
    read as raising motor cortical excitability.
  definition: 'In the standard reading of transcranial direct current stimulation, anodal stimulation
    raises and cathodal lowers motor cortical excitability. Slice work supports a weaker claim than induction:
    direct current applied during plasticity induction changed the size of the resulting change depending
    on polarity and dendritic compartment, and required concurrent synaptic activity and NMDA receptors.
    In mouse motor cortex, anodal current paired with low-frequency input produced potentiation that required
    BDNF secretion and TrkB activation.

    '
  see:
  - cathodal-stimulation
  - tdcs
  - bdnf
  sources:
  - 10.1016/j.brs.2016.10.001
  - 10.1016/j.neuron.2010.03.035
- id: polarity
  term: Polarity
  kind: notation
  variants:
  - polarity-specific
  - stimulus polarity
  short: Which electrode is anode and which cathode, or the sign of a monophasic phase; a dose parameter
    that can set the sign of the effect.
  definition: 'Polarity enters the volume twice: as a determinant of which neural element is excited at
    an electrode, and as the conventional explanation for the direction of a transcranial direct current
    after-effect. Because the two ends of a neuron polarise with opposite sign, the same field that depolarises
    a soma hyperpolarises the distal dendrite, so polarity alone does not fix the sign of a cellular effect.

    '
  see:
  - anodal-stimulation
  - cathodal-stimulation
  - compartment-specific-polarisation
- id: charge-per-phase
  term: Charge per phase
  kind: science
  variants:
  - charge injected per phase
  - µC/phase
  - uC/phase
  short: The charge delivered in one phase of a stimulus pulse; with charge density, one of the two quantities
    classical safety limits are written in.
  definition: 'Charge per phase is the time integral of current over a single pulse phase, so it scales
    with both amplitude and pulse width. Pulsing platinum surface electrodes on cat cerebral cortex for
    seven hours showed that neural injury depended on charge density and charge per phase acting together,
    across roughly 10–800 µC/cm² and 0.05–5 µC/phase, and that neither variable alone predicted damage.
    It is a property of the electrode and waveform, not of the field at the target.

    '
  see:
  - charge-density
  - shannon-equation
  - electrode-tissue-interface
  sources:
  - 10.1109/10.102812
- id: charge-density
  term: Charge density
  kind: science
  variants:
  - charge densities
  - charge per unit area
  - µC/cm²
  - uC/cm2
  short: Charge delivered per unit electrode area per phase; with charge per phase, the quantity classical
    implant safety limits are written in.
  definition: 'For implanted electrodes the dose that matters for safety is not the field in the target
    but the charge passed through the electrode–tissue interface, normalised by geometric electrode area.
    Damage experiments in cat cortex showed charge density and charge per phase to be co-factors in neural
    injury, and a later model fitted a log-linear boundary between safe and damaging combinations of the
    two. Whether that boundary generalises is disputed, because it omits frequency, duty cycle, current
    density and electrode size, and microelectrodes tolerate higher charge densities without damage.

    '
  see:
  - charge-per-phase
  - shannon-equation
  - tissue-damage-threshold
  sources:
  - 10.1109/10.102812
  - 10.1109/10.126616
  - 10.1088/1741-2560/13/2/021001
- id: shannon-equation
  term: Shannon equation
  kind: methods
  variants:
  - Shannon line
  - Shannon model
  - Shannon boundary
  short: A log-linear boundary between safe and damaging combinations of charge per phase and charge density,
    with a parameter k; widely used as a macroelectrode design rule.
  definition: 'The equation fitted a single model to earlier tissue-damage data, including the cat-cortex
    experiments, and became the field''s design rule for macroelectrode stimulation. One position treats
    its boundary as a general limit; the other treats it as an empirical fit of limited scope, since its
    best-known source dataset came from cat cortex, platinum electrodes and a single pulse regime. Damage
    data varying frequency, duty cycle and electrode size independently, in the electrode classes now
    used, would settle it.

    '
  see:
  - charge-density
  - tissue-damage-threshold
  - hypothesis-group
  sources:
  - 10.1109/10.126616
  - 10.1088/1741-2560/13/2/021001
- id: tissue-damage-threshold
  term: Tissue damage threshold
  kind: science
  variants:
  - damage threshold
  - damage thresholds
  short: The exposure boundary above which stimulation injures tissue; for electrodes defined jointly
    by charge and charge density, and contested in scope.
  definition: 'Damage thresholds are the empirical basis of stimulation safety rules. The review that
    challenges the classical rule notes that it leaves out frequency, duty cycle, current density and
    electrode size, and that microelectrodes deliver higher charge densities without damage, so revised
    thresholds and new data are needed for current bioelectronic devices. In the graph, a safety quantity
    names the rule it is judged against and that rule''s scope.

    '
  see:
  - charge-density
  - shannon-equation
  sources:
  - 10.1088/1741-2560/13/2/021001
- id: electrode-tissue-interface
  term: Electrode–tissue interface
  kind: science
  variants:
  - electrode-tissue interface
  - electrode–electrolyte interface
  short: The boundary where current crosses from metal to tissue, by Faradaic or non-Faradaic mechanisms;
    it sets charge-balance and material limits.
  definition: 'At the electrode itself the constraint is not the field but charge transfer across the
    interface, which may be capacitive (non-Faradaic) or involve electrochemical reactions (Faradaic).
    Which mechanism dominates sets the limits on charge balance and on electrode material, and it is why
    implant dose is written in charge rather than field units.

    '
  see:
  - faradaic-charge-transfer
  - charge-balanced-waveform
  - charge-density
  sources:
  - 10.1016/j.jneumeth.2004.10.020
- id: faradaic-charge-transfer
  term: Faradaic charge transfer
  kind: science
  variants:
  - Faradaic
  - non-Faradaic
  - non-Faradaic charge transfer
  short: Charge crossing the electrode interface by electrochemical reaction rather than by capacitive
    charging of the double layer.
  definition: 'Faradaic transfer involves electron exchange with chemical species at the electrode surface
    and can generate irreversible reaction products; non-Faradaic transfer charges and discharges the
    electrical double layer without net reaction. The distinction bounds what waveforms and materials
    are safe, and is the reason implanted stimulation uses charge-balanced pulses.

    '
  see:
  - electrode-tissue-interface
  - charge-balanced-waveform
  sources:
  - 10.1016/j.jneumeth.2004.10.020
- id: charge-balanced-waveform
  term: Charge-balanced waveform
  kind: methods
  variants:
  - charge balance
  - charge-balanced pulse
  - charge-balanced pulses
  - biphasic pulse
  short: A stimulus whose phases deliver equal and opposite charge, so no net charge accumulates at the
    electrode.
  definition: 'Charge balance is the standard precaution against irreversible electrochemistry at an implanted
    electrode. The cat-cortex damage experiments used charge-balanced pulse pairs of 400 µs per phase
    at 50 Hz, and an optimised charge-balanced 10 kHz waveform was modelled to produce conduction block
    without the onset burst that conventional kilohertz block causes.

    '
  see:
  - electrode-tissue-interface
  - conduction-block
  - charge-per-phase
  sources:
  - 10.1109/10.102812
  - 10.1371/journal.pcbi.1007766
- id: conduction-block
  term: Conduction block
  kind: science
  variants:
  - kilohertz block
  - kHz block
  - nerve block
  short: Suppression of action-potential propagation by an applied current, rather than excitation; achievable
    with strong cathodal or kilohertz-frequency drive.
  definition: 'Strong cathodal currents block propagation near an electrode, so only a shell of elements
    is effectively excited. Modelling of an optimised kilohertz waveform showed that sodium channels can
    be driven into inactivation through the closed-state path, producing block without the onset burst
    conventional kilohertz block causes; that result is computational. Block also appears as a predicted
    side effect of temporal interference in superficial tissue at intensities that would activate deep
    targets.

    '
