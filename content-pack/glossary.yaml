- id: functional-connectivity
  term: Functional connectivity
  kind: statistics
  variants:
  - resting-state functional connectivity
  - anticorrelation
  - resting-state fMRI
  short: Statistical dependence between regional activity time courses, usually from resting-state fMRI;
    the basis of connectivity-based targeting.
  definition: 'Functional connectivity is a correlation, and its use as a targeting variable inherits
    the usual confounds — in the large replication study much of the site-to-outcome association tracked
    respiration-driven artefact in the global signal. Structural and functional connectivity were independent
    predictors of motor improvement in a subthalamic cohort, so they are separate properties rather than
    two views of one thing.

    '
