  term: Target deconvolution
  kind: methods
  variants:
  - systematic target deconvolution
  - target identification screen
  short: Screening a compound against large panels of proteins to identify what it binds; for one ketamine
    metabolite it found nothing.
  definition: 'Target deconvolution is the assay that turns a behavioural effect into a molecular claim,
    and its negative result is informative here: screens across binding, functional and large-scale assays
    at thousands of human proteins found no direct interaction for (2R,6R)-hydroxynorketamine with any
    known or proposed ketamine target. The dispute over the metabolite therefore turns partly on whether
    the assay was binding or pathway blockade.

