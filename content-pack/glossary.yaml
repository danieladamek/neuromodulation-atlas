- id: serotonin
  term: Serotonin
  kind: science
  variants:
  - 5-HT
  - serotonergic
  short: A neuromodulator and the target of the antidepressant class whose deficit premise an umbrella
    review found unsupported.
  definition: 'Serotonin is one of the four plasticity-gating modulators, the ligand of the receptor through
    which psychedelics act, and the transmitter whose deficit was the premise of a drug class. It is also
    the volume''s neatest illustration that compartment matters: being membrane-impermeant, serotonin
    does not engage the intracellular 5-HT2A mechanism despite being an agonist at that receptor.

    '
