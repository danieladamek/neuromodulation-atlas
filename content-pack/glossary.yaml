- id: e-field
  term: Electric field (E-field)
  kind: science
  variants:
  - E-field
  - electric field
  - induced electric field
  - E field
  short: The field injected (tES) or induced (TMS) in tissue; the quantity through which both are assumed
    to act, and the object of dosimetry.
  definition: 'Transcranial dose definitions start from the premise that biological effects are mediated
    by the electric field injected into the body by electrical stimulation or induced in it by a magnetic
    pulse. The field is therefore the bridge between device settings and physiology, and it is what finite-element
    pipelines estimate person by person from MRI. Reporting an E-field value without naming its outcome
    measure and pipeline stores a number that cannot be compared with any other.

    '
