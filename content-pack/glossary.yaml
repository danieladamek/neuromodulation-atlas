  term: NMDA receptor
  kind: science
  variants:
  - NMDAR
  - NMDA receptors
  - N-methyl-D-aspartate receptor
  short: A glutamate receptor whose activation gates classical plasticity; also the receptor whose blockade
    abolishes several human stimulation after-effects.
  definition: 'NMDA receptor dependence is how a molecular identity is assigned to a human after-effect:
    the antagonist memantine abolished both the suppression after continuous theta burst and the facilitation
    after intermittent theta burst in six participants, and direct current changed plasticity in slice
    only with concurrent synaptic activity and intact NMDA receptors. The blockade logic has a structural
    limit, since it shows the effect needs the receptor somewhere in the measured pathway, not where.
    In mice, NMDA antagonist pretreatment also abolished the antidepressant-like effects of four structurally
    unrelated compounds.

    '
