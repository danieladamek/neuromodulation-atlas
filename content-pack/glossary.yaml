- id: auditory-confound
  term: Auditory confound
  kind: science
  variants:
  - auditory pathway activation
  - acoustic confound
  short: Activation produced through the ear by a stimulus aimed elsewhere; in ultrasound it competes
    with all four proposed transduction accounts.
  definition: 'In guinea pigs, widespread cortical and subcortical activation by transcranial ultrasound
    disappeared when the auditory nerves were cut or cochlear fluid removed; in mice the evoked cortical
    pattern matched auditory pathway activation and fell with deafening. The rebuttal locates the culprit
    in the pulse envelope, since smoothing it removed the auditory brainstem response while leaving the
    motor response intact, and deaf mice responded like hearing ones. In humans the confound reasserts
    itself: across four experiments the reported motor inhibition tracked auditory stimulation.

    '
