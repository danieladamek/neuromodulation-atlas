  - amyloid beta
  - Aβ
  - Abeta
  - amyloid burden
  - plaque load
  short: The peptide whose aggregation marks Alzheimer's disease; the endpoint in both the 40 Hz claim
    and the barrier-opening trial.
  definition: 'Two chains in this volume end here, and both separate engineering from therapy. Optogenetic
    and flicker 40 Hz stimulation lowered amyloid species in model mice, a result contested by recordings
    finding no plaque change; and focused-ultrasound barrier opening in five patients was safe and repeatable
    while exploratory amyloid PET showed no group-level change.

