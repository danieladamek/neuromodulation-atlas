  - 10.1002/ana.25234
- id: informational-lesion
  term: Informational lesion
  kind: science
  variants:
  - information lesion
  short: The account in which high-frequency stimulation forces output spiking into a regular, variance-free
    pattern, so the neuron fires but carries no information.
  definition: 'Modelling intrinsically active neurons under extracellular stimulation across frequencies
    produced this account, which reconciles two facts neither simple inhibition nor simple excitation
    explains: that benefit requires high frequency, and that the clinical picture resembles a lesion while
    axons are being driven. The account is computational, and it places the therapeutic effect in removal
    of pathological patterning rather than a change of mean rate. Settling it against the excitation account
    needs efferent firing pattern and downstream decoding measured together at effective and ineffective
    frequencies.

    '
  see:
  - deep-brain-stimulation
  - antidromic-activation
  - evoked-resonant-activity
