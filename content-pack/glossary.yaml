    data sharing and publication of nulls; the RATES Delphi study produced 66 items with a 26-item essential
    subset; and a further process produced essential items for concurrent stimulation with fMRI. What
    stays unreported in practice is what checklists cannot force: in-session blinding checks, expectancy,
