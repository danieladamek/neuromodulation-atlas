  short: A graded statement of how certain an effect is; GRADE rates certainty and recommendation strength
    separately, while neuromodulation guidelines use letter scales.
  definition: 'GRADE was introduced because guideline developers graded evidence inconsistently, and it
    rates the certainty of evidence and the strength of the resulting recommendation separately. Neuromodulation
    mostly does not use it: the European magnetic stimulation guideline grades each indication against
    sham on a letter scale, where level A means definite efficacy. A level A is a statement about one
    edge — drive to outcome, in one indication, against sham, protocol fixed — and licenses no mechanistic
    story; approval and graded certainty are also different thresholds.

