- id: vagus-nerve-stimulation
  term: Vagus nerve stimulation (VNS)
  kind: methods
  variants:
  - VNS
  - vagus nerve stimulation
  - cervical VNS
  - vagal stimulation
  short: Electrical stimulation of the vagus nerve, usually by an implanted cuff; the volume's best-characterised
    parametric drive.
  definition: 'Rat recordings across a grid of amplitude, frequency, train duration, inter-train interval
    and pulse width showed half-second trains driving phasic locus coeruleus firing from 0.1 mA, with
    rate rising with current and pulse width, and pulse-locked trigeminal activity appearing only above
    1.2 mA — so the same cuff at two amplitudes is two different drives, one of which co-recruits trigeminal
    afferents. The nerve is a bundle of molecularly distinct afferent classes, so a cuff engages a mixture
    of labelled lines rather than a channel, and the drive carries no sign of its own.

