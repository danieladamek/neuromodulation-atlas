- id: five-ht2a-receptor
  term: 5-HT2A receptor
  kind: science
  variants:
  - 5-HT2A
  - serotonin 2A receptor
  - postsynaptic 5-HT2A
  - presynaptic 5-HT2A
  short: The serotonin receptor subtype through which classic psychedelics act; whether it is necessary
    for their plasticity effects is disputed.
  definition: 'The standard chain runs from agonism at receptors on layer V pyramidal apical dendrites
    to reduced oscillatory power in default-mode network regions. Three positions complicate it: plasticity
    effects attributed to intracellular rather than surface receptors; synaptic strengthening in granular
    retrosplenial cortex, whose neurons lack postsynaptic 5-HT2A, requiring presynaptic receptors on anterior
    thalamic axons; and a report that psychedelic plasticity required TrkB rather than 5-HT2A while head-twitch
    required 5-HT2A. A current review separates the necessity question for the hallucinogenic effect from
    that for plasticity and treats the second as open.

    '
