- id: clinical-response
  term: Response and remission
  kind: statistics
  variants:
  - clinical response
  - remission
  - responder rate
  - ACR20
  - MADRS
  short: Threshold outcomes on a clinical scale — usually a percentage improvement (response) or falling
    below a severity cut-off (remission).
  definition: 'Which threshold is chosen changes conclusions: one ketamine-versus-seizure-therapy trial
    used self-reported response and met non-inferiority while another used remission and did not. Comparable
    thresholds recur throughout — 71% response and 29% remission at day 1 after a single ketamine infusion,
    response 73.9% against 29.3% with adjunctive D-cycloserine, and a 35.2% against 24.2% responder difference
    on a rheumatoid composite in the pivotal implant trial. An efficacy edge therefore needs indication,
    comparator, endpoint and setting.

    '
