- id: cem43
  term: CEM43
  kind: notation
  variants:
  - cumulative equivalent minutes at 43 °C
  - cumulative equivalent minutes
  - equivalent minutes at 43 °C
  short: Thermal dose expressed as the equivalent exposure time at 43 °C; the one transferable dose unit
    in the volume's thermal literature.
  definition: 'Any time–temperature history can be converted into an equivalent number of minutes at a
    43 °C reference, summing time at each temperature weighted by a factor raised to the temperature difference,
    with different values above and below a break temperature. Its authors presented it as a practical
    standard rather than the only possible one. It is the unit in which the ultrasound safety consensus
    offers thermal-dose criteria by tissue type, alongside temperature-rise and absolute-temperature criteria.

    '
  see:
  - thermal-dose
  - thermal-account
  - hifu
  sources:
