  term: Rival edge
  kind: methods
  variants:
  - rival edges
  - competing explanation edge
  - counter-edge
  short: Two edges between the same nodes representing competing explanations rather than duplicate assertions.
  definition: 'Rival transducers are rival edges between the same two nodes, each with its own preparation
    and discriminating test: a frequency sweep for cavitation against radiation force, temperature against
    duty cycle for thermal against mechanical, a feasibility calculation for magnetogenetics. An edge
    typed only by predicate and endpoints cannot hold this, which is one of the volume''s arguments against
    reusing existing biomedical graph schemas unchanged.

    '
  see:
