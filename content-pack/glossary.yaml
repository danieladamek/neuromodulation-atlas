- id: sonication
  term: Sonication
  kind: methods
  variants:
  - sonications
  - sonication duration
  - sonicating
  short: One episode of ultrasound exposure; its duration is a dose parameter that predicted the direction
    of human effects.
  definition: 'A sonication is the delivery of acoustic energy to a target for a defined period, described
    by pressure, frequency, pulse structure and duration. Across 32 human studies, sonication duration
    predicted whether the outcome was scored as enhancement or suppression (p = 0.04, shorter favouring
    excitation), as did duty cycle, while spatial-peak pulse-average intensity alone did not.

    '
  see:
  - duty-cycle
  - isppa
  - tus
  sources:
  - 10.7554/eLife.100827
- id: duty-cycle
  term: Duty cycle
  kind: notation
  variants:
  - duty cycles
  short: The fraction of time a pulsed stimulus is on; an acoustic dose parameter whose role in setting
    the direction of effect is disputed.
  definition: 'Duty cycle is the ratio of pulse-on to total time, so it separates peak intensity from
    time-averaged intensity. The mechanical account of ultrasound predicts that duty cycle and intensity
    should bias excitation against suppression, and a human meta-analysis found duty cycle predicted direction
    (p = 0.046). In rat thalamus, by contrast, suppression was independent of duty cycle and tracked measured
    temperature. It is also one of the parameters the classical electrode safety rule omits.

    '
  see:
  - sonication
  - thermal-account
  - intramembrane-cavitation
  - shannon-equation
