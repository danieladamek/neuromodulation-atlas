- id: receptor-compartment
  term: Receptor compartment
  kind: science
  variants:
  - intracellular receptor
  - cell-surface receptor
  - receptor location
  short: Where in or on the cell a receptor is engaged; an attribute of the coupling node, because the
    same agonist acts differently inside and at the surface.
  definition: 'In rodent and in vitro work, the cortical plasticity-promoting effects of psychedelics
    were attributed to intracellular rather than cell-surface 5-HT2A receptors, which accounts for why
    membrane-impermeant serotonin does not engage the same mechanism despite being an agonist at that
    receptor. Compartment also matters at a coarser scale, as in the weighting of receptors on apical
    dendrites of layer V pyramidal cells, and at the synapse, where presynaptic and postsynaptic receptor
    pools give different answers about necessity.

    '
  see:
