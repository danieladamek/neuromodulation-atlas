  - AMPA receptors
  short: The glutamate receptor carrying most fast excitatory transmission; its activation was required
    for a ketamine metabolite's antidepressant-like effect.
  definition: 'AMPA receptor activation is the requirement that distinguishes the metabolite account of
    ketamine''s action from the NMDA antagonism account: in mice, (2R,6R)-hydroxynorketamine acted without
    NMDA receptor inhibition but depended on AMPA receptor activation. AMPA-receptor trafficking is also
    the currency of homeostatic synaptic scaling.

