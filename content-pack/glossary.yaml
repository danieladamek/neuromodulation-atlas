  - 10.1016/j.brs.2014.02.004
- id: preconditioning
  term: Preconditioning
  kind: methods
  variants:
  - preconditioned
  - priming stimulation
  short: Applying one stimulation protocol before another so that the prior state sets the sign of the
    second protocol's effect.
  definition: 'Applying direct current before 1 Hz repetitive TMS reversed the outcome: after anodal current
    had raised excitability the repetitive train pushed it below baseline, and after cathodal current
    had lowered it the same train raised it. The reversals were read as a homeostatic, BCM-like mechanism
    stabilising corticospinal excitability. It is the strongest human demonstration that prior activity,
    not the parameters, sets the sign.

    '
  see:
  - homeostatic-metaplasticity
  - bcm-rule
  - state-dependence
  sources:
  - 10.1523/JNEUROSCI.5316-03.2004
- id: state-dependence
  term: State dependence
  kind: science
  variants:
  - state-dependent
  - brain state dependence
  short: The dependence of a drive's effect on the activation state of the targeted neurons at the moment
    of delivery.
  definition: 'The principle is that the behavioural and perceptual effects of stimulation depend on the
    activation state of the targeted neurons at the time of stimulation, and that setting the state beforehand
    can bias which of two overlapping populations is affected. Read instant by instant, bursts locked
    to the high-excitability phase of the sensorimotor mu rhythm produced potentiation while the same
    protocol at the opposite phase produced no change. The sign of an effect therefore belongs on a state-qualified
    edge.

    '
  see:
  - preconditioning
  - mu-rhythm
  - phase-triggered-stimulation
  - entrainment
  sources:
  - 10.1016/j.tics.2008.09.004
  - 10.1016/j.brs.2017.11.016
- id: phase-triggered-stimulation
  term: Phase-triggered stimulation
  kind: methods
  variants:
  - phase-locked stimulation
  - EEG-triggered TMS
  - real-time EEG-triggered stimulation
  short: Delivering stimulation at a chosen phase of an ongoing rhythm, using millisecond-latency real-time
    EEG.
  definition: 'Triggering identical triple-pulse bursts at the negative peak of the sensorimotor mu rhythm
    produced LTP-like motor evoked potential potentiation, while the same bursts at the positive peak
    produced no change. The effect is readout-dependent and contested: a companion study found no change
    in resting EEG or TMS-EEG measures after phase-triggered bursts and concluded that EEG excitability
    measures do not track corticospinal excitability. Cross-laboratory replication remains thin.

    '
  see:
  - mu-rhythm
  - state-dependence
  - closed-loop-stimulation
  sources:
  - 10.1016/j.brs.2017.11.016
  - 10.1371/journal.pone.0208747
- id: mu-rhythm
  term: Mu rhythm
  kind: science
  variants:
  - sensorimotor mu-rhythm
  - mu-rhythm
  - sensorimotor mu rhythm
  short: The 8–13 Hz sensorimotor oscillation whose phase indexes corticospinal excitability in phase-triggered
    TMS work.
  definition: 'The mu rhythm is the sensorimotor analogue of the occipital alpha rhythm, and its negative
    peak is treated as the high-excitability phase. Its use as a trigger signal is the non-invasive counterpart
    of biomarker-gated deep brain stimulation, and it shares that approach''s central problem: the control
    signal''s validity is itself a claim, since the readouts disagree about whether the triggered effect
    exists.

    '
  see:
  - phase-triggered-stimulation
  - state-dependence
  - biomarker
  sources:
  - 10.1016/j.brs.2017.11.016
- id: motor-evoked-potential
  term: Motor evoked potential (MEP)
  kind: methods
  variants:
  - MEP
  - MEPs
  - motor evoked potentials
  - motor-evoked potential
  short: The muscle response to a single stimulation pulse, recorded by EMG; the workhorse readout of
    human stimulation studies.
  definition: 'The procedural reference defines the standard measures built on it: motor threshold, input–output
    curves and paired-pulse protocols. Its limitation is structural — it is a corticospinal population
    measure separated from any synapse by a spinal segment and a muscle, so an MEP change cannot locate
    a plasticity effect in cortex. Baseline MEP amplitude is also one of the few replicated predictors
    of who responds to a theta-burst protocol.

    '
  see:
  - electromyography
  - motor-threshold
  - ltp-like-plasticity
  sources:
  - 10.1016/j.clinph.2015.02.001
  - 10.1016/j.brs.2020.07.018
- id: i-wave
  term: I-wave
  kind: science
  variants:
  - I-waves
  - late I-wave
  - indirect wave
  - D-wave
  short: Indirect, trans-synaptically generated descending corticospinal volleys, as opposed to the direct
    D-wave; their recruitment depends on current direction.
  definition: 'Human epidural recordings of descending corticospinal volleys give the measured account
    of what a transcranial pulse recruits: D- and I-wave patterns show how intensity and current direction
    selectively engage different excitatory and inhibitory circuits, with large inter-individual variability.
    Which circuit a pulse recruits also predicts responder status for patterned protocols, indexed non-invasively
    by motor evoked potential latency with anterior–posterior current.

    '
  see:
  - theta-burst-stimulation
  sources:
  - 10.1113/jphysiol.2014.274316
  - 10.1093/cercor/bhs147
- id: tms-evoked-potential
  term: TMS-evoked potential (TEP)
  kind: methods
  variants:
  - TEP
  - TEPs
  - TMS-evoked potentials
  short: The EEG response to a TMS pulse; how much of it is transcranial rather than sensory is disputed.
  definition: 'A realistic sham mimicking the sound and scalp sensation of TMS evoked EEG responses closely
    resembling those to real TMS at early and late latencies, despite noise masking and foam padding.
    With an optimised sham, noise masking, a second coil stacked on the real one and electrical scalp
    stimulation, subtraction left early components and beta-band responses that occurred only with real
    stimulation. The consensus lists peripheral sensory contamination as an open problem, and the dispute
    turns on whether a sham can match real TMS closely enough for subtraction to be valid.

    '
  see:
  - tms-eeg
  - sham
  - co-stimulation
  - hypothesis-group
  sources:
  - 10.1016/j.neuroimage.2018.10.052
  - 10.1016/j.neuroimage.2021.118708
  - 10.1016/j.brs.2023.02.009
- id: tms-eeg
  term: TMS-EEG
  kind: methods
  variants:
  - TMS–EEG
  - concurrent TMS-EEG
  short: Recording EEG during TMS to read cortical responses directly; governed by consensus recommendations
    on recording, artefact correction and interpretation.
  definition: 'TMS-EEG is the main non-invasive route to a cortical rather than corticospinal readout,
    and the 2023 consensus covers recording, artefact correction and interpretation while naming peripheral
    sensory contamination as unresolved. Its readouts can disagree with muscle-level ones: phase-triggered
    bursts that potentiated motor evoked potentials in one study produced no detectable change in resting
    EEG or TMS-EEG measures in another.

    '
  see:
  - tms-evoked-potential
