  term: Homeostatic synaptic scaling
  kind: science
  variants:
  - synaptic scaling
  - multiplicative scaling
  - homeostatic scaling
  short: Uniform multiplicative adjustment of a neuron's synaptic strengths to stabilise its firing rate,
    preserving relative weights.
  definition: 'Manipulating overall activity in cultured rat neocortical neurons, blocking activity increased
    quantal amplitude across all synapses, while blocking GABA-A receptors first raised firing and then
    let it return toward baseline as amplitudes shrank. Because the adjustment was multiplicative, relative
    weights were preserved while firing rate was stabilised. It is the cellular reference for any claim
    that a stimulation effect is bounded or reversed by compensation, and it is invoked for fast-acting
    antidepressants as a rival to Hebbian accounts.

