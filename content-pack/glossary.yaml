- id: acetylcholine
  term: Acetylcholine
  kind: science
  variants:
  - cholinergic
  - cholinergic signalling
  short: The transmitter of the efferent anti-inflammatory limb and one of the four plasticity-gating
    modulators.
  definition: 'Acetylcholine appears in both senses of neuromodulation in a single reported mechanism:
    applied vagal stimulation suppressed hepatic and serum TNF in endotoxaemic rats, while acetylcholine
    itself suppressed TNF release from stimulated human macrophages in vitro. It is also one of the four
    modulators that gate spike-timing-dependent plasticity, and its basal-forebrain source is required
    for device-driven map expansion.

    '
