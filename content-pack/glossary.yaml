- id: knockout
  term: Knockout
  kind: methods
  variants:
  - knockout mice
  - conditional knockout
  - CRISPR knockout
  - loss of function
  short: Genetic deletion of a gene to test necessity; the strongest available evidence for assigning
    a transducer, and sensitive to where the deletion is made.
  definition: 'Conditional deletion of Piezo1 in mouse motor cortex sharply reduced ultrasound-evoked
    responses, and CRISPR-engineered deletions located psychedelic-induced synaptic strengthening at presynaptic
    rather than postsynaptic receptors. Where the gene is deleted is part of the claim: neuronal but not
    astrocytic deletion cut one acoustic response, and a receptor-expression map is not a map of where
    a drug acts.

    '
