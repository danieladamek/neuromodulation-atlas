  - spatially resolved transcriptomics
  short: Genome-wide expression measured with anatomical position retained; the modern high-resolution
    version of an activity-marker readout.
  definition: 'In mice after two low-intensity repetitive magnetic protocols, spatial transcriptomics
    showed changes in plasticity-related and cellular-process genes across many regions, and in cortex
    those changes depended on region, layer and protocol. The logic is the same as with immediate-early
    genes, with far more resolution: the molecular response tracks the pattern of the drive.

