  definition: 'Cytochrome c oxidase, Piezo1, astrocytic TRPA1, CFTR, the lipid bilayer itself, the microbubble,
    the receptor and the installed actuator are all transducers in this sense. Each carries a cell type,
    a subcellular compartment and a species of evidence. Rival transducers are rival edges between the
    same two nodes, each with its own preparation and its own discriminating test.

    '
