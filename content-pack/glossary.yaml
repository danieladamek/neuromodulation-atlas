- id: modulation-versus-initiation
  term: Modulation versus initiation
  kind: science
  variants:
  - initiation of activity
  - modulating ongoing activity
  short: Whether a field changed the firing of an already-active cell or excited a silent one; the two
    have very different thresholds.
  definition: 'Quantifying the sensitivity of nerve cells to an imposed voltage gradient showed, in invertebrate
    neurons, that changing the firing frequency of an already-active cell needs a much smaller gradient
    than exciting a silent one. The asymmetry underwrites the whole low-intensity transcranial field literature,
    which claims modulation rather than initiation. Any coupling edge in this volume must say which claim
    it is making.

    '
  see:
  - uniform-field
