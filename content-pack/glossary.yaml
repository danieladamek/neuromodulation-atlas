- id: convergence
  term: Convergence
  kind: science
  variants:
  - convergence claim
  - convergence edge
  - shared endpoint
  short: The claim that physically unrelated drives meet at the same molecular endpoint; weaker than it
    looks unless the assay is shared.
  definition: 'Five names carry most of the traffic at the subcellular level — BDNF–TrkB, mTOR, the immediate-early
    genes, mitochondrial state, and glial and inflammatory signalling — which is the reason to build one
    graph rather than one per modality. Overstatement is cheap in two specific ways: a shared marker is
    not a shared mechanism, and a marker measured in different preparations is not the same measurement.
    The strongest form of convergence evidence here is the same intervention abolishing several effects
    in one preparation.

    '
