- id: closed-loop-stimulation
  term: Closed-loop stimulation
  kind: methods
  variants:
  - closed loop
  - feedback-controlled stimulation
  - state-gated stimulation
  short: Stimulation whose drive depends on the state it modulates, through a measured control variable
    and a threshold rule.
  definition: 'Feedback control began as a safety device in acoustics, where a hydrophone listened for
    microbubble emissions and pressure was held at a fraction of the emission threshold. In the brain
    the control variable is neural, endogenous beta or stimulation-entrained gamma. Each dose node therefore
    records whether parameters were fixed or feedback-controlled and, if controlled, the control variable,
    the threshold rule, whether the variable was endogenous or stimulation-entrained, and the delivered
    distribution rather than a single value.

    '
