- id: sodium-channel-inactivation
  term: Sodium channel inactivation
  kind: science
  variants:
  - closed-state inactivation
  - channel inactivation
  - sodium channels
  short: The non-conducting state voltage-gated sodium channels enter after or without opening; the mechanism
    modelled for kilohertz conduction block.
  definition: 'Voltage-gated sodium channels can become unavailable either after opening or directly from
    the closed state. An optimised kilohertz waveform was modelled to drive channels into inactivation
    by the closed-state path, which blocks conduction without first firing the axon. The same channel
    state is what makes high-frequency drives able to silence rather than excite.

    '
