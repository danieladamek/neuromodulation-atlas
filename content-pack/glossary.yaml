- id: reproducibility
  term: Reproducibility
  kind: methods
  variants:
  - replication
  - irreproducibility
  - replicability
  short: Whether a result recurs on repetition; in a survey of electrical stimulation researchers only
    about 45–50% said they could routinely reproduce published results.
  definition: 'The same survey''s audit found that the rigorous practices researchers reported were rarely
    documented in papers. Within one person, motor-cortex after-effects repeat poorly across sessions,
    and cross-laboratory replication of phase-triggered effects remains thin. The volume''s reading is
    that effects shrink as controls tighten and samples grow, though no study here measures that direction
    directly.

    '
