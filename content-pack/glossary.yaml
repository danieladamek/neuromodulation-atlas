  - Bayes factors
  short: The ratio of the evidence for two hypotheses; BF10 favours the effect, BF01 the null, so a null
    can be supported rather than merely unrejected.
  definition: 'Bayes factors let a pooled analysis distinguish absence of evidence from evidence of absence,
    which matters for target-engagement claims. In 18 transcutaneous vagal studies (N = 771) the overall
    evidence was anecdotal (g = 0.15, BF01 = 1.0), while pulsed stimulation gave strong evidence for an
    effect (g = 0.36, BF10 = 50.8) and continuous stimulation strong evidence for the null (g = 0.002,
