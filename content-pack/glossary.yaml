  term: Partial agonist
  kind: drug
  variants:
  - partial agonists
  - partial agonism
  short: A ligand that activates its receptor submaximally however high the occupancy; the counterexample
    to a universal occupancy window.
  definition: 'In a dose–response meta-analysis of 110 studies and 37,193 participants, extrapyramidal
    risk rose steeply above roughly 75–85% D2 occupancy for antagonists, but partial agonists such as
    aripiprazole kept that risk low despite high occupancy. The lesson the volume draws is that an occupancy
    window is a property of a drug class rather than of occupancy.

    '
