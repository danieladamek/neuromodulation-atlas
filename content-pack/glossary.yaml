- id: electromyography
  term: Electromyography (EMG)
  kind: methods
  variants:
  - EMG
  - electromyographic
  short: Recording muscle electrical activity; the channel through which motor evoked potentials and rodent
    motor responses are measured.
  definition: 'EMG is the substrate of the field''s most-used human readout: motor threshold, motor evoked
    potentials, input–output curves and paired-pulse measures are all EMG quantities, and pharmaco-TMS-EMG
    is how drug effects are mapped onto stimulation-induced plasticity. In rodents it is also how an ultrasound
    motor response is separated from an auditory one, since envelope smoothing removed the auditory brainstem
    response while leaving the EMG response intact.

    '
