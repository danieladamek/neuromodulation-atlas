- id: connectivity-based-targeting
  term: Connectivity-based targeting
  kind: methods
  variants:
  - connectomic targeting
  - connectivity-derived target
  short: Choosing a stimulation site by its connectivity to a distant region rather than by local anatomy;
    how much outcome variance it explains is disputed.
  definition: 'Using resting-state imaging from 98 healthy subjects, prefrontal coil positions with better
    reported efficacy were more strongly anticorrelated with the subgenual cingulate, inverted into a
    targeting rule. In 295 treated patients the association between actual stimulation site and that region
    was about r = −0.16, roughly 3% of outcome variance, detectable only with electric-field-defined targets,
    with much of it tracking respiration-driven artefact. The dispute is not whether connectivity carries
    information but how much, and under which definition of the target.

    '
