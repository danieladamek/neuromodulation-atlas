- id: depth-focality-tradeoff
  term: Depth–focality tradeoff
  kind: science
  variants:
  - depth-focality tradeoff
  - depth–focality trade-off
  - depth-focality trade-off
  short: The constraint that reaching deeper tissue with a non-invasive field means stimulating a larger
    volume.
  definition: 'Finite-element simulations of 50 TMS coils in a spherical head model found the tradeoff
    in every coil, with tangential spreads as small as 5 cm² for figure-8 designs against 34 cm² for circular
    ones over a similar half-value depth range of 0.9–3.5 cm. All those values are simulated. The tradeoff
    is the reason temporal interference and focused ultrasound are pursued for deep targets.

    '
