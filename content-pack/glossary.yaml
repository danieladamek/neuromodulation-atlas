  term: Cmax
  kind: notation
  variants:
  - C_max
  - peak plasma concentration
  - maximum concentration
  short: The highest plasma concentration reached after a dose; with AUC, the usual summary of exposure.
  definition: 'Cmax captures the peak of an exposure profile where AUC captures its total, and the two
    can dissociate under different routes and schedules. Route and schedule are therefore dose variables:
    the same molecule given as a 60-hour infusion and as a 14-day oral course is a different drive each
    time.

    '
