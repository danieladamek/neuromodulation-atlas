  term: AUC
  kind: notation
  variants:
  - area under the curve
  - area under the concentration-time curve
  short: Area under the plasma concentration–time curve; the standard summary of total systemic drug exposure.
  definition: 'AUC and maximum concentration are the quantities exposure–response analysis links to clinical
    endpoints, and they are what "exposure" usually means in a drug label. In this volume''s terms they
    are plasma exposure, which is a proxy for the target-site exposure that actually matters, so administered
    amount, plasma exposure and target-site exposure are three separate properties.

    '
