- id: current-shunting
  term: Current shunting
  kind: science
  variants:
  - shunted current
  - shunting
  - shunted
  short: Loss of applied current through scalp and skull before it reaches the brain; about 75% of scalp-applied
    current in rodent and human measurements.
  definition: 'Shunting is why scalp currents translate into small cortical fields. Direct measurement
    indicates that roughly three-quarters of scalp-applied current never reaches the brain, and the field
    that does arrive at 2 mA is around 0.8 V/m. Shunting is also the premise of the peripheral account
    of transcranial effects, since skin fields are much stronger than cortical ones.

    '
