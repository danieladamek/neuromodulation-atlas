- id: blood-brain-barrier
  term: Blood–brain barrier
  kind: science
  variants:
  - BBB
  - blood-brain barrier
  - barrier transport
  short: The endothelial interface controlling entry of molecules into brain tissue by passive diffusion
    plus active influx and efflux.
  definition: 'For a drug, the analogue of a device''s field model is a target-site exposure model, and
    the barrier is where most of the uncertainty lives: exposure is set by passive diffusion plus active
    influx and efflux, then by distribution between plasma, brain extracellular fluid and CSF. The authoritative
    review adds that disease-related changes in barrier function rarely yield large gains in penetration,
    and that carrier-based strategies remain more promising for large molecules. Focused ultrasound with
    microbubbles is one way round it.

    '
