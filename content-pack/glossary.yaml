- id: readout
  term: Readout
  kind: methods
  variants:
  - read-out
  - outcome measure
  - dependent measure
  short: The quantity a study actually measures, usually several levels away from the coupling step it
    makes claims about.
  definition: 'What is measured in a stimulation experiment is typically a motor evoked potential, an
    EEG deflection, a pupil diameter or a symptom score. The number of levels between readout and claim
    is the first question to put to a paper, and readouts can disagree: the same protocol potentiated
    a corticospinal measure while leaving EEG measures unchanged. A plasticity edge is only interpretable
    if it carries the readout along with the induction protocol, preparation and species.

    '
