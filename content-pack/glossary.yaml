  term: Convection-enhanced delivery
  kind: methods
  variants:
  - CED
  - convective delivery
  - interstitial infusion
  short: Driving infusate through brain extracellular space by a sustained pressure gradient, so distribution
    follows infusion physics rather than diffusion.
  definition: 'A sustained pressure gradient during interstitial infusion into white matter carried solute
    centimetres rather than millimetres, with volume of distribution scaling linearly with volume infused
    — about 6:1 distribution-to-infusion for a large tracer and about 13:1 for sucrose — reaching local
    concentrations orders of magnitude above achievable systemic levels. Its dose parameters are infusion
    rate, volume, catheter placement and tissue hydraulic conductivity.

    '
