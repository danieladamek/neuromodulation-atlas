- id: oscillation
  term: Oscillation
  kind: science
  variants:
  - oscillations
  - rhythmic activity
  - slow oscillation
  short: Rhythmic population activity treated in this volume as a control variable rather than a by-product.
  definition: 'The circuit level has three working terms — oscillation, phase and coherence — and the
    coherence framework supplies the reason to treat them as control variables. Applied fields can shape
    them: in ferret cortical slices, fields of in-vivo-like amplitude sped up, regularised and entrained
    the slow oscillation, with closed-loop feedback strengthening oscillatory structure under positive
    feedback and weakening it under negative feedback.

    '
