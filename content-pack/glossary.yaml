- id: antidromic-activation
  term: Antidromic activation
  kind: science
  variants:
  - antidromic
  - antidromic recruitment
  short: Action potentials travelling backwards along an axon toward the cell body, by which deep stimulation
    can recruit cortex.
  definition: 'The rival to the informational lesion holds that high-frequency stimulation excites efferent
    axons and recruits cortex antidromically rather than silencing the nucleus. Human recordings show
    the stimulated nucleus is not quiet: pulses evoke a large, focal resonant response within the subthalamic
    nucleus, largest in the dorsal region that is the clinically preferred target and present under general
    anaesthesia.

    '
