- id: coupling-constant
  term: Polarisation coupling constant
  kind: science
  variants:
  - polarization coupling constant
  - polarisation per unit field
  - mV per mV/mm
  short: How much membrane polarisation a unit applied field produces; about 0.12 mV per mV/mm at the
    soma of rat CA1 pyramidal cells.
  definition: 'The coupling constant converts an applied field into a membrane potential change, and it
    is the number that makes transcranial field magnitudes interpretable. Measured in rat hippocampal
    slices along the somato-dendritic axis it is about 0.12 mV per mV/mm at the soma, larger at dendritic
    tips. It is conditional on orientation rather than merely scaled by it: perpendicular fields did not
    polarise the soma at all, yet still changed afferent synaptic responses.

    '
