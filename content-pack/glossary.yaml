  term: Active species
  kind: drug
  variants:
  - acting ligand
  - active metabolite
  - acting compound
  short: The molecule that actually engages the target, which may be a metabolite of the compound administered.
  definition: 'PET and pharmacology in rodents and macaques showed that systemically injected clozapine-N-oxide
    does not enter the brain and has low affinity for the designer receptors it was built for; it is converted
    in vivo to clozapine, which enters and occupies them. Naming an active species is not bookkeeping:
    for ketamine, the nominal compound, a metabolite with no identified receptor, and a downstream requirement
    shared with unrelated drugs are three different edges from drive to molecular endpoint.

    '
