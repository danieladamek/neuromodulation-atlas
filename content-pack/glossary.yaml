- id: tacs
  term: Transcranial alternating current stimulation (tACS)
  kind: methods
  variants:
  - tACS
  - transcranial alternating current stimulation
  - alternating current stimulation
  short: Sinusoidal current at the scalp, intended to entrain ongoing oscillations; its route in humans
    at 1–2 mA is disputed.
  definition: 'In awake macaques, scalp alternating current altered spike timing but not rate, with dose-dependent
    entrainment at human-feasible intensities, and entrainment persisted under topical scalp anaesthesia.
    Against that, skin fields are much stronger than cortical ones, anaesthetising the skin reduced stimulation-induced
    tremor entrainment, and peripheral nerve stimulation alone reproduced the motor effects. Efficacy
    is a function of drive and ongoing state jointly, since stimulation reduced phase locking in neurons
    already strongly locked to an endogenous rhythm.

    '
