- id: mj-per-mm2
  term: mJ/mm²
  kind: notation
  variants:
  - millijoules per square millimetre
  - mJ/mm2
  short: Millijoules per square millimetre, an energy-flux-density unit used for pulsed acoustic devices;
    this volume's optical and acoustic sources report J/cm² and MPa instead.
  definition: 'Energy per unit area can be written in several units, and a newcomer meets them interchangeably:
    1 mJ/mm² equals 100 mJ/cm², or 0.1 J/cm². Transcranial pulse stimulation devices are conventionally
    specified this way, but that family appears in this volume only as a row with no established values,
    and the sources here report optical dose as fluence in J/cm² and irradiance in mW/cm², and acoustic
    dose as pressure in MPa with intensity in W/cm². Any summary dose metric names the measure it uses.

    '
