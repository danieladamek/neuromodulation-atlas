  term: Evoked resonant neural activity (ERNA)
  kind: methods
  variants:
  - ERNA
  - evoked resonant neural activity
  short: A large, focal ringing response evoked in the subthalamic nucleus by stimulation pulses; used
    for target verification rather than control.
  definition: 'Human intraoperative and chronic recordings show pulses evoke a resonant response within
    the nucleus, largest dorsally where the clinically preferred target lies, present under general anaesthesia
    and associated with better clinical performance. It is consistent with driving rather than silencing,
    but as a stimulation-locked population response it does not measure information content.

    '
