- id: rtms
  term: Repetitive TMS (rTMS)
  kind: methods
  variants:
  - rTMS
  - repetitive TMS
  - repetitive transcranial magnetic stimulation
  short: Trains of TMS pulses delivered to produce effects that outlast the stimulation; graded level
    A for depression and neuropathic pain.
  definition: 'Repetitive protocols are defined by frequency, train structure and total pulses, and are
    the main clinical form of TMS. The European guideline grades high-frequency stimulation of left dorsolateral
    prefrontal cortex for depression and of M1 for neuropathic pain as definitely effective against sham.
    In rats, 1 Hz and 10 Hz protocols raised c-Fos in all cortical areas tested while intermittent theta
    burst raised it only in limbic cortices, so the molecular response tracked pattern rather than pulse
    count.

    '
