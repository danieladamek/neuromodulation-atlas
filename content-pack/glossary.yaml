- id: inflammatory-reflex
  term: Inflammatory reflex
  kind: science
  variants:
  - cholinergic anti-inflammatory pathway
  - reflex framing
  - vagal anti-inflammatory pathway
  short: The account in which the nervous system senses and regulates inflammatory state in real time
    through an afferent, central and efferent cholinergic loop.
  definition: 'Vagal stimulation in endotoxaemic rats inhibited hepatic TNF synthesis, blunted peak serum
    TNF and prevented shock, and acetylcholine suppressed cytokine release from stimulated human macrophages
    in vitro; the loop was formalised as a reflex that could be addressed electrically or pharmacologically.
    An audit accepts the molecular chain — including the requirement for splenic noradrenergic terminals,
    choline acetyltransferase-expressing T cells and α7 nicotinic receptors — but rejects the vagus-to-splenic-nerve
    link, since vagal stimulation drives no splenic nerve spikes. One side holds that stimulation engages
    a hard-wired homeostatic loop; the other that it drives a pathway that exists but is not recruited
    by endotoxaemia itself.

    '
