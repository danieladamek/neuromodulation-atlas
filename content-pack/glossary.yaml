- id: dopamine
  term: Dopamine
  kind: science
  variants:
  - dopaminergic
  - dopamine release
  short: A neuromodulator measurable in humans by tracer displacement; prefrontal stimulation released
    it focally in the ipsilateral dorsal caudate.
  definition: 'Left prefrontal repetitive stimulation reduced raclopride binding in the ipsilateral dorsal
    caudate only, with no change in putamen, accumbens or contralateral caudate — one of the volume''s
    few human demonstrations that a cortical drive changes a subcortical transmitter level. Dopamine is
    also a plasticity-gating third factor, and the target of levodopa, where pulsatile and continuous
    exposure of the same receptors are different drives.

    '
