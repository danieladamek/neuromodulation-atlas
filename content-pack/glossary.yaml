  definition: 'Vagal sensory neurons are organised by molecularly defined cell type across the respiratory,
    cardiovascular and digestive systems, and how signals are transduced in these afferents and their
    upstream sentinel cells is much less established than for the external senses. Direction belongs on
    the edge and not in the node name: afferent and efferent routes have different anatomy, different
    transducers and different consequences, and the founding neuroimmune paper distinguishes its efferent
    pathway from an afferent route acting through the HPA axis.

