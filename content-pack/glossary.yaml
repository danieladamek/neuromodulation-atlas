  - interoceptive signalling
  short: Sensing of the body's internal state, carried largely by vagal and other visceral afferents.
  definition: 'The afferent side is where most vagal fibres are, and the volume''s interest in it is practical:
    a cuff or an ear electrode engages a heterogeneous bundle of genetically distinct afferent classes
    rather than a single channel, and the epithelial sensor cells upstream of those afferents are themselves
    poorly characterised as transducers.

