  term: Intranasal delivery
  kind: methods
  variants:
  - intranasal
  - nasal spray
  - nose-to-brain transport
  - direct nose-to-brain transport
  short: Deposition on nasal mucosa, claimed to reach the brain along olfactory and trigeminal routes;
    the direct fraction is unquantified in humans.
  definition: 'The mechanistic review sets out olfactory and trigeminal pathways with perineural and perivascular
    bulk flow as routes that skip the systemic circulation. A systematic appraisal of roughly 100 mostly
    animal studies found only twelve adequately designed to test direct transport, of which two, both
    in rats, indicated it, and reported no human pharmacokinetic evidence that intranasal dosing delivers
    more drug to brain targets than intravenous dosing at comparable systemic exposure; the human olfactory
    area is also proportionally far smaller than the rodent''s. A route can still be decisive in practice,
    as the esketamine registration trial shows.

    '
