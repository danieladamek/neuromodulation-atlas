- id: mechanical-index
  term: Mechanical index (MI)
  kind: notation
  variants:
  - MI
  - MItc
  - transcranial mechanical index
  short: A dimensionless index of an acoustic field's capacity for mechanical bioeffects; consensus classes
    ultrasound at MI ≤ 1.9 as non-significant risk.
  definition: 'The mechanical index normalises peak rarefactional pressure by frequency as a proxy for
    cavitation likelihood, and a transcranial variant exists. The safety consensus classes low-intensity
    transcranial ultrasound as non-significant risk at MI of 1.9 or lower, while stating explicitly that
    its values are expert opinion rather than safety limits, and that more data are needed to locate the
    threshold for significant risk. This volume treats it as neither a regulatory limit nor a mechanism
    claim.

    '
  see:
  - cavitation
  - thermal-dose
  - tus
  sources:
