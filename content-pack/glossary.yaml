- id: sham
  term: Sham
  kind: methods
  variants:
  - sham stimulation
  - sham-controlled
  - sham arm
  - flip-over sham
  - ramp-only sham
  short: A control procedure meant to reproduce a drive's sensations without its intended effect; different
    shams deliver different things.
  definition: 'A sham is a procedure, not an absence of one. The direct-current shams in use differ in
    more than sensation, so some may have biological effects of their own, and ramp-only shams that briefly
    ramp current up and down may be neither physiologically inert nor perceptually convincing during a
    session. In ultrasound, a transducer-off or flipped sham is not acoustically matched, which is why
    work relying on it has been argued to need reinterpretation. Sham stimulation can also have specific
    behavioural effects, so it belongs alongside active controls at another site or time rather than instead
    of them.

    '
  see:
  - blinding
  - co-stimulation
  - active-placebo
  - auditory-confound
