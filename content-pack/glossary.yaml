  kind: drug
  variants:
  - PAM
  - positive allosteric modulators
  short: A ligand that increases a receptor's response to its agonist without activating it directly;
    the mechanism of neurosteroid antidepressants.
  definition: 'The clinical neurosteroids act as positive allosteric modulators at GABA-A receptors rather
    than as agonists. A Cochrane review of five studies in 349 women confirms this distinct mechanism
    but finds the evidence limited and insufficient to recommend these drugs over existing treatments.

    '
