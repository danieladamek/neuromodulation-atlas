  short: The proposal that magnetic fields can gate a ferritin-tethered ion channel; challenged as physically
    impossible by orders of magnitude.
  definition: 'A single-component actuator fusing the cation channel TRPV4 to the paramagnetic protein
    ferritin was reported to give non-invasive magnetic control of neuronal activity across imaging, slice
    and in vivo electrophysiology, and behaviour in zebrafish and mouse. A first-principles analysis then
    showed that the forces, torques and heating required exceed what paramagnetic ferritin can supply
    by roughly five to ten orders of magnitude, so if the reported phenomena are real they must have another
