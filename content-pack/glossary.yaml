  term: Local field potential (LFP)
  kind: methods
  variants:
  - LFP
  - local field potentials
  short: The summed extracellular voltage near a recording contact; the signal used as a control variable
    in adaptive deep brain stimulation.
  definition: 'Subthalamic beta-band local field potentials recorded from the stimulating electrode can
    gate stimulation online, so current flows only when a pathological burst crosses threshold. The same
    signal class is used for target verification through evoked responses, which is a different use: one
    controls delivery, the other confirms placement.

    '
