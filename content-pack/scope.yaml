topic: neurostimulation and neuromodulation — every human-applicable modality, device and pharmacological,
  traced from exogenous drive through biophysical coupling, cellular, subcellular and molecular cascades,
  circuits and body systems to outcome
question: For each way of driving the nervous system from outside, what is actually known about the chain
  from the drive to the outcome, at every level of organisation — and where is each link established,
  inferred or contested? Written so that every mechanism claim can become a node or edge in a graph.
purpose: both — PhD-level teaching and the evidence base for graph schema design, equal weight
lineage: same effort as the Behavioral Physiology neuromodulation extension. The ExogenousDrive → CouplingMechanism
  vocabulary is the starting point; the review reports where the literature fits it and where it does
  not.
graph_edges:
  chain: full chain, evidence-tiered — inferred links are kept and tiered low, never dropped
  contested: competing-hypothesis map — rival hypotheses named, edge property supported | contested
boundary:
  in:
  - every modality applicable to humans, device and pharmacological, with pharmacology a full peer (route
    as a first-class node)
  - optogenetics, chemogenetics, sonogenetics, magnetogenetics as mechanism evidence only
  - dose theory and parameter spaces as published data (E-field, charge, ISPTA/MI, fluence, mg/kg, exposure)
  - biophysical, cellular, subcellular, molecular, circuit and systemic (autonomic, immune, endocrine,
    sensory) levels
  - confounds (sham design, auditory/somatosensory co-stimulation, unblinding) as first-class content
  - ontology anchors for schema design (SCKAN, NPO, UBERON, GO, ChEBI, CL, ECO; DrugMechDB as precedent)
  out:
  - device engineering and manufacturing
  - regulatory and reimbursement detail beyond a one-line status
  - practical clinical protocols — how to deliver or program a treatment
  - recreational or non-clinical drug use; preparation, sourcing and use guidance
  - genetic actuators as chapters in their own right
time_window:
  current_from: 2021
  seminal: any age where the field is built on it
stance: competing-hypothesis map
anchors_note: T1 field-sketch landmarks (Nitsche & Paulus 2000; Huang 2005; Peterchev 2012; Legon 2014;
  Elias 2016; Grossman 2017; Lipsman 2018; Vargas 2023), the SCKAN reference paper (Front Neuroinform
  2025, 10.3389/fninf.2025.1541184; author list to re-verify, sources disagree), the ITRUSST consensus
  papers and DrugMechDB (Sci Data 2023). Builder chooses the rest. Converted to anchors[] entries in T3.
interview:
  T0:
    delivery: private repo, changed mid-session to public Pages
    lineage: same effort go broader
    structure: one app in volumes
    purpose: both equal weight
  roundA:
    boundary: human-applicable + tools as evidence
    chain: full chain evidence-tiered
    stance: competing-hypothesis map
    first_volume_after_V0: VNS and cranial nerve
  roundB:
    V0_depth: beyond deep, ~20k words / 120+ refs
    exclusions: all four offered
    slug: neuromodulation-atlas
    anchors: sketch landmarks + SCKAN
depth: textbook
volumes_plan:
  form: one app in volumes; one commissioned review per volume, one KICKOFF per volume, shared glossary
    and evidence tiers
  volumes:
  - id: V0
    title: Foundations — dose, levels of organisation, coupling physics, shared endpoints, evidence and
      confounds, modality map
    depth: textbook
  - id: V1
    title: Vagus and cranial nerve stimulation (cervical VNS, taVNS, trigeminal, hypoglossal, occipital)
    depth: deep
  - id: V2+
    title: remaining families, order TBD — DBS/aDBS; ECT/MST; TMS; tES/TI; SCS/PNS/FES/ICMS/BCI; ultrasound
      (TUS, HIFU, BBB opening, TPS, peripheral FUS); tPBM; pharmacology and routes; other (GVS, eTNS,
      40 Hz sensory, tSMS, cortical cooling)
    depth: deep
